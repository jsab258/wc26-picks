<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WC26 Picks</title>
<style>
  :root { --bg:#0f1115; --card:#191d24; --line:#2a2f3a; --txt:#e8eaed; --dim:#9aa0aa;
          --pick:#4ade80; --draw:#fbbf24; --wash:#60a5fa; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         padding:14px 12px 40px; max-width:560px; margin:0 auto; }
  h1 { font-size:18px; margin:0 0 2px; letter-spacing:.5px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:12px; }
  button { width:100%; padding:14px; font-size:16px; font-weight:600; border:0; border-radius:12px;
           background:#2563eb; color:#fff; margin-bottom:14px; cursor:pointer; }
  button:active { background:#1d4ed8; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:12px 14px; margin-bottom:10px; }
  .k { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.4px; }
  .match { font-size:16px; font-weight:600; margin:2px 0 8px; }
  .row { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .pick { font-size:26px; font-weight:800; color:var(--pick); letter-spacing:1px; }
  .odds { color:var(--dim); font-size:13px; font-variant-numeric:tabular-nums; }
  .tag { display:inline-block; font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px;
         text-transform:uppercase; letter-spacing:.3px; margin-top:8px; }
  .tag.draw { background:rgba(251,191,36,.15); color:var(--draw); }
  .tag.wash { background:rgba(96,165,250,.13); color:var(--wash); }
  .note { color:var(--dim); font-size:12px; margin-top:6px; }
  .status { color:var(--dim); font-size:12px; text-align:center; margin-top:16px; }
  .err { color:#f87171; }
  .live { color:var(--draw); font-weight:700; }
</style>
</head>
<body>
<h1>⚽ WC26 — Picks</h1>
<div class="sub">EV-max engine · draws suppressed · KO smart-bump · draw-spot flags</div>
<button onclick="run()">↻ Refresh live odds &amp; picks</button>
<div id="out"><div class="status">Tap refresh to load the latest picks.</div></div>
<div id="status" class="status"></div>

<script>
// ---- config (mirrors wc2026_picks.py) ----
const KEY = "f4b1bac2254ea23f46cadc276963d40c";
const BASE = "https://api.the-odds-api.com/v4/sports/soccer_fifa_world_cup/odds";
const MAXG=8, SHOW=6, GROUP_END=Date.parse("2026-06-27T23:59:59Z");
const DRAW_DIFF=true, DRAWSPOT=0.26;
const FACT=[1,1,2,6,24,120,720,5040,40320];

function pmf(lam){ let v=[],s=0; for(let k=0;k<=MAXG;k++){const x=Math.exp(-lam)*Math.pow(lam,k)/FACT[k]; v.push(x); s+=x;} return v.map(x=>x/s); }
function metrics(lh,la,line){
  const a=pmf(lh), b=pmf(la);
  let pd=0; for(let k=0;k<=MAXG;k++) pd+=a[k]*b[k];
  let ph=0, bpre=0; for(let i=0;i<=MAXG;i++){ ph+=a[i]*bpre; bpre+=b[i]; }
  const pa=1-pd-ph;
  let over=null;
  if(line!=null){ const thr=Math.floor(line); let cum=0;
    for(let i=0;i<=Math.min(thr,MAXG);i++) for(let j=0;j<=Math.min(thr-i,MAXG);j++) cum+=a[i]*b[j];
    over=1-cum; }
  return [ph,pd,pa,over];
}
function fitLambdas(ph,pd,pa,pOver,line){
  const err=(lh,la)=>{ const m=metrics(lh,la,line); let e=(m[0]-ph)**2+(m[1]-pd)**2+(m[2]-pa)**2;
    if(pOver!=null && m[3]!=null) e+=(m[3]-pOver)**2; return e; };
  let best=[Infinity,1.2,1.0];
  for(let lh=0.15; lh<=4.5001; lh+=0.05){ for(let la=0.15; la<=4.5001; la+=0.05){
    const e=err(lh,la); if(e<best[0]) best=[e,lh,la]; } }
  const blh=best[1], bla=best[2];
  for(let d=-9; d<10; d++){ const lh=+(blh+0.01*d).toFixed(3); if(lh<=0)continue;
    for(let e2=-9; e2<10; e2++){ const la=+(bla+0.01*e2).toFixed(3); if(la<=0)continue;
      const er=err(lh,la); if(er<best[0]) best=[er,lh,la]; } }
  return [best[1],best[2]];
}
function buildMatrix(lh,la){ const a=pmf(lh),b=pmf(la),M=[];
  for(let i=0;i<=MAXG;i++){ const r=[]; for(let j=0;j<=MAXG;j++) r.push(a[i]*b[j]); M.push(r); } return M; }
function bestScores(M,stage){
  const g=M.length-1; let ph=0,pd=0,pa=0,dt=0;
  const hm=Array(g+1).fill(0), am=Array(g+1).fill(0), dd={};
  for(let x=0;x<=g;x++) for(let y=0;y<=g;y++){ const p=M[x][y]; hm[x]+=p; am[y]+=p;
    const d=x-y; dd[d]=(dd[d]||0)+p; if(d>0)ph+=p; else if(d===0){pd+=p;dt+=p;} else pa+=p; }
  const W = stage==='KO'? [10,2,2,6] : [5,1,1,3];
  const out=[];
  for(let i=0;i<=SHOW;i++) for(let j=0;j<=SHOW;j++){
    const tend = i>j?ph:(i===j?pd:pa);
    const diff = i===j ? (DRAW_DIFF?dt:0) : (dd[i-j]||0);
    out.push([W[0]*tend+W[1]*hm[i]+W[2]*am[j]+W[3]*diff, i, j]);
  }
  out.sort((a,b)=>b[0]-a[0]); return out;
}
function pickFor(M,stage){
  const r=bestScores(M,stage);
  let cand=r.filter(t=>t[1]!==t[2]); if(!cand.length) cand=r;
  let i=cand[0][1], j=cand[0][2];
  if(stage==='KO' && ((i===1&&j===0)||(i===0&&j===1))){
    const tg = i>j? [[2,1],[2,0]] : [[1,2],[0,2]];
    const c2 = r.filter(t=>tg.some(x=>x[0]===t[1]&&x[1]===t[2]));
    if(c2.length){ const b=c2.reduce((a,x)=>x[0]>a[0]?x:a); i=b[1]; j=b[2]; }
  }
  return [i,j];
}
const med=a=>{ const s=[...a].sort((x,y)=>x-y),n=s.length; return n? (n%2? s[(n-1)/2] : (s[n/2-1]+s[n/2])/2) : null; };
function aggregate(m){
  const home=m.home_team, away=m.away_team, h2h=[], ou=[];
  for(const bk of (m.bookmakers||[])){
    const mk={}; for(const x of (bk.markets||[])) mk[x.key]=x;
    if(mk.h2h){ const pr={}; for(const o of mk.h2h.outcomes) pr[o.name]=o.price;
      const oh=pr[home],od=pr['Draw'],oa=pr[away];
      if(oh&&od&&oa){ const inv=[1/oh,1/od,1/oa],s=inv[0]+inv[1]+inv[2]; h2h.push([inv[0]/s,inv[1]/s,inv[2]/s]); } }
    if(mk.totals){ const ov={},un={}; for(const o of mk.totals.outcomes){ if(o.name==='Over')ov[o.point]=o.price; else if(o.name==='Under')un[o.point]=o.price; }
      for(const pt in ov){ if(un[pt]){ const io=1/ov[pt],iu=1/un[pt]; ou.push([io/(io+iu), parseFloat(pt)]); } } }
  }
  if(!h2h.length) return null;
  let ph=med(h2h.map(x=>x[0])), pd=med(h2h.map(x=>x[1])), pa=med(h2h.map(x=>x[2]));
  const s=ph+pd+pa; ph/=s; pd/=s; pa/=s;
  let pOver=null, line=null;
  if(ou.length){ const c={}; ou.forEach(([,l])=>{const k=l.toFixed(2); c[k]=(c[k]||0)+1;});
    const lk=Object.keys(c).sort((a,b)=> c[b]-c[a] || Math.abs(+a-2.5)-Math.abs(+b-2.5))[0];
    line=+lk; pOver=med(ou.filter(([,l])=>l.toFixed(2)===lk).map(([p])=>p)); }
  return {home,away,commence:m.commence_time,ph,pd,pa,pOver,line};
}
const stageFor=c=> Date.parse(c) <= GROUP_END ? 'GROUP' : 'KO';

async function run(){
  const out=document.getElementById('out'), st=document.getElementById('status');
  out.innerHTML='<div class="status">Fetching live odds…</div>'; st.textContent='';
  try{
    const res=await fetch(`${BASE}?regions=eu,uk&markets=h2h,totals&oddsFormat=decimal&apiKey=${KEY}`);
    if(!res.ok) throw new Error('API '+res.status+' — '+(res.status===401?'key/quota issue':'try again'));
    const rem=res.headers.get('x-requests-remaining');
    const data=await res.json();
    const now=Date.now(), rows=[];
    for(const m of data){
      const a=aggregate(m); if(!a) continue;
      if(Date.parse(a.commence) < now - 2*3600*1000) continue;  // hide games kicked off >2h ago
      const st2=stageFor(a.commence);
      const [lh,la]=fitLambdas(a.ph,a.pd,a.pa,a.pOver,a.line);
      const [i,j]=pickFor(buildMatrix(lh,la), st2);
      rows.push({...a, pick:i+'-'+j, ds:a.pd>=DRAWSPOT});
    }
    rows.sort((x,y)=>Date.parse(x.commence)-Date.parse(y.commence));
    if(!rows.length){ out.innerHTML='<div class="status">No upcoming games priced right now.</div>'; return; }
    out.innerHTML = rows.map(r=>{
      const d=new Date(r.commence);
      const when=d.toLocaleString([], {weekday:'short', hour:'2-digit', minute:'2-digit'});
      const live = Date.parse(r.commence) < now ? ' <span class="live">• LIVE/soon</span>' : '';
      const tag = r.ds ? '<span class="tag draw">draw-spot · gap can move</span>'
                       : '<span class="tag wash">wash · safe</span>';
      return `<div class="card">
        <div class="k">${when}${live}</div>
        <div class="match">${r.home} v ${r.away}</div>
        <div class="row"><div class="pick">${r.pick}</div>
          <div class="odds">${Math.round(r.ph*100)} / ${Math.round(r.pd*100)} / ${Math.round(r.pa*100)}</div></div>
        <div>${tag}</div>
      </div>`;
    }).join('');
    st.innerHTML=`Updated ${new Date().toLocaleTimeString()} · ${rows.length} games · ${rem??'?'} API credits left`;
  }catch(e){
    out.innerHTML=`<div class="status err">⚠ ${e.message}</div>`;
    st.textContent='Pull to retry, or check the connection.';
  }
}
run();
</script>
</body>
</html>
