ont-weight="400">District colour and coastline match the original atlas. North is up.</text><text x="50" y="1214" font-size="18" fill="#607073" text-anchor="start" font-weight="400">All times, employers, access and sightlines await simulation.</text><path d="M38,1278 L942,1278" fill="none" stroke="#b9beb3" stroke-width="2"/><text x="38" y="1308" font-size="15" fill="#607073" text-anchor="start" font-weight="400">MERIDIAN  /  1988-1992</text><text x="942" y="1308" font-size="15" fill="#607073" text-anchor="end" font-weight="400">AUTHORED DESIGN</text></svg>