<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1340" viewBox="0 0 980 1340"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="0" y="0" width="980" height="1340" fill="#f5f0e5" stroke="none" stroke-width="1"/><text x="38" y="43" font-size="17" fill="#607073" text-anchor="start" font-weight="700">LEDGER  /  ATLAS 01</text><text x="38" y="94" font-size="40" fill="#253a3d" text-anchor="start" font-weight="700">Mickey’s / behind the bar</text><text x="38" y="125" font-size="16" fill="#607073" text-anchor="start" font-weight="400">OPERATIONAL DESIGN STUDY / NO SOURCE ANCHOR MOVED</text><path d="M38,147 L942,147" fill="none" stroke="#b9beb3" stroke-width="2"/><text x="48" y="200" font-size="27" fill="#253a3d" text-anchor="start" font-weight="700">A / Retained room: capacity study</text><rect x="60" y="260" width="406.35" height="437.84999999999997" fill="#e6decf" stroke="#253a3d" stroke-width="3"/><rect x="77.85" y="365.0" width="115.50000000000001" height="231.00000000000003" fill="#8daba2" stroke="#253a3d" stroke-width="1"/><rect x="87.3" y="374.45" width="86.1" height="102.89999999999999" fill="#adb7b1" stroke="#253a3d" stroke-width="1"/><rect x="87.3" y="489.95000000000005" width="86.1" height="102.89999999999999" fill="#adb7b1" stroke="#253a3d" stroke-width="1"/><rect x="334.05" y="365.0" width="102.89999999999999" height="231.00000000000003" fill="#baa78b" stroke="#253a3d" stroke-width="1"/><rect x="343.5" y="374.45" width="86.1" height="102.89999999999999" fill="#adb7b1" stroke="#253a3d" stroke-width="1"/><rect x="343.5" y="489.95000000000005" width="86.1" height="102.89999999999999" fill="#adb7b1" stroke="#253a3d" stroke-width="1"/><text x="263.175" y="242" font-size="20" fill="#253a3d" text-anchor="middle" font-weight="400">1.935 m</text><text x="245" y="520" font-size="21" fill="#253a3d" text-anchor="middle" font-weight="400">0.67m</text><text x="505" y="260" font-size="21" fill="#607073" text-anchor="start" font-weight="400">One cask line; two stillaged casks</text><text x="505" y="290" font-size="21" fill="#607073" text-anchor="start" font-weight="400">(serving + settling), two reserves.</text><text x="505" y="320" font-size="21" fill="#607073" text-anchor="start" font-weight="400">Modern comparator: 0.41 × 0.49m</text><text x="505" y="350" font-size="21" fill="#607073" text-anchor="start" font-weight="400">per cask, R21; not a period model.</text><text x="505" y="380" font-size="21" fill="#607073" text-anchor="start" font-weight="400"></text><text x="505" y="410" font-size="21" fill="#607073" text-anchor="start" font-weight="400">Cooling unit / drainage / tap reach</text><text x="505" y="440" font-size="21" fill="#607073" text-anchor="start" font-weight="400">still require detailed resolution.</text><text x="505" y="470" font-size="21" fill="#607073" text-anchor="start" font-weight="400">Centre aisle is a space allowance,</text><text x="505" y="500" font-size="21" fill="#607073" text-anchor="start" font-weight="400">not a trolley or handling test.</text><text x="60" y="740" font-size="18" fill="#607073" text-anchor="start" font-weight="400">Delivery → rear door → store, before opening. Empty returns leave the same way.</text><text x="60" y="767" font-size="18" fill="#607073" text-anchor="start" font-weight="400">R13 documents an unusual ground-floor cellar in 2013; R15 explains the work.</text><text x="48" y="850" font-size="26" fill="#253a3d" text-anchor="start" font-weight="700">B / Basement: unadopted</text><text x="505" y="850" font-size="26" fill="#253a3d" text-anchor="start" font-weight="700">C / Yard room: unadopted</text><rect x="70" y="890" width="330" height="70" fill="#b88a6c" stroke="#253a3d" stroke-width="1"/><rect x="120" y="960" width="235" height="110" fill="#859a94" stroke="#253a3d" stroke-width="1"/><path d="M100,950 L160,980 L220,1005 L280,1040" fill="none" stroke="#f5f0e5" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><rect x="525" y="900" width="330" height="160" fill="#e1d2b8" stroke="#253a3d" stroke-width="1"/><rect x="535" y="910" width="95" height="70" fill="#aa8570" stroke="#253a3d" stroke-width="1"/><rect x="735" y="910" width="105" height="140" fill="#859a94" stroke="#253a3d" stroke-width="1"/><text x="60" y="1110" font-size="20" fill="#607073" text-anchor="start" font-weight="400">Requires cellar stair, structure,</text><text x="60" y="1139" font-size="20" fill="#607073" text-anchor="start" font-weight="400">delivery drop and drainage.</text><text x="60" y="1168" font-size="20" fill="#607073" text-anchor="start" font-weight="400">None established by source.</text><text x="505" y="1110" font-size="20" fill="#607073" text-anchor="start" font-weight="400">Takes usable yard and adds a</text><text x="505" y="1139" font-size="20" fill="#607073" text-anchor="start" font-weight="400">longer insulated beer-line run.</text><text x="505" y="1168" font-size="20" fill="#607073" text-anchor="start" font-weight="400">Conflicts with WC/escape review.</text><text x="48" y="1240" font-size="18" fill="#253a3d" text-anchor="start" font-weight="400">The private-door/stair conflict is separate: see mickeys-access.png.</text><path d="M38,1288 L942,1288" fill="none" stroke="#b9beb3" stroke-width="2"/><text x="38" y="1318" font-size="15" fill="#607073" text-anchor="start" font-weight="400">MERIDIAN  /  1988-1992</text><text x="942" y="1318" font-size="15" fill="#607073" text-anchor="end" font-weight="400">AUTHORED DESIGN</text></svg>