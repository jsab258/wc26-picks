<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1510" viewBox="0 0 1120 1510"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="0" y="0" width="1120" height="1510" fill="#f5f0e5" stroke="none" stroke-width="1"/><text x="38" y="43" font-size="17" fill="#607073" text-anchor="start" font-weight="700">LEDGER  /  ATLAS 01</text><text x="38" y="94" font-size="40" fill="#253a3d" text-anchor="start" font-weight="700">Mickey&#x27;s / service and escape</text><text x="38" y="125" font-size="16" fill="#607073" text-anchor="start" font-weight="400">AUTHORING PLAN / ROUTES NOT WALK-TESTED</text><path d="M38,147 L1082,147" fill="none" stroke="#b9beb3" stroke-width="2"/><rect x="240" y="390" width="342" height="456" fill="#b98774" stroke="#253a3d" stroke-width="2"/><text x="411" y="620" font-size="27" fill="#253a3d" text-anchor="middle" font-weight="700">MICKEY&#x27;S</text><rect x="240" y="846" width="342" height="342" fill="#d9c8a6" stroke="#253a3d" stroke-width="2"/><rect x="240" y="846" width="125.4" height="148.20000000000002" fill="#b78f73" stroke="#253a3d" stroke-width="2"/><text x="302.7" y="925.8000000000001" font-size="24" fill="#253a3d" text-anchor="middle" font-weight="700">WC</text><rect x="69" y="1188" width="684" height="136.79999999999998" fill="#e5dfcc" stroke="#253a3d" stroke-width="1"/><rect x="69" y="276" width="513" height="114" fill="#e5dfcc" stroke="#253a3d" stroke-width="1"/><rect x="69" y="276" width="171" height="912" fill="#d2c7b0" stroke="#253a3d" stroke-width="1"/><path d="M425.25,606.6 L425.25,743.4000000000001 L419.54999999999995,863.1 L439.5,1028.4 L536.4000000000001,1199.4 L536.4000000000001,1256.4 L154.5,1256.4 L154.5,304.5 L333.366,304.5" fill="none" stroke="#1d666d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 5"/><path d="M154.5,304.5 L154.5,1256.4 L536.4000000000001,1256.4 L536.4000000000001,1188 L422.4,1045.5 L419.54999999999995,800.4000000000001 L354,760.5" fill="none" stroke="#cf8c28" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 5"/><path d="M502.2,1188 L570.5999999999999,1188" fill="none" stroke="#f5f0e5" stroke-width="10"/><text x="485" y="1172" font-size="17" fill="#253a3d" text-anchor="start" font-weight="400">1.2 m gate</text><text x="690" y="255" font-size="28" fill="#253a3d" text-anchor="start" font-weight="700">A second way out</text><text x="690" y="300" font-size="19" fill="#607073" text-anchor="start" font-weight="400">Yard: 6 × 6 m</text><text x="690" y="329" font-size="19" fill="#607073" text-anchor="start" font-weight="400">Rear lane: 2.4 m</text><text x="690" y="358" font-size="19" fill="#607073" text-anchor="start" font-weight="400">WC: 2.2 × 2.6 m</text><text x="690" y="387" font-size="19" fill="#607073" text-anchor="start" font-weight="400"></text><text x="690" y="416" font-size="19" fill="#607073" text-anchor="start" font-weight="400">Gate to rear lane; turn</text><text x="690" y="445" font-size="19" fill="#607073" text-anchor="start" font-weight="400">south, then west along</text><text x="690" y="474" font-size="19" fill="#607073" text-anchor="start" font-weight="400">the terrace-end passage</text><text x="690" y="503" font-size="19" fill="#607073" text-anchor="start" font-weight="400">back to Quay Street.</text><text x="690" y="532" font-size="19" fill="#607073" text-anchor="start" font-weight="400"></text><text x="690" y="561" font-size="19" fill="#607073" text-anchor="start" font-weight="400">Beer arrives by trolley.</text><text x="690" y="590" font-size="19" fill="#607073" text-anchor="start" font-weight="400">A delivery van stays at</text><text x="690" y="619" font-size="19" fill="#607073" text-anchor="start" font-weight="400">the wider basin route.</text><text x="690" y="648" font-size="19" fill="#607073" text-anchor="start" font-weight="400"></text><text x="690" y="677" font-size="19" fill="#607073" text-anchor="start" font-weight="400">No route crosses a</text><text x="690" y="706" font-size="19" fill="#607073" text-anchor="start" font-weight="400">neighbouring interior.</text><text x="690" y="735" font-size="19" fill="#607073" text-anchor="start" font-weight="400"></text><text x="690" y="764" font-size="19" fill="#607073" text-anchor="start" font-weight="400">Yard wall: 1.8 m</text><text x="690" y="793" font-size="19" fill="#607073" text-anchor="start" font-weight="400">Upper windows overlook</text><text x="690" y="822" font-size="19" fill="#607073" text-anchor="start" font-weight="400">much of the yard.</text><text x="690" y="851" font-size="19" fill="#607073" text-anchor="start" font-weight="400">This is not invisible cover.</text><text x="690" y="940" font-size="19" fill="#1d666d" text-anchor="start" font-weight="400">TEAL: escape intention</text><text x="690" y="974" font-size="19" fill="#aa7424" text-anchor="start" font-weight="400">OCHRE: delivery</text><text x="80" y="1380" font-size="18" fill="#607073" text-anchor="start" font-weight="400">Rear lane runs behind the terrace. Return passage is south of bay 0.</text><text x="50" y="1420" font-size="17" fill="#607073" text-anchor="start" font-weight="400">Plan orientation: up = west / right = north. Atlas north-up connections are in Hook detail.</text><path d="M38,1458 L1082,1458" fill="none" stroke="#b9beb3" stroke-width="2"/><text x="38" y="1488" font-size="15" fill="#607073" text-anchor="start" font-weight="400">MERIDIAN  /  1988-1992</text><text x="1082" y="1488" font-size="15" fill="#607073" text-anchor="end" font-weight="400">AUTHORED DESIGN</text></svg>