<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1250" viewBox="0 0 1060 1250"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="0" y="0" width="1060" height="1250" fill="#f5f0e5" stroke="none" stroke-width="1"/><text x="38" y="43" font-size="17" fill="#607073" text-anchor="start" font-weight="700">LEDGER  /  ATLAS 01</text><text x="38" y="94" font-size="40" fill="#253a3d" text-anchor="start" font-weight="700">Mickey&#x27;s / what can be known</text><text x="38" y="125" font-size="16" fill="#607073" text-anchor="start" font-weight="400">DESIGN INTENT / NOT A PERCEPTION OR ACOUSTIC TEST</text><path d="M38,147 L1022,147" fill="none" stroke="#b9beb3" stroke-width="2"/><rect x="65" y="385" width="480" height="640" fill="#dbd0bb" stroke="#253a3d" stroke-width="1"/><rect x="65" y="225" width="480" height="160" fill="#d4cbb8" stroke="#253a3d" stroke-width="1"/><rect x="84.2" y="409.0" width="64.0" height="345.6" fill="#ada799" stroke="#253a3d" stroke-width="1"/><rect x="369.0" y="577.0" width="48.0" height="336.0" fill="#744634" stroke="#253a3d" stroke-width="1"/><rect x="509.0" y="577.0" width="18.799999999999997" height="336.0" fill="#886146" stroke="#253a3d" stroke-width="1"/><rect x="169.0" y="769.0" width="124.0" height="56.0" fill="#a57a75" stroke="#253a3d" stroke-width="1"/><rect x="82.2" y="841.0" width="154.8" height="166.8" fill="#c3b7a0" stroke="#253a3d" stroke-width="1"/><rect x="249.0" y="413.0" width="244.0" height="38.4" fill="#927258" stroke="#253a3d" stroke-width="1"/><rect x="265.0" y="473.0" width="56.0" height="52.0" fill="#927258" stroke="#253a3d" stroke-width="1"/><rect x="197.0" y="705" width="56.0" height="52.0" fill="#927258" stroke="#253a3d" stroke-width="1"/><rect x="169.0" y="649.0" width="88.0" height="8.0" fill="#927258" stroke="#253a3d" stroke-width="1"/><rect x="373.0" y="593.0" width="36.0" height="36.0" fill="#927258" stroke="#253a3d" stroke-width="1"/><circle cx="305" cy="265.0" r="10" fill="#923f51" stroke="white" stroke-width="2"/><circle cx="321.0" cy="561.0" r="10" fill="#b67e25" stroke="white" stroke-width="2"/><circle cx="201.0" cy="777.0" r="10" fill="#923f51" stroke="white" stroke-width="2"/><circle cx="233.0" cy="769.0" r="10" fill="#2c7775" stroke="white" stroke-width="2"/><path d="M305,265.0 L321.0,561.0" fill="none" stroke="#b67e25" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M305,265.0 L201.0,777.0" fill="none" stroke="#923f51" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><path d="M321.0,649.0 L233.0,769.0" fill="none" stroke="#2c7775" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 6"/><text x="65" y="195" font-size="22" fill="#253a3d" text-anchor="start" font-weight="700">WEST / street observer</text><text x="70" y="1060" font-size="22" fill="#253a3d" text-anchor="start" font-weight="700">EAST / rear doors to yard</text><text x="620" y="260" font-size="25" fill="#253a3d" text-anchor="start" font-weight="700">PARTIAL KNOWLEDGE</text><text x="620" y="300" font-size="20" fill="#607073" text-anchor="start" font-weight="400">Ochre: a potential view of</text><text x="620" y="331" font-size="20" fill="#607073" text-anchor="start" font-weight="400">front-room handling through</text><text x="620" y="362" font-size="20" fill="#607073" text-anchor="start" font-weight="400">the shop window.</text><text x="620" y="393" font-size="20" fill="#607073" text-anchor="start" font-weight="400"></text><text x="620" y="424" font-size="20" fill="#607073" text-anchor="start" font-weight="400">Red: the same observer’s</text><text x="620" y="455" font-size="20" fill="#607073" text-anchor="start" font-weight="400">line to a hand in the snug</text><text x="620" y="486" font-size="20" fill="#607073" text-anchor="start" font-weight="400">meets the 1.45 m screen.</text><text x="620" y="517" font-size="20" fill="#607073" text-anchor="start" font-weight="400"></text><text x="620" y="548" font-size="20" fill="#607073" text-anchor="start" font-weight="400">A standing head may remain</text><text x="620" y="579" font-size="20" fill="#607073" text-anchor="start" font-weight="400">visible above that screen.</text><text x="620" y="610" font-size="20" fill="#607073" text-anchor="start" font-weight="400">It is not total concealment.</text><text x="620" y="641" font-size="20" fill="#607073" text-anchor="start" font-weight="400"></text><text x="620" y="672" font-size="20" fill="#607073" text-anchor="start" font-weight="400">Teal: the overhearing seat.</text><text x="620" y="703" font-size="20" fill="#607073" text-anchor="start" font-weight="400">Bar voices might reach it;</text><text x="620" y="734" font-size="20" fill="#607073" text-anchor="start" font-weight="400">the screen is not a sound wall.</text><text x="620" y="765" font-size="20" fill="#607073" text-anchor="start" font-weight="400"></text><text x="620" y="796" font-size="20" fill="#607073" text-anchor="start" font-weight="400">Curtains, reflections, light,</text><text x="620" y="827" font-size="20" fill="#607073" text-anchor="start" font-weight="400">pose, recognition and timing</text><text x="620" y="858" font-size="20" fill="#607073" text-anchor="start" font-weight="400">all need live testing.</text><text x="65" y="1120" font-size="18" fill="#607073" text-anchor="start" font-weight="400">Morning delivery / lunch regulars / evening return: authored meeting intentions.</text><text x="65" y="1155" font-size="18" fill="#607073" text-anchor="start" font-weight="400">A sightline or nearby seat does not guarantee witnessing, memory or dialogue.</text><path d="M38,1198 L1022,1198" fill="none" stroke="#b9beb3" stroke-width="2"/><text x="38" y="1228" font-size="15" fill="#607073" text-anchor="start" font-weight="400">MERIDIAN  /  1988-1992</text><text x="1022" y="1228" font-size="15" fill="#607073" text-anchor="end" font-weight="400">AUTHORED DESIGN</text></svg>