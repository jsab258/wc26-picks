<text x="44.0" y="150.0" font-family="DejaVu Sans, sans-serif" font-size="11" fill="rgb(28, 26, 24)" text-anchor="start" font-weight="bold">LIT UNITS 7 OF 9. Take the brewery signs out of a 1990 nightlife street and half its illuminated signage goes with them. What is left is</text>
<text x="44.0" y="167.0" font-family="DejaVu Sans, sans-serif" font-size="11" fill="rgb(28, 26, 24)" text-anchor="start" font-weight="bold">FOOD AND FILM: fluorescent behind shop glass, a cinema canopy, one small neon, sodium overhead. That is a better lighting brief than a row</text>
<text x="44.0" y="184.0" font-family="DejaVu Sans, sans-serif" font-size="11" fill="rgb(28, 26, 24)" text-anchor="start" font-weight="bold">of internally lit drink signs, not a worse one, and it is the whole argument of this sheet.</text>
