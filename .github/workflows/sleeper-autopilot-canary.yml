name: Sleeper autopilot canary

# Every day: plan the leagues from live data with the current code, writing
# nothing, and apply the app's safety rules to every plan. A failure means a
# planning bug or that FantasyPros or Sleeper changed something the app relies on;
# GitHub emails you when a scheduled run fails. The log shows only pass/fail.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Plan the leagues from live data
        run: node fantasy/apps-script/dev/canary.js
        env:
          SLEEPER_USERNAME: jsab258
