name: BTC sentiment tracker

on:
  schedule:
    - cron: '23 */6 * * *'   # every 6h (active on the default branch only)
  workflow_dispatch: {}       # manual runs from any branch that has this file

permissions:
  contents: write

concurrency:
  group: btc-sentiment
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Only used when the ANTHROPIC_API_KEY secret is set; harmless otherwise.
      - name: Install Anthropic SDK
        run: pip install --quiet anthropic

      - name: Refresh backtest (weekly, self-skips when fresh)
        run: python scripts/btc_backtest.py

      - name: Fetch, classify, aggregate
        run: python scripts/btc_sentiment.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: btc sentiment snapshot"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
