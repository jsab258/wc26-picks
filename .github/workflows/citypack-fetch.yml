name: LEDGER city pack

# M17.6 — a real texture set for the surfaces `AssetLibrary` already asks for.
#
# WHY THIS IS A WORKFLOW AND NOT A SCRIPT. Every asset host is blocked from the
# dev container, the same way HuggingFace is: ambientcg.com, api.polyhaven.com
# and fonts.google.com all answer 000 through the proxy. So the network half has
# to happen here, and everything that CAN be checked without a network is
# checked locally instead — `pack_check.py` reads the committed pack exactly the
# way `AssetLibrary` will.
#
# TWO JOBS, AND DISPATCHING ONE MUST NOT START THE OTHER. The voice pipeline
# learned this the expensive way: its inventory job was gated only on the event
# name, so asking a cheap question also kicked off a forty-minute fetch. The
# `mode` input is the gate, and each job checks it.
#
# `workflow_dispatch` ONLY. A push must never start this — a code change that
# triggers a download is how three separate runs ended up queued in front of the
# one somebody was waiting on.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inventory (ask the catalogue, download nothing) or fetch"
        required: true
        default: inventory
        type: choice
        options: [inventory, fetch]

# Scoped to the expensive job only, so a cheap inventory never waits behind a
# fetch and neither waits behind anything else in the repo.
concurrency:
  group: citypack-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  inventory:
    if: inputs.mode == 'inventory'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Metadata only. This is the instrument the voice pipeline wished it had
      # on day one: it answers every question about what the catalogue holds,
      # costs one run, and the actual choice is then made locally in seconds.
      - name: Ask the catalogue what exists
        run: python3 tools/citypack/fetch_textures.py --inventory

      - name: Commit the candidate list
        run: |
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          git add tools/citypack/candidates.json
          if git diff --cached --quiet; then
            echo "candidates.json unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "City pack: what the catalogue actually holds

          Metadata only, no images. The choice of which asset answers which
          surface is made locally from this file, which is the fix the voice
          pipeline needed on its first day rather than its fifteenth run."
          for i in 1 2 3 4 5 6; do
            git push origin HEAD:${GITHUB_REF_NAME} && exit 0
            echo "push failed, attempt $i"; sleep $((2 ** i))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citypack-candidates
          path: tools/citypack/candidates.json

  fetch:
    if: inputs.mode == 'fetch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # WHAT WAS THERE BEFORE, READ BEFORE ANYTHING IS WRITTEN. A cancelled run
      # on this project once committed its empty output directory and deleted 24
      # clips Jafar had already listened to and picked from — and the step
      # reported success. Nothing below removes a file, and the count is
      # recorded so the guard can tell a regression from an improvement rather
      # than only noticing that a number moved.
      - name: Count what is already committed
        id: before
        run: |
          n=$(find ledger/Assets/StreamingAssets/CityPack/textures -type f 2>/dev/null | wc -l)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "textures before: $n"

      - name: Fetch the chosen assets
        id: fetch
        run: python3 tools/citypack/fetch_textures.py --fetch

      # THE ARTEFACT, OPENED. Square, power-of-two, non-empty, present under the
      # exact logical name the game looks up, and attributed. Every one of those
      # is invisible from the script that wrote the files.
      - name: Open the pack and check it
        run: |
          python3 tools/citypack/pack_check.py --selftest
          python3 tools/citypack/pack_check.py

      - name: Attribution still holds
        run: python3 tools/attribution-check.py

      # THE GUARD KNOWS WHY IT IS REFUSING. A guard that only asks whether a
      # number went down would throw away a corrected, smaller set — which the
      # first version of the voice guard would have done.
      - name: Commit the pack
        run: |
          before=${{ steps.before.outputs.count }}
          after=$(find ledger/Assets/StreamingAssets/CityPack/textures -type f 2>/dev/null | wc -l)
          echo "textures: $before -> $after"
          if [ "${{ steps.fetch.outcome }}" != "success" ]; then
            echo "the fetch itself failed — refusing to commit whatever is on disk"
            exit 1
          fi
          if [ "$after" -eq 0 ]; then
            echo "nothing on disk after a successful fetch — that is the fetch lying"
            exit 1
          fi
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          git add ledger/Assets/StreamingAssets/CityPack
          if git diff --cached --quiet; then
            echo "pack unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "M17.6 — the city has surfaces

          $after texture(s) under the twelve logical names AssetLibrary has
          asked for since it was written. CC0, attributed in ATTRIBUTION.json
          and in THIRD-PARTY.md. No code change: the pack path and the
          procedural fallback have both existed for months and nothing had ever
          been put in the directory."
          for i in 1 2 3 4 5 6; do
            git push origin HEAD:${GITHUB_REF_NAME} && exit 0
            echo "push failed, attempt $i"; sleep $((2 ** i))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citypack
          path: ledger/Assets/StreamingAssets/CityPack
