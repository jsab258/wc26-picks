# WHY THIS IS TWO FILES AND NOT ONE WITH A CONDITION.
#
# It was one file that routed on `github.event.commits.*.added` — inventory when
# the workflow changed, fetch when `choices.json` did. On the commit that added
# `choices.json` the INVENTORY ran and the FETCH was SKIPPED: exactly backwards.
#
# `github.event.commits.*.added` is an array of arrays, and `join()` does not
# flatten it the way the expression assumed, so both `contains` were false and
# the negated one won. The run reported SUCCESS while doing nothing anybody
# wanted — a silent no-op, which is the failure this project keeps finding in
# its own guards.
#
# GitHub evaluates `paths:` itself and gets it right. So the routing is a path
# filter in two files rather than an expression in one, and there is no
# condition left to be wrong.

name: LEDGER city pack — fetch

# TAKE WHAT WAS DECIDED. Runs when `choices.json` changes and on nothing else,
# because committing that file IS the decision that a download should happen.
# A code change must never start one: three corpus runs once ended up queued in
# front of the one somebody was waiting on, and one was queued behind a run of
# the problem it would have fixed.
on:
  push:
    branches: [claude/game-dev-ai-automation-2h67ix]
    paths:
      - "tools/citypack/choices.json"
  workflow_dispatch:

concurrency:
  group: citypack-fetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # WHAT WAS THERE BEFORE, READ BEFORE ANYTHING IS WRITTEN. A cancelled run
      # on this project once committed its empty output directory and deleted 24
      # clips Jafar had already listened to and picked from — and the step
      # reported success. Nothing below removes a file, and the count is
      # recorded so the guard can tell a regression from an improvement rather
      # than only noticing that a number moved.
      - name: Count what is already committed
        id: before
        run: |
          n=$(find ledger/Assets/StreamingAssets/CityPack/textures -type f 2>/dev/null | wc -l)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "textures before: $n"

      # Validated against the committed catalogue with no network, so a typo
      # fails in a second rather than as a surface that silently did not arrive.
      - name: Validate the choices offline
        run: python3 tools/citypack/fetch_textures.py --validate

      # THE FONT FIRST, AND INDEPENDENTLY OF THE TEXTURES.
      #
      # It ran second and never ran at all: the texture fetch exited 1 on all
      # twelve surfaces, the step failed, and `bash -e` took the job down with
      # it — so a one-file download that shares nothing with the texture path
      # except a blocked host was lost to an unrelated failure. Two fetches from
      # two libraries are two facts, and a run should come back knowing both.
      - name: Fetch the typeface
        id: font
        continue-on-error: true
        run: python3 tools/citypack/fetch_font.py --fetch

      - name: Fetch the chosen assets
        id: fetch
        continue-on-error: true
        run: python3 tools/citypack/fetch_textures.py --fetch

      # THE ARTEFACT, OPENED. Square, power-of-two, non-empty, present under the
      # exact logical name the game looks up, and attributed. Every one of those
      # is invisible from the script that wrote the files.
      #
      # Only when the fetch says it wrote something. Opening an empty directory
      # produces a second failure that describes the first one badly and buries
      # it underneath itself.
      #
      # AND IT DOES NOT TAKE THE JOB DOWN WITH IT. This step failing is what
      # discarded the typeface the second time: the textures downloaded, the
      # font downloaded, `pack_check` refused two 1024x512 files, `bash -e`
      # ended the job, and the commit step never ran. Same lesson as the step
      # order above, one level further in — the fix is not to weaken the check,
      # it is to stop an unrelated verdict from being fatal to everything else.
      - name: Open the pack and check it
        id: pack
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: |
          python3 tools/citypack/pack_check.py --selftest
          python3 tools/citypack/pack_check.py

      - name: Attribution still holds
        id: attribution
        continue-on-error: true
        run: python3 tools/attribution-check.py

      # COMMIT WHAT ARRIVED, AND JUDGE EACH THING ON ITSELF.
      #
      # This refused everything when `fetch` failed, so a typeface that
      # downloaded cleanly was discarded because twelve textures from a
      # different library did not turn up. That is the ratchet again, pointing
      # the other way: a guard that cannot tell two outcomes apart throws one of
      # them away. The run still ends red below — committing what arrived is not
      # a claim that everything did.
      #
      # Nothing here deletes, and `git add` names only the two paths this job
      # writes.
      - name: Commit whatever arrived
        run: |
          before=${{ steps.before.outputs.count }}
          after=$(find ledger/Assets/StreamingAssets/CityPack/textures -type f 2>/dev/null | wc -l)
          echo "textures: $before -> $after  (fetch=${{ steps.fetch.outcome }}, font=${{ steps.font.outcome }})"
          if [ "${{ steps.fetch.outcome }}" = "success" ] && [ "$after" -eq 0 ]; then
            echo "nothing on disk after a successful fetch — that is the fetch lying"
            exit 1
          fi
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          # TEXTURES ONLY IF THEY ARRIVED *AND* SURVIVED THE CHECK. Committing a
          # pack the check refused would be the one genuinely bad outcome here:
          # a stretched surface is worse than a procedural one, and it would
          # look shipped.
          if [ "${{ steps.fetch.outcome }}" = "success" ] \
             && [ "${{ steps.pack.outcome }}" = "success" ]; then
            git add ledger/Assets/StreamingAssets/CityPack
          else
            echo "not committing textures (fetch=${{ steps.fetch.outcome }}, pack=${{ steps.pack.outcome }})"
          fi
          git add ledger/Assets/Resources/LedgerSans.* tools/citypack/font-installed.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing arrived that was not already committed"
            exit 0
          fi
          git commit -m "M17.6/M17.9 — surfaces, and a typeface the game owns

          Textures on disk: $after, under the logical names AssetLibrary has
          asked for since it was written. CC0 from ambientCG, attributed in
          ATTRIBUTION.json and THIRD-PARTY.md. The typeface ships with its
          licence file beside it, because that is what the licence requires.

          No code change: the pack path, the procedural fallback and
          UiTheme.LoadFont's Resources lookup all existed already, and nothing
          had ever been put where any of them look."
          # REBASE BEFORE RETRYING. The retry loop was written for flaky
          # networks and treats every rejection as one, so a branch that moved
          # while the job ran gets six identical rejected pushes and the pack is
          # dropped. That is not hypothetical: a push of mine was rejected
          # tonight because the inventory job had committed the catalogue
          # underneath it.
          for i in 1 2 3 4 5 6; do
            git push origin HEAD:${GITHUB_REF_NAME} && exit 0
            echo "push failed, attempt $i — refetching and rebasing"
            git fetch origin ${GITHUB_REF_NAME} || true
            git rebase FETCH_HEAD || { git rebase --abort || true; }
            sleep $((2 ** i))
          done
          exit 1

      # AND THE RUN IS RED IF EITHER FETCH FAILED, named separately so the
      # verdict says which. A job on this project has reported success while
      # producing zero output for every character it was asked for; committing
      # a partial result must never be the thing that hides the other half.
      - name: The verdict, named step by step
        run: |
          bad=0
          [ "${{ steps.font.outcome }}"        = "success" ] || { echo "FONT FETCH FAILED"; bad=1; }
          [ "${{ steps.fetch.outcome }}"       = "success" ] || { echo "TEXTURE FETCH FAILED"; bad=1; }
          [ "${{ steps.pack.outcome }}"        = "success" ] || { echo "PACK CHECK FAILED (or was skipped)"; bad=1; }
          [ "${{ steps.attribution.outcome }}" = "success" ] || { echo "ATTRIBUTION CHECK FAILED"; bad=1; }
          [ "$bad" -eq 0 ] && echo "font, textures, pack check and attribution all green"
          exit $bad

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citypack
          path: ledger/Assets/StreamingAssets/CityPack
