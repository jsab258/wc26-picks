# WHY THIS IS TWO FILES AND NOT ONE WITH A CONDITION.
#
# It was one file that routed on `github.event.commits.*.added` — inventory when
# the workflow changed, fetch when `choices.json` did. On the commit that added
# `choices.json` the INVENTORY ran and the FETCH was SKIPPED: exactly backwards.
#
# `github.event.commits.*.added` is an array of arrays, and `join()` does not
# flatten it the way the expression assumed, so both `contains` were false and
# the negated one won. The run reported SUCCESS while doing nothing anybody
# wanted — a silent no-op, which is the failure this project keeps finding in
# its own guards.
#
# GitHub evaluates `paths:` itself and gets it right. So the routing is a path
# filter in two files rather than an expression in one, and there is no
# condition left to be wrong.

name: LEDGER city pack — fetch

# TAKE WHAT WAS DECIDED. Runs when `choices.json` changes and on nothing else,
# because committing that file IS the decision that a download should happen.
# A code change must never start one: three corpus runs once ended up queued in
# front of the one somebody was waiting on, and one was queued behind a run of
# the problem it would have fixed.
on:
  push:
    branches: [claude/game-dev-ai-automation-2h67ix]
    paths:
      - "tools/citypack/choices.json"
  workflow_dispatch:

concurrency:
  group: citypack-fetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # WHAT WAS THERE BEFORE, READ BEFORE ANYTHING IS WRITTEN. A cancelled run
      # on this project once committed its empty output directory and deleted 24
      # clips Jafar had already listened to and picked from — and the step
      # reported success. Nothing below removes a file, and the count is
      # recorded so the guard can tell a regression from an improvement rather
      # than only noticing that a number moved.
      - name: Count what is already committed
        id: before
        run: |
          n=$(find ledger/Assets/StreamingAssets/CityPack/textures -type f 2>/dev/null | wc -l)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "textures before: $n"

      # Validated against the committed catalogue with no network, so a typo
      # fails in a second rather than as a surface that silently did not arrive.
      - name: Validate the choices offline
        run: python3 tools/citypack/fetch_textures.py --validate

      - name: Fetch the chosen assets
        id: fetch
        run: python3 tools/citypack/fetch_textures.py --fetch

      # AND THE FONT, in the same run. It is one file and one licence, it has
      # the same blocked-host problem, and a second twenty-minute round trip to
      # collect it would be a round trip spent on nothing.
      - name: Fetch the typeface
        id: font
        continue-on-error: true
        run: python3 tools/citypack/fetch_font.py --fetch

      # THE ARTEFACT, OPENED. Square, power-of-two, non-empty, present under the
      # exact logical name the game looks up, and attributed. Every one of those
      # is invisible from the script that wrote the files.
      - name: Open the pack and check it
        run: |
          python3 tools/citypack/pack_check.py --selftest
          python3 tools/citypack/pack_check.py

      - name: Attribution still holds
        run: python3 tools/attribution-check.py

      # THE GUARD KNOWS WHY IT IS REFUSING. A guard that only asks whether a
      # number went down would throw away a corrected, smaller set — which the
      # first version of the voice guard would have done.
      - name: Commit the pack
        run: |
          before=${{ steps.before.outputs.count }}
          after=$(find ledger/Assets/StreamingAssets/CityPack/textures -type f 2>/dev/null | wc -l)
          echo "textures: $before -> $after"
          if [ "${{ steps.fetch.outcome }}" != "success" ]; then
            echo "the fetch itself failed — refusing to commit whatever is on disk"
            exit 1
          fi
          if [ "$after" -eq 0 ]; then
            echo "nothing on disk after a successful fetch — that is the fetch lying"
            exit 1
          fi
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          git add ledger/Assets/StreamingAssets/CityPack
          git add ledger/Assets/Resources/LedgerSans.* tools/citypack/font-installed.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "pack unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "M17.6 — the city has surfaces

          $after texture(s) under the twelve logical names AssetLibrary has
          asked for since it was written. CC0, attributed in ATTRIBUTION.json
          and in THIRD-PARTY.md. No code change: the pack path and the
          procedural fallback have both existed for months and nothing had ever
          been put in the directory."
          for i in 1 2 3 4 5 6; do
            git push origin HEAD:${GITHUB_REF_NAME} && exit 0
            echo "push failed, attempt $i"; sleep $((2 ** i))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citypack
          path: ledger/Assets/StreamingAssets/CityPack
