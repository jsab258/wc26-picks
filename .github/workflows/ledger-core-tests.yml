name: LEDGER core tests

on:
  push:
    paths:
      - "ledger/**"
      - ".github/workflows/ledger-core-tests.yml"
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run core test suite
        run: dotnet run --project ledger/CoreTests -c Release
