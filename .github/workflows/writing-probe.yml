name: writing-probe

# WHAT THE CHARACTERS ACTUALLY SAY.
#
# `writing-judgement-2026-08-03.md` judged the conversation system's INPUTS —
# the prompt, the cards, the anti-slop rules — and could not judge its outputs,
# because not one generated line existed anywhere in the repository. The
# dialogue row of the agency benchmark has read `unjudged` ever since, which is
# honest and useless.
#
# Manual dispatch only, and it costs real API tokens (player authorisation
# 2026-08-03, for this task specifically). Forty calls: four characters,
# ten scripted turns each, six of the ten adversarial.
#
# The transcript is COMMITTED rather than left in the log, for the reason
# everything else here is committed — the artifact host is unreachable from the
# review environment and the log API returns a four-kilobyte tail. A spend
# whose output cannot be read is a spend with nothing to show for it.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model to converse with"
        required: false
        default: "claude-sonnet-5"

permissions:
  contents: write

concurrency:
  group: writing-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # THE DRY RUN FIRST, AND IT IS NOT A FORMALITY. This tool pulls character
      # cards out of C# verbatim string literals; every way that can go wrong
      # produces a plausible transcript of the wrong thing — a complete run, a
      # written file, and a bill. Its dry mode caught three such faults before
      # a single call was made. If it cannot find four cards, this job stops
      # before spending anything.
      - name: Prove the probe finds the cast (no key, no spend)
        run: |
          dotnet run --project ledger/ConvoProbe -c Release -- --dry | tee dry.log
          grep -q "4 card(s)" dry.log || { echo "probe found the wrong cast — not spending"; exit 1; }
          grep -q "lines=NO" dry.log && { echo "a card has no spoken lines — not spending"; exit 1; }
          echo "cast confirmed"

      - name: Converse
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          dotnet run --project ledger/ConvoProbe -c Release -- \
            --model "${{ github.event.inputs.model }}" \
            --out game-design/writing-samples.md

      - name: Commit the transcript
        run: |
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          git add game-design/writing-samples.md
          if git diff --cached --quiet; then
            echo "no transcript produced — nothing to commit"
            exit 1
          fi
          git commit -m "The conversations, as they actually come out

          Generated by the writing probe against the real ConversationEngine.
          Committed because the artifact host is unreachable from the review
          environment and the log API returns a four-kilobyte tail."
          origin="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3 4; do
            if git push "$origin" HEAD:${GITHUB_REF_NAME} > push.log 2>&1; then
              echo "transcript pushed"; exit 0
            fi
            sed "s|${{ secrets.GITHUB_TOKEN }}|***|g" push.log || true
            git fetch "$origin" ${GITHUB_REF_NAME} && git rebase FETCH_HEAD || git rebase --abort || true
            sleep $((2 ** i))
          done
          echo "PUSH FAILED — the transcript did not land"
          exit 1
