name: LEDGER Unreal probe

# D1 MEASUREMENT a AND b, THE MACHINE HALF. Mirrors ledger-build-windows.yml
# in shape and in evidence discipline, deliberately, because that workflow
# learned its rules the hard way and they transfer unchanged.
#
# RUN 1 IS A PROBE OF THE MACHINE, NOT A BUILD, and that is the whole design.
# Nothing here knows yet where UE 5.8.2 installed, whether a C++ toolchain is
# present, or whether a SECOND workflow can reach the evidence channel at all.
# Building a street before those three are facts would produce a failure that
# could mean any of them. So this run answers them and commits the answers;
# the build comes after, when its failures can only mean one thing.
#
# It also produces real D1 input rather than only plumbing: the setup cost of
# the UE path (is a toolchain missing, how big is the install, what does the
# first cold run cost) belongs to measurement a, and it is measured here
# rather than estimated later.
# HOW THIS IS TRIGGERED, and why it is not workflow_dispatch alone.
#
# GitHub only dispatches a `workflow_dispatch` workflow that exists on the
# DEFAULT BRANCH. This repo's default is `main`; the four dispatchable
# workflows all live there, and this one lives on the working branch, so a
# dispatch of it returns 404. Confirmed by dispatching and reading the error,
# not assumed from the docs.
#
# Putting it on `main` is the clean fix and it is NOT MINE TO MAKE: the
# standing instruction is to push only to the working branch, and a
# permission boundary is not something to route around quietly. So this
# workflow triggers on a PUSH THAT TOUCHES ONE SENTINEL FILE, which runs it
# from whatever branch was pushed and needs no access to main.
#
# It stays OPT-IN, which is the property that matters (expensive jobs are
# never automatic here): nothing runs unless production/d1-probe/DISPATCH is
# deliberately changed. Ordinary work on this branch never wakes it.
#
# WHEN THIS FILE REACHES `main`, DELETE THE PUSH TRIGGER AND THE SENTINEL.
# The dispatch entry below is already correct and will start working the
# moment the file is on the default branch; the push trigger is a workaround
# for a permission boundary, not a design, and leaving it in place after the
# boundary moves would be the kind of scaffolding that outlives its reason.
on:
  workflow_dispatch:
  push:
    paths:
      - 'production/d1-probe/DISPATCH'

permissions:
  contents: write

jobs:
  probe-unreal:
    runs-on: [self-hosted, ledger-pc]
    # A CEILING ON A HANG, NOT A TARGET, AND IT MUST SIT ABOVE THE STEP CAPS.
    # It was 25 while the build step said 60, so the job would have killed a
    # legitimate cold build at 25 minutes and the evidence file would have
    # read NO PROBE: a clock running out, wearing the costume of a build
    # fault. Cold linking a Game target against an installed engine is the
    # one step here that can plausibly run long, which is precisely why the
    # measurement must be allowed to finish.
    # RAISED TO 135 WHEN THE VIGNETTE RENDER STEP WAS ADDED, for the same
    # reason it went to 95 and then 115: the job ceiling must sit above the
    # SUM of the step ceilings, or a legitimate slow run is killed by the
    # clock and the evidence file reads as a build fault. The step caps now
    # total 112 (6+1+10+60+15+20) and the commit step has none, so the old
    # 115 left three minutes for the only channel anyone can read.
    timeout-minutes: 135

    steps:
      # THE COMPLETE BOOTSTRAP FROM THE UNITY JOB, VERBATIM.
      # Run 1 of this workflow died on `pwsh: command not found` because I
      # copied this step and dropped its second half: the part that finds
      # PowerShell 7 at its two known locations and puts it on GITHUB_PATH,
      # and the explicit `exit /b 0` that stops cmd's last errorlevel from
      # failing a step that did everything right. pwsh is NOT on that
      # machine's default PATH; the Unity job works because this step puts
      # it there. The comment above the truncated copy said it was copied
      # in shape rather than referenced, which is how a partial copy gets
      # waved through: the justification was for copying, and the copying
      # was the part done badly.
      #
      # DUPLICATION IS THE ROOT AND IT IS QUEUED, NOT FIXED HERE (task 006):
      # both workflows carry this block, and the next drift will be as
      # silent as this one. Extracting it into one script that both call is
      # the right shape, and doing it in the same change that fixes a live
      # bug would put the proven Unity workflow at risk for no reason.
      - name: Checkout
        timeout-minutes: 6
        uses: actions/checkout@v4
        with:
          # The commit step below brings its own credential, exactly as the
          # Unity job does. Nothing else here pushes.
          persist-credentials: false

      - name: tool PATH bootstrap (self-hosted parity)
        timeout-minutes: 1
        shell: cmd
        run: |
          call tools\runner\bootstrap-paths.cmd
          exit /b %ERRORLEVEL%

      # THE PROBE. Every question it asks has a NAMED answer in the output,
      # including the negative ones: "not found" is a measurement, and a
      # missing toolchain is a finding for measurement a rather than a broken
      # run. Nothing in this step may fail the job for a negative answer.
      - name: Probe the machine for Unreal and a C++ toolchain
        id: probe
        timeout-minutes: 10
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $out = "production/d1-probe/ue-machine.txt"
          New-Item -ItemType Directory -Force -Path "production/d1-probe" | Out-Null
          # LINE 1 MUST NAME THE COMMIT, AND RUN 2 SHIPPED IT EMPTY.
          # `git rev-parse --short HEAD` returned nothing here and
          # $ErrorActionPreference=Continue swallowed the reason, so the
          # verdict read "# UE machine probe -  @1788263890": a provenance
          # line with no provenance, which is the one rule every verdict in
          # this project carries. GITHUB_SHA is set by Actions itself, needs
          # no git on PATH and cannot be empty in a real run; the git call
          # stays only as a fallback, and if BOTH are empty the line says so
          # rather than printing a blank where a sha belongs.
          $sha = $env:GITHUB_SHA
          if (-not $sha) { $sha = (git rev-parse HEAD 2>$null) }
          if ($sha) { $sha = $sha.Substring(0, [Math]::Min(7, $sha.Length)) }
          else      { $sha = "SHA-UNKNOWN" }
          $L = @()
          $L += "# UE machine probe - $sha @$([int][double]::Parse((Get-Date -UFormat %s)))"
          $L += "# Line 1 names the commit this was measured on. D1 measurement a, setup cost."
          $L += ""

          # 1. UNREAL. Ask the registry and the usual roots; report every hit
          #    with its version, and print the count so a zero is readable.
          $ueRoots = @()
          $reg = "HKLM:\SOFTWARE\EpicGames\Unreal Engine"
          if (Test-Path $reg) {
            Get-ChildItem $reg | ForEach-Object {
              $p = (Get-ItemProperty $_.PSPath).InstalledDirectory
              if ($p) { $ueRoots += [pscustomobject]@{ ver = $_.PSChildName; path = $p } }
            }
          }
          foreach ($guess in @("C:\Program Files\Epic Games", "D:\Epic Games", "D:\Program Files\Epic Games")) {
            if (Test-Path $guess) {
              Get-ChildItem $guess -Directory -Filter "UE_*" -ErrorAction SilentlyContinue | ForEach-Object {
                if (-not ($ueRoots.path -contains $_.FullName)) {
                  $ueRoots += [pscustomobject]@{ ver = $_.Name.Replace("UE_",""); path = $_.FullName }
                }
              }
            }
          }
          $L += "ueInstalls=$($ueRoots.Count)"
          foreach ($u in $ueRoots) {
            $editor = Join-Path $u.path "Engine\Binaries\Win64\UnrealEditor-Cmd.exe"
            $L += "ue version=$($u.ver) path=$($u.path -replace ' ','~') editorCmd=$(Test-Path $editor)"
          }
          if ($ueRoots.Count -eq 0) { $L += "ue NOT FOUND - registry and the three usual roots were checked" }

          # 2. THE C++ TOOLCHAIN. UE cannot compile a C++ project without it,
          #    and its absence is the single likeliest reason a later build
          #    step fails. Measured now so that failure cannot be ambiguous.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion 2>$null
            $vsp = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>$null
            if ($vs) { $L += "msvc version=$vs path=$($vsp -replace ' ','~')" }
            else     { $L += "msvc NOT FOUND - vswhere present, no VC.Tools workload. THIS BLOCKS A C++ BUILD." }
          } else {
            $L += "msvc NOT FOUND - vswhere absent, so no Visual Studio at all. THIS BLOCKS A C++ BUILD."
          }
          $L += "dotnet=$(if (Get-Command dotnet -EA SilentlyContinue) { (dotnet --version) } else { 'NOT FOUND' })"

          # 3. DISK, because a UE project plus derived data is tens of GB and
          #    running out mid-build is a failure that looks like something else.
          Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free -ne $null } | ForEach-Object {
            $L += ("disk {0} freeGB={1:N1} usedGB={2:N1}" -f $_.Name, ($_.Free/1GB), ($_.Used/1GB))
          }
          $L += ""
          $L += "probeReached=end"
          $L | Set-Content $out -Encoding utf8
          Write-Host ($L -join "`n")

      # THE BUILD, AND IT IS THE FIRST ATTEMPT AT ONE.
      #
      # This is D1 measurement a: the edit-build-test cycle on the UE side,
      # timed, against a port already proven correct under g++ so that a
      # failure here can only be the toolchain. It is written to be
      # INFORMATIVE WHEN IT FAILS rather than to be right first time: the
      # exact UBT invocation for a project-hosted Program target in 5.8 is
      # not something this container can test, so the step captures the full
      # command, the exit code, the elapsed time and the log tail either way.
      # A first build that fails and says exactly how is worth more than a
      # guess that happens to work.
      #
      # Cold and warm are different measurements and the file says which it
      # got: the first build compiles engine headers and is dominated by
      # them; the number D1 actually wants is the SECOND one, which is what
      # an edit-build-test cycle really costs.
      - name: Build the UE probe target and run the golden test
        id: build
        timeout-minutes: 60
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $out = "production/d1-probe/ue-build.txt"
          $sha = $env:GITHUB_SHA
          if ($sha) { $sha = $sha.Substring(0, [Math]::Min(7, $sha.Length)) } else { $sha = "SHA-UNKNOWN" }
          $L = @("# UE probe build - $sha", "")

          $ue = "C:\Program Files\Epic Games\UE_5.8"
          $buildBat = Join-Path $ue "Engine\Build\BatchFiles\Build.bat"
          if (-not (Test-Path $buildBat)) {
            $L += "BUILD TOOL NOT FOUND at $($buildBat -replace ' ','~')"
            $L += "buildReached=end"; $L | Set-Content $out -Encoding utf8
            Write-Host ($L -join "`n"); exit 1
          }
          $proj = Join-Path $PWD "ue-probe\LedgerProbe.uproject"
          $golden = Join-Path $PWD "ue-probe\perception-golden.txt"
          $L += "engine=$($ue -replace ' ','~')"
          $L += "project=$($proj -replace ' ','~')"

          # COLD MEANS COLD, AND FROM RUN 7 ON IT HAS TO BE MADE SO.
          # Run 6 was the first build to compile, so its 1.12 minutes was
          # honestly cold. Every run after it inherits Intermediate/ and
          # Binaries/ from the agent's persistent workspace, so a second
          # "cold" reading would be a warm build wearing a cold label: a
          # number keeping its name after the question it answers moved.
          # Clearing them is one line and it is what makes the series
          # comparable across runs.
          # Packaged/ and Saved/ are cleared for PROVENANCE rather than for
          # timing: a cook that fails would otherwise leave the previous
          # run's binary and log sitting there to be picked up and reported
          # as this run's, which is the fault sim-shots-stage.sh exists for.
          $toClear = @("ue-probe\Intermediate", "ue-probe\Binaries",
                       "ue-probe\Packaged", "ue-probe\Saved")
          $cleared = 0
          foreach ($d in $toClear) {
            if (Test-Path $d) { Remove-Item $d -Recurse -Force -ErrorAction SilentlyContinue; $cleared++ }
          }
          $L += "clearedBeforeCold=$cleared/$($toClear.Count) (Intermediate, Binaries, Packaged, Saved)"

          # COLD BUILD. Timed separately and named, because it is dominated
          # by engine headers and is not the cycle number.
          $args = @("LedgerProbe", "Win64", "Development", "-Project=`"$proj`"", "-WaitMutex", "-NoHotReload")
          $L += "cmd=Build.bat $($args -join ' ')"
          $t0 = Get-Date
          $p = Start-Process -FilePath $buildBat -ArgumentList $args -Wait -PassThru -NoNewWindow `
               -RedirectStandardOutput "build-cold.log" -RedirectStandardError "build-cold.err"
          $coldMin = [math]::Round(((Get-Date) - $t0).TotalMinutes, 2)
          $L += "coldBuildExit=$($p.ExitCode) coldBuildMinutes=$coldMin"
          if ($p.ExitCode -ne 0) {
            $L += "COLD BUILD FAILED. Last 40 lines of output:"
            if (Test-Path "build-cold.log") { $L += (Get-Content "build-cold.log" -Tail 40) }
            if (Test-Path "build-cold.err") { $L += "--- stderr ---"; $L += (Get-Content "build-cold.err" -Tail 20) }
            $L += "buildReached=end"; $L | Set-Content $out -Encoding utf8
            Write-Host ($L -join "`n"); exit 1
          }

          # WARM BUILD: no edit, so this is the floor of a cycle, the cost of
          # asking UBT whether anything changed. The real cycle sits between
          # this and cold, and both bounds are worth having.
          $t1 = Get-Date
          $p2 = Start-Process -FilePath $buildBat -ArgumentList $args -Wait -PassThru -NoNewWindow `
                -RedirectStandardOutput "build-warm.log" -RedirectStandardError "build-warm.err"
          $warmMin = [math]::Round(((Get-Date) - $t1).TotalMinutes, 2)
          $L += "warmBuildExit=$($p2.ExitCode) warmBuildMinutes=$warmMin"

          # COOK AND PACKAGE, WHICH IS THE FIX AND THE MEASUREMENT AT ONCE.
          #
          # Run 7 built cleanly and then the binary died in the async package
          # loader: "Failed to load premade asset registry", then an assertion
          # inside BufferReader on an IO thread. Build.bat compiles code. It
          # does not cook content, and an uncooked game binary crashes trying
          # to read packages that were never produced. Nothing was wrong with
          # the C++.
          #
          # Cooking is also the honest UE cycle. A UE game is not shipped or
          # run from a compile; it is cooked, staged and packaged, and that
          # cost belongs to measurement a as much as the compile does. Timing
          # it separately means the two halves can be compared to Unity's two
          # halves rather than to each other.
          #
          # Failure here is informative and must not eat the build numbers
          # already collected, so it writes what it knows and carries on.
          $uat = Join-Path $ue "Engine\Build\BatchFiles\RunUAT.bat"
          $archive = Join-Path $PWD "ue-probe\Packaged"
          $packagedExe = $null
          if (-not (Test-Path $uat)) {
            $L += "cookSkipped=RunUAT.bat not found at $($uat -replace ' ','~')"
          } else {
            # -nocompileeditor is GONE. A C++ project cannot be cooked without
            # its editor module built, and skipping that compile is what the
            # flag does. The editor build is genuine UE setup cost and belongs
            # in the cold cook number rather than being hidden by a flag that
            # makes the cook fail instead.
            $uatArgs = @("BuildCookRun", "-project=`"$proj`"", "-noP4",
                         "-platform=Win64", "-clientconfig=Development",
                         "-cook", "-build", "-stage", "-pak", "-archive",
                         "-archivedirectory=`"$archive`"", "-utf8output")
            $L += "cookCmd=RunUAT.bat $($uatArgs -join ' ')"
            $t4 = Get-Date
            $p4 = Start-Process -FilePath $uat -ArgumentList $uatArgs -Wait -PassThru -NoNewWindow `
                  -RedirectStandardOutput "cook-cold.log" -RedirectStandardError "cook-cold.err"
            $L += "coldCookExit=$($p4.ExitCode) coldCookMinutes=$([math]::Round(((Get-Date) - $t4).TotalMinutes, 2))"
            if ($p4.ExitCode -ne 0) {
              # A TAIL IS THE WRONG SHAPE FOR A COOK FAILURE AND RUN 10 PROVED
              # IT. The cook ran for 32 seconds and failed; the last 40 lines
              # held shader-thread shutdown chatter and "Cook failed", and the
              # sentence saying WHY was above the window. So the error lines
              # are pulled from the WHOLE log first, and the tail is kept
              # after them as context rather than as the only view. Both caps
              # announce themselves, because a cap nobody is told about is
              # indistinguishable from a finding.
              $L += "COLD COOK FAILED."
              if (Test-Path "cook-cold.log") {
                $all = @(Get-Content "cook-cold.log")
                $errs = @($all | Select-String -Pattern "Error:|Fatal|Cook failed|Missing|Unable to|Could not|Assertion failed" -SimpleMatch:$false)
                $L += "cookLogLines=$($all.Count) cookErrorLines=$($errs.Count)"
                if ($errs.Count -gt 0) {
                  $L += "--- error lines from the whole cook log ---"
                  $L += ($errs | Select-Object -First 40 | ForEach-Object { $_.ToString() })
                  if ($errs.Count -gt 40) { $L += "(+$($errs.Count - 40) more error line(s) not shown)" }
                } else {
                  $L += "--- no line in $($all.Count) matched the error patterns; the tail is all there is ---"
                }
                $L += "--- last 40 lines of the cook log, as context ---"
                $L += ($all | Select-Object -Last 40)
              } else {
                $L += "cookLogLines=0 (no cook-cold.log was written at all)"
              }
              if (Test-Path "cook-cold.err") { $L += "--- cook stderr ---"; $L += (Get-Content "cook-cold.err" -Tail 20) }
            } else {
              # THE INCREMENTAL COOK IS THE CYCLE NUMBER. The first one pays
              # for every shader and every engine asset once; the second is
              # what an edit actually costs, and it is the one comparable to
              # Unity's 2.47 minute warm build.
              $t5 = Get-Date
              $p5 = Start-Process -FilePath $uat -ArgumentList $uatArgs -Wait -PassThru -NoNewWindow `
                    -RedirectStandardOutput "cook-warm.log" -RedirectStandardError "cook-warm.err"
              $L += "warmCookExit=$($p5.ExitCode) warmCookMinutes=$([math]::Round(((Get-Date) - $t5).TotalMinutes, 2))"
            }
            # A STAGED WINDOWS BUILD SHIPS TWO EXES WITH THE SAME NAME, and
            # run 12 ran the wrong one. The one at the archive root is a
            # LAUNCHER STUB that starts the real binary and returns; it
            # exited 1 in two seconds and wrote nothing, which read exactly
            # like the module failing to start. The real binary is the one
            # under Binaries\Win64, so that is what gets preferred, and the
            # count of each kind is printed rather than just a total.
            $pk = @(Get-ChildItem -Path $archive -Filter "LedgerProbe.exe" -Recurse -ErrorAction SilentlyContinue)
            $real = @($pk | Where-Object { $_.FullName -match "\\Binaries\\Win64\\" } |
                      Sort-Object LastWriteTime -Descending)
            $L += "packagedCandidates=$($pk.Count) packagedUnderBinaries=$($real.Count)"
            if ($real.Count -gt 0) { $packagedExe = $real[0] }
            elseif ($pk.Count -gt 0) {
              $packagedExe = ($pk | Sort-Object LastWriteTime -Descending)[0]
              $L += "packagedWarning=no exe under Binaries\Win64; falling back to the archive-root stub"
            }
            if ($packagedExe) {
              $L += "packaged=$($packagedExe.FullName -replace ' ','~')"
              # The staged PROJECT dir is the parent of Binaries, which is
              # what FPaths::ProjectDir returns in a packaged run. The table
              # goes there and beside the binary, and both are named.
              $binDir = Split-Path $packagedExe.FullName -Parent
              $stagedProj = Split-Path (Split-Path $binDir -Parent) -Parent
              $L += "stagedProject=$($stagedProj -replace ' ','~')"
              foreach ($dest in @($binDir, $stagedProj, $archive, (Join-Path $archive "Windows"))) {
                if (Test-Path $dest) {
                  Copy-Item $golden (Join-Path $dest "perception-golden.txt") -Force -ErrorAction SilentlyContinue
                }
              }
            }
          }

          # THE TEST. A build that compiles proves the toolchain; only this
          # proves the port, and it is the same 1221 rows the C# emitted.
          # NEWEST FIRST, AND SAY WHICH. An unordered -First 1 over a recursive
          # glob picks whatever the filesystem hands back, so a stale binary
          # from an earlier attempt could be tested and reported as this
          # build's. Ordering by write time makes that impossible to happen
          # silently, and the count is printed so "one candidate" and "six
          # candidates, took the newest" stop looking identical.
          $cands = @(Get-ChildItem -Path "ue-probe\Binaries" -Filter "LedgerProbe*.exe" -Recurse -ErrorAction SilentlyContinue |
                     Sort-Object LastWriteTime -Descending)
          $L += "binaryCandidates=$($cands.Count)"
          # THE PACKAGED BINARY WINS WHEN THERE IS ONE, because it is the one
          # with cooked content beside it, and content is what run 7 died on.
          # Which one was run is printed: two binaries with one name is the
          # shape that makes a result untraceable.
          if ($packagedExe) { $exe = $packagedExe; $L += "ranBinary=packaged" }
          else              { $exe = $cands | Select-Object -First 1; $L += "ranBinary=uncooked-build-output" }
          # Where a run writes its files: the staged project for a packaged
          # binary, this checkout's project otherwise. Named once and reused,
          # because computing it twice is how the two halves drift apart.
          if ($packagedExe) {
            $b3 = Split-Path $packagedExe.FullName -Parent
            $stagedProjOrCwd = Split-Path (Split-Path $b3 -Parent) -Parent
          } else {
            $stagedProjOrCwd = Join-Path $PWD "ue-probe"
          }
          $L += "runWritesTo=$($stagedProjOrCwd -replace ' ','~')"
          if (-not $exe) {
            $L += "BINARY NOT FOUND under ue-probe after a successful build."
            $L += "buildReached=end"; $L | Set-Content $out -Encoding utf8
            Write-Host ($L -join "`n"); exit 1
          }
          $L += "binary=$($exe.FullName -replace ' ','~') sizeKB=$([math]::Round($exe.Length/1KB))"
          # HANDED TO THE STILL STEP, WHICH IS A SEPARATE STEP FOR A MEASURED
          # REASON. GitHub applies an expression-length limit to a whole `run`
          # block and refuses the DISPATCH, not the commit, when it is
          # exceeded: this step measures 22040 characters against the largest
          # block that has ever been accepted here, 23184. Growing it by the
          # capture would put the only readable channel out of CI within a few
          # comments of unbuildable. Steps do not share PowerShell variables,
          # so the two facts the capture needs travel as outputs, and a build
          # that died before this line publishes nothing at all, which the
          # capture step reports as a still that was never taken.
          "exe=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "projectDir=$stagedProjOrCwd" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          # A GAME TARGET, SO IT IS A GAME: headless flags, and the result
          # comes back in a FILE the module wrote rather than from stdout,
          # because UE's log is noisy and truncated and a file opened by name
          # is the evidence-channel rule the rest of this project runs on.
          # THE RESULT IS LOOKED FOR IN BOTH PLACES A RUN COULD HAVE WRITTEN IT,
          # and every candidate is cleared first: a leftover file from the
          # previous run read as this run's answer is the exact provenance
          # fault the verdict channel exists to prevent.
          $resultCandidates = @((Join-Path $PWD "ue-probe\golden-result.txt"))
          if ($packagedExe) {
            $bd = Split-Path $packagedExe.FullName -Parent
            $resultCandidates += (Join-Path $bd "golden-result.txt")
            $resultCandidates += (Join-Path (Split-Path (Split-Path $bd -Parent) -Parent) "golden-result.txt")
            $resultCandidates += (Join-Path (Join-Path $archive "Windows") "golden-result.txt")
          }
          foreach ($rc in $resultCandidates) { Remove-Item $rc -Force -ErrorAction SilentlyContinue }
          $resultFile = $resultCandidates[0]
          # THE GAME'S OWN OUTPUT IS CAPTURED, which run 6 did not do. It
          # exited 3 in six seconds and left nothing behind, so the run said
          # only that something went wrong and could not say what. A blocked
          # feedback channel is the highest-leverage bug on the board and this
          # is the whole of the repair: redirect the streams, tail the log UE
          # writes itself, and print both whatever the exit code was.
          $gameOut = Join-Path $PWD "game-run.log"
          $gameErr = Join-Path $PWD "game-run.err"
          $t2 = Get-Date
          $p3 = Start-Process -FilePath $exe.FullName `
                -ArgumentList @("-LedgerGoldenTest","-LedgerCommit=$sha","-nullrhi","-unattended","-nosplash","-nopause","-stdout","-FullStdOutLogOutput") `
                -Wait -PassThru -NoNewWindow `
                -RedirectStandardOutput $gameOut -RedirectStandardError $gameErr
          $testSec = [math]::Round(((Get-Date) - $t2).TotalSeconds, 2)
          # gameExit IS NOT THE VERDICT AND IS PRINTED NEXT TO ONE THAT IS.
          # Asking the engine to quit from inside module startup exits 1 by
          # design, so a passing run reads "gameExit=1 probeTest=PASS" and
          # the pair is exactly the shape a later reader misreads. The
          # evidence is the result FILE; the exit code only says the process
          # ended.
          $L += "gameExit=$($p3.ExitCode) testSeconds=$testSec gameExitIsNotTheVerdict=true"
          $found = $resultCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          $L += "resultCandidates=$($resultCandidates.Count) resultFound=$(if ($found) { 'yes' } else { 'no' })"
          if ($found) { $L += "resultFrom=$($found -replace ' ','~')"; $L += (Get-Content $found) }
          else { $L += "probeTest=FAIL reason=no-result-file-written (the module did not reach its write)" }

          # UE's own log, which says why engine init stopped when it stopped.
          # Named explicitly rather than globbed into a directory add: a tail
          # of the WRONG log would be worse than none.
          $logCandidates = @((Join-Path $PWD "ue-probe\Saved\Logs\LedgerProbe.log"))
          if ($packagedExe) {
            $bd = Split-Path $packagedExe.FullName -Parent
            $logCandidates += (Join-Path (Split-Path (Split-Path $bd -Parent) -Parent) "Saved\Logs\LedgerProbe.log")
            $logCandidates += (Join-Path (Join-Path $archive "Windows") "LedgerProbe\Saved\Logs\LedgerProbe.log")
          }
          $ueLog = $logCandidates |
                   Where-Object { Test-Path $_ } |
                   Sort-Object { (Get-Item $_).LastWriteTime } -Descending |
                   Select-Object -First 1
          if ($ueLog) {
            $L += "--- LedgerProbe.log ($($ueLog -replace ' ','~')), last 60 lines ---"
            $L += (Get-Content $ueLog -Tail 60)
          } else {
            $L += "--- no LedgerProbe.log in any of $($logCandidates.Count) location(s): the engine did not get as far as opening one ---"
          }
          if ((Test-Path $gameOut) -and (Get-Item $gameOut).Length -gt 0) {
            $L += "--- game stdout, last 40 lines ---"; $L += (Get-Content $gameOut -Tail 40)
          }
          if ((Test-Path $gameErr) -and (Get-Item $gameErr).Length -gt 0) {
            $L += "--- game stderr, last 20 lines ---"; $L += (Get-Content $gameErr -Tail 20)
          }
          # TASK 007 STEP 1: THE UE-SIDE VERDICT, COLLECTED BY NAME.
          # The game writes it beside its own project; this brings it into
          # the repository under a fixed path so verdict-read.py and every
          # other reader can open it exactly as they open the Unity one.
          # A run that produced none says NO RUN here rather than leaving
          # whatever the last run wrote to pass as this run's.
          $verdictCandidates = @((Join-Path $PWD "ue-probe\ue-verdict.txt"))
          if ($packagedExe) {
            $bd2 = Split-Path $packagedExe.FullName -Parent
            $verdictCandidates += (Join-Path (Split-Path (Split-Path $bd2 -Parent) -Parent) "ue-verdict.txt")
            $verdictCandidates += (Join-Path $bd2 "ue-verdict.txt")
          }
          $ueVerdict = "production/d1-probe/ue-verdict.txt"
          $vfound = $verdictCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          $L += "ueVerdictCandidates=$($verdictCandidates.Count) ueVerdictFound=$(if ($vfound) { 'yes' } else { 'no' })"
          if ($vfound) {
            Copy-Item $vfound $ueVerdict -Force
            $L += "ueVerdictFrom=$($vfound -replace ' ','~')"
          } else {
            @("# UE probe verdict $sha @$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())",
              "# Line 1 names the commit this was measured on, as the Unity verdict does.",
              "",
              "NO RUN - the probe binary wrote no verdict on this commit; nothing here was measured.",
              "verdictReached=end") | Set-Content $ueVerdict -Encoding utf8
          }

          $L += "buildReached=end"
          $L | Set-Content $out -Encoding utf8
          Write-Host ($L -join "`n")

      # TASK 007 STEPS 2 AND 3: ONE STILL, OFFSCREEN, AND A NUMBER PROVING IT
      # IS NOT BLANK.
      #
      # ITS OWN STEP, FOR A MEASURED REASON. The build step above is 20331
      # characters against the largest run block this repository has ever had
      # accepted, 23184, and the limit is enforced at DISPATCH rather than at
      # commit: growing that step would take the only readable channel out of
      # CI with an error nobody sees until the next person tries to build.
      #
      # ITS OWN SWITCH, FOR A REASON THIS PROBE ALREADY PAID FOR. Run 12's
      # cook died because the module ran the golden test inside the cook
      # commandlet's editor and quit before anything was cooked. A module
      # loads in every host that loads it, so the capture is gated on
      # -LedgerShot exactly as the test is gated on -LedgerGoldenTest, and
      # neither is the default: a module handed no switch does nothing, which
      # is what the cook needs from it.
      #
      # -RenderOffScreen, NOT -nullrhi, AND THEY ARE OPPOSITE THINGS. nullrhi
      # means no rendering at all, which is right for the golden run above and
      # produces nothing here. Getting it backwards looks like success.
      #
      # It may fail without costing anything already collected: the golden
      # verdict is written before this step starts.
      - name: Capture a still offscreen and measure its pixels
        id: shot
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        env:
          SHOT_EXE: ${{ steps.build.outputs.exe }}
          SHOT_PROJ: ${{ steps.build.outputs.projectDir }}
          SHOT_SHA: ${{ steps.build.outputs.sha }}
        run: |
          $ErrorActionPreference = "Continue"
          $out = "production/d1-probe/ue-shot-verdict.txt"
          $png = "production/d1-probe/ue-shot.png"
          $log = "production/d1-probe/ue-build.txt"
          New-Item -ItemType Directory -Force -Path "production/d1-probe" | Out-Null
          $sha = $env:SHOT_SHA
          if (-not $sha) {
            $sha = $env:GITHUB_SHA
            if ($sha) { $sha = $sha.Substring(0, [Math]::Min(7, $sha.Length)) } else { $sha = "SHA-UNKNOWN" }
          }
          $epoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          # THE TRACKED COPIES ARE DELETED FIRST, BOTH OF THEM. They are
          # tracked files, so the checkout restored the PREVIOUS run's picture
          # and the previous run's verdict; a run that renders nothing would
          # otherwise leave last week's image in the repository beside a
          # verdict saying no shot was taken, and a reader would attribute the
          # picture to this commit. Deleted here, each exists only if THIS run
          # wrote it, and the staging below records absence as a deletion.
          Remove-Item $png, $out -Force -ErrorAction SilentlyContinue

          $exe = $env:SHOT_EXE
          $proj = $env:SHOT_PROJ
          if ((-not $exe) -or (-not (Test-Path $exe))) {
            # NOTHING MEASURED, IN WORDS, WITH THE REASON NAMED. A build that
            # died before publishing a binary and a capture that failed are
            # different facts and must not read alike.
            @("# UE probe shot $sha @$epoch",
              "# Line 1 names the commit this was measured on, as the Unity verdict does.",
              "",
              "shotStatus=NO-RUN shotReason=build-step-published-no-binary shotPixels=0 shotBytes=0",
              "NOTHING MEASURED - no still was attempted on this commit and no older one is carried forward.",
              "shotReached=end") | Set-Content $out -Encoding utf8
            Write-Host (Get-Content $out -Raw)
            exit 1
          }
          $binDir = Split-Path $exe -Parent
          # NAMED CANDIDATES, CLEARED BEFORE THE RUN. A packaged binary writes
          # beside the STAGED project; an uncooked one writes beside this
          # checkout. Looking in both is fine, and looking in both without
          # clearing them first is how a previous run's file is collected and
          # reported as this one.
          $vCands = @((Join-Path $proj "ue-shot-verdict.txt"),
                      (Join-Path $binDir "ue-shot-verdict.txt"),
                      (Join-Path $PWD "ue-probe\ue-shot-verdict.txt"))
          $pCands = @((Join-Path $proj "ue-shot.png"),
                      (Join-Path $binDir "ue-shot.png"),
                      (Join-Path $PWD "ue-probe\ue-shot.png"))
          foreach ($c in ($vCands + $pCands)) { Remove-Item $c -Force -ErrorAction SilentlyContinue }

          # 960x540 IS A CHOICE ABOUT THE REPOSITORY, NOT ABOUT THE PICTURE.
          # The still is committed on every run, so it is asked for at a size
          # a git history can carry; the verdict prints the size the frame
          # actually came back as, which is the half that would catch the
          # request being ignored.
          $shotArgs = @("-LedgerShot", "-LedgerCommit=$sha", "-RenderOffScreen",
                        "-ResX=960", "-ResY=540", "-windowed",
                        "-unattended", "-nosplash", "-nopause", "-stdout", "-FullStdOutLogOutput")
          $t0 = Get-Date
          $p = Start-Process -FilePath $exe -ArgumentList $shotArgs -Wait -PassThru -NoNewWindow `
               -RedirectStandardOutput "shot-run.log" -RedirectStandardError "shot-run.err"
          $sec = [math]::Round(((Get-Date) - $t0).TotalSeconds, 2)

          $vf = $vCands | Where-Object { Test-Path $_ } | Select-Object -First 1
          $pf = $pCands | Where-Object { Test-Path $_ } | Select-Object -First 1
          $pngBytes = if ($pf) { (Get-Item $pf).Length } else { 0 }
          if ($pf) { Copy-Item $pf $png -Force }

          if ($vf) {
            # THE GAME'S OWN FILE IS THE BASE, header and all: line 1 already
            # names the commit the binary was handed, which is the provenance
            # that matters, and the pixel numbers in it were measured by code
            # that is compiled and run by g++ in ue-probe/tests before any of
            # this was dispatched.
            Copy-Item $vf $out -Force
          } else {
            @("# UE probe shot $sha @$epoch",
              "# Line 1 names the commit this was measured on, as the Unity verdict does.",
              "",
              "shotStatus=NO-VERDICT shotReason=the-shot-run-wrote-no-verdict-file shotPixels=0",
              "NOTHING MEASURED - the binary ran and left no shot verdict; nothing is carried forward.",
              "shotReached=end") | Set-Content $out -Encoding utf8
          }
          # THE STEP'S OWN LINE, KEYS THE GAME CANNOT KNOW. The exit code is
          # not the verdict here for the same reason it is not one above:
          # asking the engine to quit from a ticker exits non-zero by design.
          Add-Content $out ("stagedShotExit=$($p.ExitCode) stagedShotSeconds=$sec " +
            "stagedVerdictCandidates=$($vCands.Count) stagedVerdictFound=$(if ($vf) { 'yes' } else { 'no' }) " +
            "stagedPngCandidates=$($pCands.Count) stagedPngBytes=$pngBytes " +
            "stagedShotExitIsNotTheVerdict=true")

          # THE TRANSCRIPT GOES IN THE LOG FILE, NOT THE VERDICT, so the
          # verdict stays a file of keys. Error lines come from the WHOLE log
          # rather than a tail, because run 10 put the sentence that mattered
          # above a 40-line window, and BOTH caps announce themselves: a cap
          # nobody is told about is indistinguishable from a finding.
          $D = @("", "--- TASK 007 STEP 2, THE STILL ---",
                 "shotCmd=$exe $($shotArgs -join ' ')",
                 "shotExit=$($p.ExitCode) shotSeconds=$sec pngFound=$(if ($pf) { $pf -replace ' ','~' } else { 'none' })")
          $ueLog = @((Join-Path $proj "Saved\Logs\LedgerProbe.log"),
                     (Join-Path $PWD "ue-probe\Saved\Logs\LedgerProbe.log")) |
                   Where-Object { Test-Path $_ } |
                   Sort-Object { (Get-Item $_).LastWriteTime } -Descending | Select-Object -First 1
          if ($ueLog) {
            $all = @(Get-Content $ueLog)
            $errs = @($all | Select-String -Pattern "Error:|Fatal|Warning: Failed|Assertion failed|Screenshot|screenshot|HighResShot|LogRHI|RenderOffScreen")
            $D += "shotLogLines=$($all.Count) shotInterestingLines=$($errs.Count) shotLogFrom=$($ueLog -replace ' ','~')"
            $D += ($errs | Select-Object -First 40 | ForEach-Object { $_.ToString() })
            if ($errs.Count -gt 40) { $D += "(+$($errs.Count - 40) more matching line(s) not shown)" }
            $D += "--- last 30 lines of the shot run's log, as context ---"
            $D += ($all | Select-Object -Last 30)
          } else {
            $D += "shotLogLines=0 (no LedgerProbe.log in either named location after the shot run)"
          }
          if ((Test-Path "shot-run.err") -and (Get-Item "shot-run.err").Length -gt 0) {
            $D += "--- shot stderr, last 20 lines ---"; $D += (Get-Content "shot-run.err" -Tail 20)
          }
          if (Test-Path $log) { Add-Content $log ($D -join "`n") } else { $D | Set-Content $log -Encoding utf8 }

          # THE GUARD. A BLANK FRAME FAILS, and a file-exists check is not a
          # measurement: shotStatus comes from code that decoded the committed
          # PNG and counted its pixels. WROTE is the only pass, and the three
          # ways to be not-WROTE are named separately because they have
          # different next actions.
          $status = "NONE"
          $m = Select-String -Path $out -Pattern "shotStatus=(\S+)" | Select-Object -First 1
          if ($m) { $status = $m.Matches[0].Groups[1].Value }
          Write-Host (Get-Content $out -Raw)
          if ($status -eq "WROTE") { Write-Host "still ok: $status"; exit 0 }
          Write-Host "STILL NOT USABLE: shotStatus=$status (the evidence is committed either way)"
          exit 1

      # PHASE B: THE STREET ITSELF, FOUR FRAMES, FROM THE SHARED JSON.
      #
      # THIS IS THE FIRST TIME UNREAL RENDERS MERIDIAN. Everything before it
      # photographed debug geometry in an empty map to prove the capture path;
      # this builds the 593-piece street out of
      # production/specs/vignette-pieces.json, lights it two ways and takes the
      # four named shots at 1280x720, which are the same four the Unity host
      # takes and the same resolution.
      #
      # ITS OWN STEP AND ITS OWN SWITCH, for the two reasons this workflow has
      # already paid for. The build step measured 20331 characters against a
      # dispatch ceiling of 23184 and GitHub enforces that at DISPATCH, so
      # growing it takes the only readable channel out of CI with an error
      # nobody sees. And a module loads in every host that loads it, which is
      # what killed run 12's cook, so the capture is gated on -LedgerVignette
      # exactly as the golden test is gated on -LedgerGoldenTest.
      #
      # IT RUNS AFTER THE DEBUG SHOT ON PURPOSE. If both fail, the capture
      # path is the suspect; if only this one fails, the street is. Two
      # invocations in one job cost one cook and answer two questions.
      #
      # -RenderOffScreen, NOT -nullrhi. They are opposite things: nullrhi
      # renders nothing at all and is right for the golden run only.
      - name: Render the street vignette and measure its four frames
        id: vignette
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        shell: pwsh
        env:
          SHOT_EXE: ${{ steps.build.outputs.exe }}
          SHOT_PROJ: ${{ steps.build.outputs.projectDir }}
          SHOT_SHA: ${{ steps.build.outputs.sha }}
        run: |
          $ErrorActionPreference = "Continue"
          $out = "production/d1-probe/ue-vignette-verdict.txt"
          $log = "production/d1-probe/ue-build.txt"
          New-Item -ItemType Directory -Force -Path "production/d1-probe" | Out-Null
          $sha = $env:SHOT_SHA
          if (-not $sha) {
            $sha = $env:GITHUB_SHA
            if ($sha) { $sha = $sha.Substring(0, [Math]::Min(7, $sha.Length)) } else { $sha = "SHA-UNKNOWN" }
          }
          $epoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          # THE TRACKED COPIES GO FIRST, ALL OF THEM. They are tracked files,
          # so the checkout restored the PREVIOUS run's pictures and verdict;
          # a run that renders nothing would otherwise leave last night's
          # street in the repository beside a verdict saying nothing was
          # measured, and a reader would attribute the picture to this commit.
          Remove-Item $out -Force -ErrorAction SilentlyContinue
          Get-ChildItem "production/d1-probe" -Filter "ue-vign_*.png" -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue

          $exe = $env:SHOT_EXE
          $proj = $env:SHOT_PROJ
          if ((-not $exe) -or (-not (Test-Path $exe))) {
            @("# UE vignette shot $sha @$epoch",
              "# Line 1 names the commit this was measured on, as the Unity verdict does.",
              "",
              "sceneStatus=NOTHING-EMITTED piecesEmitted=0/0 sceneNote=build-step-published-no-binary",
              "captureStatus=NOTHING-MEASURED shotsWrote=0/0 shotsBlank=0/0 shotsNoFile=0/0",
              "NOTHING MEASURED - no frame was attempted on this commit and no older one is carried forward.",
              "shotReached=end") | Set-Content $out -Encoding utf8
            Write-Host (Get-Content $out -Raw)
            exit 1
          }
          $binDir = Split-Path $exe -Parent

          # THE SHARED JSON IS STAGED WHERE THE BINARY CAN FIND IT, and to
          # BOTH places for the same reason the golden table goes to four: a
          # packaged build's ProjectDir is the STAGED project, not this
          # checkout, and one hard-coded location works in exactly one of the
          # two ways this binary gets run. The binary searches and NAMES the
          # path that answered.
          $spec = "production/specs/vignette-pieces.json"
          $specBytes = 0
          if (Test-Path $spec) {
            $specBytes = (Get-Item $spec).Length
            foreach ($d in @($proj, $binDir, "ue-probe")) {
              if ($d -and (Test-Path $d)) {
                Copy-Item $spec (Join-Path $d "vignette-pieces.json") -Force -ErrorAction SilentlyContinue
              }
            }
          }

          # NAMED CANDIDATES, CLEARED BEFORE THE RUN. Looking in both places
          # is fine; looking in both without clearing them first is how a
          # previous run's file is collected and reported as this one's.
          $vCands = @((Join-Path $proj "ue-vignette-verdict.txt"),
                      (Join-Path $binDir "ue-vignette-verdict.txt"),
                      (Join-Path $PWD "ue-probe\ue-vignette-verdict.txt"))
          foreach ($c in $vCands) { Remove-Item $c -Force -ErrorAction SilentlyContinue }
          foreach ($d in @($proj, $binDir, (Join-Path $PWD "ue-probe"))) {
            if ($d -and (Test-Path $d)) {
              Get-ChildItem $d -Filter "ue-vign_*.png" -ErrorAction SilentlyContinue |
                Remove-Item -Force -ErrorAction SilentlyContinue
            }
          }

          # 1280x720 IS THE UNITY HOST'S ShotWidth AND ShotHeight, character
          # for character. A pair judged at two resolutions is not a pair.
          # The verdict prints the size each frame actually came back as,
          # which is the half that would catch the request being ignored.
          $shotArgs = @("-LedgerVignette", "-LedgerCommit=$sha", "-RenderOffScreen",
                        "-ResX=1280", "-ResY=720", "-windowed",
                        "-unattended", "-nosplash", "-nopause", "-stdout", "-FullStdOutLogOutput")
          $t0 = Get-Date
          $p = Start-Process -FilePath $exe -ArgumentList $shotArgs -Wait -PassThru -NoNewWindow `
               -RedirectStandardOutput "vign-run.log" -RedirectStandardError "vign-run.err"
          $sec = [math]::Round(((Get-Date) - $t0).TotalSeconds, 2)

          $vf = $vCands | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($vf) {
            # THE GAME'S OWN FILE IS THE BASE, header and all: line 1 already
            # names the commit the binary was handed, and every pixel number
            # in it was measured by code compiled and RUN by g++ in
            # ue-probe/tests before any of this was dispatched.
            Copy-Item $vf $out -Force
          } else {
            @("# UE vignette shot $sha @$epoch",
              "# Line 1 names the commit this was measured on, as the Unity verdict does.",
              "",
              "sceneStatus=NOTHING-EMITTED piecesEmitted=0/0 sceneNote=the-run-wrote-no-verdict-file",
              "captureStatus=NOTHING-MEASURED shotsWrote=0/0 shotsBlank=0/0 shotsNoFile=0/0",
              "NOTHING MEASURED - the binary ran and left no vignette verdict; nothing is carried forward.",
              "shotReached=end") | Set-Content $out -Encoding utf8
          }

          # THE FRAMES, COLLECTED BY NAME PREFIX FROM WHICHEVER PLACE THE
          # BINARY WROTE THEM. Copied into the repository under the same
          # names the verdict's shot lines carry, so a reader holding the
          # verdict can open the picture it describes.
          $copied = 0
          $pngBytes = 0
          foreach ($d in @($proj, $binDir, (Join-Path $PWD "ue-probe"))) {
            if (-not $d -or -not (Test-Path $d)) { continue }
            foreach ($f in (Get-ChildItem $d -Filter "ue-vign_*.png" -ErrorAction SilentlyContinue)) {
              $dest = Join-Path "production/d1-probe" $f.Name
              if (-not (Test-Path $dest)) {
                Copy-Item $f.FullName $dest -Force
                $copied++
                $pngBytes += $f.Length
              }
            }
          }

          # THE STEP'S OWN LINE, KEYS THE GAME CANNOT KNOW. The exit code is
          # not the verdict here for the same reason it is not one above:
          # asking the engine to quit from a ticker exits non-zero by design.
          Add-Content $out ("stagedVignExit=$($p.ExitCode) stagedVignSeconds=$sec " +
            "stagedSpecBytes=$specBytes stagedVerdictCandidates=$($vCands.Count) " +
            "stagedVerdictFound=$(if ($vf) { 'yes' } else { 'no' }) " +
            "stagedPngCopied=$copied stagedPngBytes=$pngBytes " +
            "stagedVignExitIsNotTheVerdict=true")

          # THE TRANSCRIPT GOES IN THE LOG FILE, NOT THE VERDICT, so the
          # verdict stays a file of keys. Error lines come from the WHOLE log
          # rather than a tail, because run 10 put the sentence that mattered
          # above a 40-line window, and BOTH caps announce themselves: a cap
          # nobody is told about is indistinguishable from a finding.
          $D = @("", "--- PHASE B, THE STREET IN UNREAL ---",
                 "vignCmd=$exe $($shotArgs -join ' ')",
                 "vignExit=$($p.ExitCode) vignSeconds=$sec vignSpecBytes=$specBytes vignPngCopied=$copied")
          $ueLog = @((Join-Path $proj "Saved\Logs\LedgerProbe.log"),
                     (Join-Path $PWD "ue-probe\Saved\Logs\LedgerProbe.log")) |
                   Where-Object { Test-Path $_ } |
                   Sort-Object { (Get-Item $_).LastWriteTime } -Descending | Select-Object -First 1
          if ($ueLog) {
            $all = @(Get-Content $ueLog)
            $errs = @($all | Select-String -Pattern "Error:|Fatal|Warning: Failed|Assertion failed|Screenshot|screenshot|HighResShot|LogRHI|RenderOffScreen|BasicShapes|LoadObject")
            $D += "vignLogLines=$($all.Count) vignInterestingLines=$($errs.Count) vignLogFrom=$($ueLog -replace ' ','~')"
            $D += ($errs | Select-Object -First 40 | ForEach-Object { $_.ToString() })
            if ($errs.Count -gt 40) { $D += "(+$($errs.Count - 40) more matching line(s) not shown)" }
            $D += "--- last 30 lines of the vignette run's log, as context ---"
            $D += ($all | Select-Object -Last 30)
          } else {
            $D += "vignLogLines=0 (no LedgerProbe.log in either named location after the vignette run)"
          }
          if ((Test-Path "vign-run.err") -and (Get-Item "vign-run.err").Length -gt 0) {
            $D += "--- vignette stderr, last 20 lines ---"; $D += (Get-Content "vign-run.err" -Tail 20)
          }
          if (Test-Path $log) { Add-Content $log ($D -join "`n") } else { $D | Set-Content $log -Encoding utf8 }

          # THE GUARD. ALL is the only pass, and the ways to be not-ALL are
          # named separately because they have different next actions: NONE
          # with a WHOLE scene is a capture fault, PARTIAL is a per-shot
          # fault, and a NOTHING-EMITTED scene line is the street.
          $status = "NONE"
          $m = Select-String -Path $out -Pattern "captureStatus=(\S+)" | Select-Object -First 1
          if ($m) { $status = $m.Matches[0].Groups[1].Value }
          Write-Host (Get-Content $out -Raw)
          if ($status -eq "ALL") { Write-Host "vignette ok: $status"; exit 0 }
          Write-Host "VIGNETTE NOT USABLE: captureStatus=$status (the evidence is committed either way)"
          exit 1

      # THE EVIDENCE CHANNEL, and the two rules the Unity workflow paid for.
      # A run that measured nothing must SAY so rather than committing a
      # stale checkout's file as its own, and every output is staged BY NAME.
      - name: Commit the probe result
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"
        run: |
          set -u
          OUT=production/d1-probe/ue-machine.txt
          BUILDOUT=production/d1-probe/ue-build.txt
          UEVERDICT=production/d1-probe/ue-verdict.txt
          SHOTVERDICT=production/d1-probe/ue-shot-verdict.txt
          # A RUN THAT MEASURED NOTHING SAYS SO. Without this the previous
          # run's file would be committed again under this run's sha, which
          # is the exact fault sim-shots-stage.sh exists to prevent.
          if [ ! -f "$OUT" ] || ! grep -q "probeReached=end" "$OUT"; then
            printf '# UE machine probe - %s\nNO PROBE - the probe step did not reach its end (outcome: %s).\nNothing was measured on this commit; do not read an older file as this run.\n' \
              "$(git rev-parse --short HEAD)" "${PROBE_OUTCOME:-unknown}" > "$OUT"
          fi
          # THE UE VERDICT IS A TRACKED FILE, SO THE CHECKOUT RESTORES THE
          # PREVIOUS RUN'S COPY. If the build step never got as far as
          # replacing it, that older file would be committed under this run's
          # message and read as this run's answer, which is the precise fault
          # sim-shots-stage.sh exists for. So it is checked for THIS commit's
          # sha on line 1 and replaced with NO RUN when it does not carry it.
          # SEVEN CHARS, COMPARED AS A PREFIX. This repo's abbrev is 8 while
          # the value handed to the game is 7, and the project already paid
          # for that mismatch once: an 8-char needle never matches a 7-char
          # haystack, so a perfectly fresh verdict would be condemned as
          # stale on every single run and the guard would look like it was
          # working. Cut to 7 first, which is what the game was given.
          SHORT="$(git rev-parse HEAD | cut -c1-7)"
          if [ ! -f "$UEVERDICT" ] || ! head -1 "$UEVERDICT" | grep -q "$SHORT"; then
            printf '# UE probe verdict %s @%s\n# Line 1 names the commit this was measured on, as the Unity verdict does.\n\nNO RUN - no verdict carrying this commit was produced; do not read an older file as this run.\nverdictReached=end\n' \
              "$SHORT" "$(date -u +%s)" > "$UEVERDICT"
          fi
          # THE SHOT VERDICT GETS THE SAME GUARD AS THE OTHER ONE, and for
          # the same reason: it is a TRACKED file, so the checkout restored
          # the previous run's copy and a capture step that never ran would
          # leave that older file to be committed under this run's message.
          # Seven characters, compared as a prefix, because seven is what the
          # binary was handed; an eight-character needle would condemn every
          # fresh verdict and the guard would look like it was working.
          if [ ! -f "$SHOTVERDICT" ] || ! head -1 "$SHOTVERDICT" | grep -q "$SHORT"; then
            printf '# UE probe shot %s @%s\n# Line 1 names the commit this was measured on, as the Unity verdict does.\n\nshotStatus=NO-RUN shotReason=no-shot-verdict-carrying-this-commit shotPixels=0\nNOTHING MEASURED - no still was taken on this commit; do not read an older file as this run.\nshotReached=end\n' \
              "$SHORT" "$(date -u +%s)" > "$SHOTVERDICT"
          fi
          git config user.name "LEDGER probe"
          git config user.email "probe@ledger.local"
          # STAGED BY NAME, both of them. A build that did not run leaves no
          # file and nothing is invented for it: absent is a fact.
          git add -- "$OUT"
          [ -f "$BUILDOUT" ] && git add -- "$BUILDOUT"
          # STAGED BY NAME, like the other two. The UE verdict is the whole
          # point of task 007 and it must never ride in on a directory add.
          [ -f "$UEVERDICT" ] && git add -- "$UEVERDICT"
          # The still's verdict, by name, exactly as its neighbour. It carries
          # the pixel statistics that decide whether the frame is usable, so a
          # run that loses it loses the only thing that separates a still from
          # a file that exists.
          [ -f "$SHOTVERDICT" ] && git add -- "$SHOTVERDICT"
          # The still, by name, with -A so that its ABSENCE is staged too.
          # The probe step deletes the tracked copy before running, so this
          # path either holds a picture this run rendered or holds nothing,
          # and a plain `git add` would quietly leave a stale one behind.
          git add -A -- production/d1-probe/ue-shot.png 2>/dev/null || true
          # PHASE B, THE SAME TWO RULES. The vignette verdict is a TRACKED
          # file, so a run that never reached the capture would commit last
          # night's four frames and last night's numbers under this run's
          # message. Seven characters, compared as a PREFIX, because seven is
          # what the binary was handed and an eight-character needle would
          # condemn every fresh verdict while looking like a working guard.
          VIGNVERDICT=production/d1-probe/ue-vignette-verdict.txt
          if [ ! -f "$VIGNVERDICT" ] || ! head -1 "$VIGNVERDICT" | grep -q "$SHORT"; then
            printf '# UE vignette shot %s @%s\n# Line 1 names the commit this was measured on, as the Unity verdict does.\n\nsceneStatus=NOTHING-EMITTED piecesEmitted=0/0 sceneNote=no-vignette-verdict-carrying-this-commit\ncaptureStatus=NOTHING-MEASURED shotsWrote=0/0 shotsBlank=0/0 shotsNoFile=0/0\nNOTHING MEASURED - no frame of the street was taken on this commit; do not read an older file as this run.\nshotReached=end\n' \
              "$SHORT" "$(date -u +%s)" > "$VIGNVERDICT"
          fi
          [ -f "$VIGNVERDICT" ] && git add -- "$VIGNVERDICT"
          # The four frames, by NAME PREFIX and never by directory, with -A so
          # that their ABSENCE is staged too. The capture step deletes the
          # tracked copies before running, so these paths either hold pictures
          # this run rendered or hold nothing.
          git add -A -- 'production/d1-probe/ue-vign_*.png' 2>/dev/null || true
          git diff --cached --quiet && { echo "probe result unchanged; nothing to commit"; exit 0; }
          git commit -m "UE machine probe from $(git rev-parse --short HEAD)"
          BR="${GITHUB_REF_NAME}"
          for i in 1 2 3; do
            git pull --rebase --no-edit origin "$BR" || git rebase --abort || true
            if git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BR}"; then
              echo "probe result pushed to $BR"; exit 0
            fi
            sleep $((i * 5))
          done
          echo "could not push the probe result; it is committed locally on the agent"
