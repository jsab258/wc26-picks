# PUBLISH THE GLANCE so it opens on Jafar's phone (production/queue/097).
#
# WHAT THIS RUN OWES. Not "did the job go green": the acceptance is that a
# request to the published URL returns 200 and text/html and carries the page
# THIS COMMIT built. The job therefore requests its own output at the end and
# fails on a stale or foreign body even when every deploy step succeeded. A
# green deploy and a served page are different facts.
#
# WHAT COULD NOT BE MEASURED FROM THE CONTAINER, and is measured HERE instead.
# The agent proxy answers /repos/{o}/{r}/pages with 403 and refuses github.io
# at CONNECT, so the builder could establish that Pages is ENABLED
# (has_pages=true, from the repository API, which the proxy does allow) but not
# WHICH SOURCE it builds from, and could not request the site at all. Step
# "measure Pages before touching it" prints that, on a runner with no proxy.
# Read those keys before reading this run's colour.
#
# WHY THIS IS SAFE TO PUT ON EVERY PUSH. One python run, one artifact upload,
# one deploy: about a minute, no licence seat, no shared runner. Its
# concurrency group is its own name, so it can never queue behind the Windows
# build or imagegen, and nothing else in this repository uses a "pages" group
# (grepped 2026-09-05: citypack-fetch, citypack-inventory and ledger-imagegen
# are the only groups declared).
name: publish-glance

on:
  push:
    branches: [claude/game-dev-ai-automation-2h67ix]
    # The glance reads five sources and nothing else (tools/glance.py names
    # them at the top of the file). A commit that touches none of them cannot
    # change the page, so it does not need a deploy. This filter IS the
    # "rebuilds when the repository changes" promise, scoped to the changes
    # that can move a pixel.
    #
    # THE MAP'S SOURCES ARE THE SECOND GROUP, and they were read out of the
    # tools rather than assumed. tools/map.py names the inventory and the check
    # at the top of the file; its resolve_blocker() opens
    # ledger-v2/respec/decision-register/D<n>-*.md for the record's TITLE and
    # production/queue{,/done}/<n>-*.md for the queue file's NAME, and both
    # strings are rendered into the sheet behind a tile. Measured in the live
    # inventory on 2026-09-05: of 27 entries, 19 carry a D<n> blocker and 2
    # carry a queue-<n> one, so both directories move this page today rather
    # than hypothetically. systems-inventory-check.py's order_names() reads the
    # 27 pinned names out of production/queue/098-*.md, which is the coverage
    # denominator the page prints, so the queue directory is an input twice
    # over. Without these lines the map would publish once and then never
    # rebuild, which is worse than never publishing.
    #
    # THE ONE HOLE, NAMED RATHER THAN PAPERED OVER. The inventory's 61 evidence
    # references resolve against files anywhere in the tree (mostly
    # ledger/Assets/**), and a commit that breaks one flips the check to
    # REFUSED, which turns the map into a refusal page without touching any
    # path below. ledger/Assets/** is NOT listed here: ledger/verify.py runs
    # the same check before every commit, so that break is caught at the gate
    # rather than discovered on his phone, and the next push touching any path
    # below republishes. workflow_dispatch is the manual path meanwhile.
    paths:
      - 'production/outbox/**'
      - 'production/decision-queue.md'
      - 'production/budget.md'
      - 'production/frames/**'
      - 'game-design/sim-shots/**'
      - 'tools/glance.py'
      - 'tools/publish-glance.py'
      - '.github/workflows/publish-glance.yml'
      - 'production/systems-inventory.json'
      - 'tools/systems-inventory-check.py'
      - 'tools/map.py'
      - 'ledger-v2/respec/decision-register/**'
      - 'production/queue/**'
    # THE MAP'S OWN SOURCES, REREAD OUT OF tools/map.py ON 2026-09-07 when the
    # page was rebuilt as a visual map. Each line below is a file the generator
    # names at the top of itself, and a source that cannot trigger a republish
    # is a source that goes stale on his phone.
    #
    # production/next-three.json REPLACES production/NOW.md HERE, and the swap
    # is the whole point of that rebuild: the next-three used to be parsed out
    # of NOW.md's headings, which is a log, and the day the page was rejected
    # it was offering a task run 25 had completed and a task Jafar had
    # superseded that morning. The heading parser is deleted. NOW.md is no
    # longer read by any generator, so it is no longer a trigger; the one small
    # priorities file is, and a re-ruling that did not republish would leave
    # yesterday's plan on his phone.
    #
    # production/stranger-test/** is NEW: the sweep's committed fractions
    # (lieHeard=0/90, realPointed=540/3240) are what stop the memory area
    # reading as healthy and what earn the gossip area its word, so a new sweep
    # must move this page. ue-probe/Source and Config are NEW for the same
    # reason on the other side: the "not started" word under player control is
    # counted in that source every run, and the day a pawn lands the page must
    # say so without anybody remembering to push something else.
    #
    # find_runnables() still walks the .bat files in the repository ROOT, so a
    # new double-click landing must rebuild the page or he learns about it from
    # a transcript again, which is the complaint that produced this page.
    # production/d1-probe/** carries the street's verdict AND the frame this
    # page now embeds. It is already in the list below for the gallery and is
    # NOT repeated here: one entry, two readers.
      - 'production/next-three.json'
      - 'production/stranger-test/**'
      - 'ue-probe/Source/**'
      - 'ue-probe/Config/**'
      - '*.bat'
    # THE GALLERY'S SOURCES ARE THE THIRD GROUP, read out of tools/gallery.py
    # rather than assumed: its SOURCES tuple is production/d1-probe,
    # production/frames and game-design/sim-shots. The last two are already
    # above for the glance; d1-probe is NOT, and it holds the four newest
    # pictures in the repository (measured 2026-09-06: 36 images found, the
    # newest four all under production/d1-probe). Without this line a new
    # Unreal frame would land and the gallery would keep showing yesterday's.
      - 'production/d1-probe/**'
      - 'tools/gallery.py'
    # production/ladder.md IS NEW, 2026-09-09, and it is the source of the
    # first thing on the map: Jafar's visual ladder, seven rungs, one of them
    # current. tools/map.py reads that file and nothing else for those rungs,
    # so a re-ruling that did not republish would leave yesterday's rung
    # highlighted on his phone, which is the exact failure the next-three swap
    # above was made to end.
      - 'production/ladder.md'
    #
    # THE ONE HOLE THIS FILTER CANNOT CLOSE, NAMED RATHER THAN PAPERED OVER.
    # The gallery's world page is read out of the art/atlas-01 BRANCH, and a
    # paths filter only sees the commits pushed to THIS branch. A new atlas
    # commit therefore does not republish, and adding art/atlas-01 to the
    # branches list above would be worse: this job would then check that
    # branch out and publish ITS tools and ITS pages. Two things stand in for
    # it. The world page prints the atlas commit it read, so a stale page says
    # which version it is showing rather than looking current, and
    # workflow_dispatch is the one-click manual path. Anything cleverer is a
    # scheduled job nobody asked for.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-glance
  # LAST-WINS IS THE CORRECT SEMANTIC HERE and the reason this is true rather
  # than the deployment default of false. If three commits land in a minute,
  # publishing the newest page is the whole point and publishing the older two
  # first is wasted deploys against the Pages build rate limit.
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # THE DEPLOYED URL, HANDED TO THE NOTIFY JOB BELOW. A second job cannot
    # read another job's step outputs, and hardcoding the site origin in two
    # places is the second copy nobody updates. The notify job requests THIS
    # url, which is the one this run actually deployed to.
    outputs:
      pageUrl: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # tools/glance.py dates the latest image with
          # "git log --name-only -60", so a depth-1 checkout would silently
          # date every frame by file mtime instead. 200 covers the 60 it asks
          # for with room to spare.
          fetch-depth: 200

      # THE ART BRANCH, FETCHED BY NAME, AND THE READING OF WHETHER IT CAME.
      # actions/checkout fetches the triggering ref only, so without this step
      # `git show origin/art/atlas-01:<path>` finds nothing and the world page
      # correctly says the words nothing measured, which would be a true
      # sentence about a fetch nobody attempted. NOT FATAL on purpose: an art
      # branch that has been renamed or deleted must not take the glance off
      # his phone, and tools/gallery.py prints atlasRef=missing-in-this-checkout
      # with its own counts when this fails.
      - name: fetch the art branch the world page reads, and say if it arrived
        run: |
          set -u
          git fetch --depth=1 origin \
            'refs/heads/art/atlas-01:refs/remotes/origin/art/atlas-01' \
            || echo "atlasFetch=FAILED"
          sha=$(git rev-parse --verify --quiet origin/art/atlas-01 || echo none)
          echo "atlasRef=origin/art/atlas-01 atlasSha=$sha"
          if [ "$sha" = "none" ]; then
            echo "atlasResult=NOTHING-MEASURED (nothing measured: the world"
            echo "page will say so and the other pages are unaffected)"
          else
            n=$(git ls-tree -r --name-only origin/art/atlas-01 -- \
              production/art/atlas-01 | wc -l | tr -d ' ')
            echo "atlasResult=OK atlasFilesOnThatBranch=$n"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: measure Pages before touching it
        id: before
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          code=$(curl -sS -o /tmp/pages-before.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" || echo 000)
          echo "pagesApiHttp=$code"
          python3 - "$code" <<'PY'
          import json, sys
          code = sys.argv[1]
          if code == "000":
              print("pagesEnabledBefore=nothing-measured "
                    "reason=request-did-not-complete (nothing measured)")
              raise SystemExit(0)
          if code == "404":
              print("pagesEnabledBefore=false pagesBuildTypeBefore=none "
                    "pagesSourceBefore=none pagesUrl=none")
              raise SystemExit(0)
          try:
              d = json.load(open("/tmp/pages-before.json"))
          except Exception as e:
              print("pagesEnabledBefore=nothing-measured reason=unparseable-body "
                    "(nothing measured) err=%s" % type(e).__name__)
              raise SystemExit(0)
          src = d.get("source") or {}
          print("pagesEnabledBefore=true pagesBuildTypeBefore=%s "
                "pagesSourceBranch=%s pagesSourcePath=%s pagesUrl=%s "
                "pagesStatus=%s"
                % (d.get("build_type") or "none",
                   src.get("branch") or "none", src.get("path") or "none",
                   d.get("html_url") or "none", d.get("status") or "none"))
          PY

      - name: set the Pages source to this workflow, and record any refusal
        id: enable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          # PUT updates an existing site, POST creates one. Both are recorded
          # with their exact status and body: queue 097's second legitimate
          # ending is "a recorded refusal naming the exact error", and a
          # swallowed error is a quiet retry next week instead.
          put=$(curl -sS -o /tmp/pages-put.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"build_type":"workflow"}' \
            "https://api.github.com/repos/${{ github.repository }}/pages" || echo 000)
          echo "pagesPutHttp=$put body=$(tr -d '\n' < /tmp/pages-put.json | cut -c1-300)"
          if [ "$put" = "404" ]; then
            post=$(curl -sS -o /tmp/pages-post.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow"}' \
              "https://api.github.com/repos/${{ github.repository }}/pages" || echo 000)
            echo "pagesPostHttp=$post body=$(tr -d '\n' < /tmp/pages-post.json | cut -c1-300)"
            put="$post"
          fi
          echo "pagesEnableHttp=$put" >> "$GITHUB_OUTPUT"
          case "$put" in
            200|201|204) echo "pagesEnableResult=OK" ;;
            000) echo "pagesEnableResult=NOTHING-MEASURED (nothing measured: the request did not complete)" ;;
            *) echo "pagesEnableResult=REFUSED-http-$put" ;;
          esac

      # A RESIZER, AND THE MEASUREMENT OF WHETHER IT ARRIVED. Without Pillow
      # every picture embeds at full size: the four Unreal frames are 0.6 to
      # 1.1 MB each, so the gallery's byte budget would bite on the first one
      # and the page would silently show only the small old jpgs. Not fatal on
      # purpose (a package index hiccup must not take the glance off his
      # phone); tools/gallery.py prints resizer=Pillow or resizer=none and
      # exits 1 when it dropped a picture for want of one, so the cause is
      # named in the log rather than inferred from a thin page.
      - name: a resizer for the pictures, and whether it arrived
        run: |
          python3 -m pip install --disable-pip-version-check --quiet Pillow \
            || echo "pillowInstall=FAILED"
          python3 - <<'PY'
          try:
              import PIL
              print("pillowPresent=yes version=%s" % PIL.__version__)
          except ImportError:
              print("pillowPresent=no (pictures embed unresized; "
                    "tools/gallery.py will say so and exit 1)")
          PY

      - name: the generators' own selftests, accepting case first
        run: |
          python3 tools/glance.py --selftest
          python3 tools/map.py --selftest
          python3 tools/gallery.py --selftest

      - name: the publisher's selftest, accepting case first
        run: python3 tools/publish-glance.py --selftest

      - name: build and scan the bytes about to be published
        run: |
          python3 tools/publish-glance.py --build \
            --out-dir _site --commit "${{ github.sha }}"
          # A SECOND READING OF THE SAME DIRECTORY, and named differently on
          # purpose: the publisher prints siteFiles=N/4-expected from its own
          # list, and this counts what is actually on disk. Two keys, because
          # one key with two values on two lines is what a grep merges.
          echo "artifactFiles=$(find _site -type f | wc -l) artifactBytes=$(du -sb _site | cut -f1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: REQUEST THE PUBLISHED PAGES AND READ WHAT CAME BACK
        run: |
          set -eu
          base="${{ steps.deployment.outputs.page_url }}"
          # The deploy action's page_url ends in a slash today; if it ever does
          # not, joining it to a file name would silently request a sibling
          # directory. Normalised here rather than assumed.
          case "$base" in */) ;; *) base="$base/" ;; esac
          echo "glanceUrl=$base mapUrl=${base}map.html galleryUrl=${base}gallery.html worldUrl=${base}world.html"
          # Retries are for the CDN, which makes "not published" and "published
          # but stale" look identical. Every wait announces itself and the
          # attempt series is printed, so a future bound can be set from
          # evidence rather than from this budget.
          python3 tools/publish-glance.py \
            --check "$base" \
            --expect-commit "${{ github.sha }}" \
            --retries 8 --wait-sec 15
          # THE SECOND PAGE IS REQUESTED TOO, on the same budget rather than a
          # newly invented one. The glance links forward to map.html, so a map
          # that deployed but does not serve is a tap into a 404: publishing it
          # and never asking for it is exactly the gap this file exists to
          # close. Both pages carry the same stamp, so the same commit check
          # applies unchanged.
          python3 tools/publish-glance.py \
            --check "${base}map.html" \
            --expect-commit "${{ github.sha }}" \
            --retries 8 --wait-sec 15
          # AND THE THIRD PAGE, for the same reason as the second: the
          # Producer's register allows Jafar a link to gallery.html, so a
          # gallery that deployed but does not serve is a ruled link into a
          # 404. Published and never requested is the gap this file closes.
          python3 tools/publish-glance.py \
            --check "${base}gallery.html" \
            --expect-commit "${{ github.sha }}" \
            --retries 8 --wait-sec 15
          # AND THE FOURTH PAGE. world.html is the town atlas, linked from the
          # gallery, so it is requested for the reason the map and the gallery
          # are: a page that deployed and does not serve is a tap into a 404.
          python3 tools/publish-glance.py \
            --check "${base}world.html" \
            --expect-commit "${{ github.sha }}" \
            --retries 8 --wait-sec 15
          # AND THE PICTURES THEMSELVES, WHICH ARE NEW AND ARE NOT PAGES. The
          # gallery stopped embedding base64 on 2026-09-09 and now references
          # published FILES, so "the page served" and "the pictures on it
          # served" became two different facts. One file is requested by name,
          # read out of the manifest the generator wrote, because a gallery of
          # broken images is indistinguishable on a phone from a page that
          # failed to load. The count is printed with its denominator.
          python3 - "$base" <<'PY'
          import json, sys, urllib.request
          base = sys.argv[1]
          try:
              man = json.load(open("_site/gallery-img/manifest.json"))
          except Exception as e:
              print("picturesServed=nothing-measured reason=no-manifest/%s "
                    "(nothing measured)" % type(e).__name__)
              raise SystemExit(0)
          files = man.get("files", [])
          if not files:
              print("picturesServed=nothing-measured filesInManifest=0 "
                    "(nothing measured)")
              raise SystemExit(0)
          name = files[0]["name"]
          url = "%sgallery-img/%s" % (base, name)
          try:
              with urllib.request.urlopen(url, timeout=30) as r:
                  n = len(r.read())
                  print("pictureHttp=%d pictureBytes=%d/%d-expected "
                        "pictureName=%s filesInManifest=%d picturesAsked=1/%d"
                        % (r.status, n, files[0].get("bytes", 0), name,
                           len(files), len(files)))
                  if r.status != 200 or n == 0:
                      raise SystemExit("the first published picture did not "
                                       "serve, so the gallery is a page of "
                                       "broken images")
          except SystemExit:
              raise
          except Exception as e:
              print("pictureHttp=nothing-measured reason=%s "
                    "(nothing measured: the request did not complete, which "
                    "is not the same as a 404)" % type(e).__name__)
          PY

      - name: the verdict, and the refusal record if there was one
        if: always()
        run: |
          {
            echo "## publish-glance"
            echo ""
            echo "commit: ${{ github.sha }}"
            echo "url: ${{ steps.deployment.outputs.page_url }}"
            echo "map: ${{ steps.deployment.outputs.page_url }}map.html"
            echo "gallery: ${{ steps.deployment.outputs.page_url }}gallery.html"
            echo "world: ${{ steps.deployment.outputs.page_url }}world.html"
            echo "pagesEnableHttp: ${{ steps.enable.outputs.pagesEnableHttp }}"
            echo "job: ${{ job.status }}"
            echo ""
            if [ "${{ job.status }}" != "success" ]; then
              echo "THIS RUN DID NOT PUBLISH A PAGE HE CAN READ."
              echo "Jafar's instruction was to SAY SO rather than leave a file"
              echo "he cannot read. The exact error is in the failing step above."
              echo "Route: copy it into production/decision-queue.md as a card"
              echo "with the one-line ask, per queue 097."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # THE NOTIFY JOB IS RETIRED, 2026-09-09, RULED BY JAFAR VERBATIM: "The
  # brief generator, the cards pass and the page notifier are retired." THIS
  # WAS THE PAGE NOTIFIER'S ONLY CALLER, and removing it is what retires it:
  # a banner on tools/map-notify.py with this job still here would be a
  # comment, not a retirement.
  #
  # WHAT IT DID. After a successful deploy it fetched the SERVED map, compared
  # its material state against production/map-notified.json, and wrote an
  # unprompted Producer message into production/outbox/ when the page had
  # changed. Three steps: its selftest, the comparison, and the commit of the
  # message plus the record.
  #
  # WHY IT WENT. It is machinery that decided what Jafar is told, which is the
  # thing the ruling moves to a person: "One Producer turn a day writes the
  # single message... and decides what I see and what I never see." A published
  # map that moved is now something the Producer may mention in that one
  # message, or may never mention, which is the judgment the ruling asks for.
  #
  # WHAT IS KEPT. tools/map-notify.py stays in the tree with its own RETIRED
  # banner and refuses to run, and production/map-notified.json stays as the
  # record of what was last announced. The served-page CHECK in the publish job
  # above is untouched: it proves the deploy, and it never wrote a message.
