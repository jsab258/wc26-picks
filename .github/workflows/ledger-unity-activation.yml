name: LEDGER Unity license activation helper

# One-time helper: produces an .alf activation request file as an artifact.
# Flow (browser, ~5 minutes):
#   1. Run this workflow manually (Actions tab -> this workflow -> Run workflow)
#   2. Download the .alf artifact from the run page
#   3. Upload it at https://license.unity3d.com/manual (log in with the Unity account)
#   4. Download the resulting .ulf file
#   5. Paste the .ulf file's CONTENTS into a repo secret named UNITY_LICENSE
#      (Settings -> Secrets and variables -> Actions -> New repository secret)
on:
  workflow_dispatch:

jobs:
  request-activation-file:
    runs-on: ubuntu-latest
    steps:
      - id: request
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.0.32f1
      - uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: ${{ steps.request.outputs.filePath }}
