name: Sleeper autopilot

# Manual runs of the Python CLI (fantasy/README.md). Scheduling now lives in the
# Apps Script web app (fantasy/apps-script/), so this no longer runs on a cron;
# running both would mean two bots managing the same lineups.
on:
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [lineup, waivers, all]
        default: all
      apply:
        description: Submit changes to Sleeper (otherwise dry run)
        type: boolean
        default: false

concurrency:
  group: sleeper-autopilot

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fantasy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: fantasy/.cache
          key: autopilot-${{ github.run_id }}
          restore-keys: autopilot-
      - name: Run
        env:
          SLEEPER_TOKEN: ${{ secrets.SLEEPER_TOKEN }}
          FANTASYPROS_COOKIE: ${{ secrets.FANTASYPROS_COOKIE }}
          INPUT_TASK: ${{ inputs.task }}
          INPUT_APPLY: ${{ inputs.apply }}
          SHOW_WAIVERS: ${{ vars.SHOW_WAIVER_DETAILS }}
        run: |
          args=("$INPUT_TASK")
          apply="$INPUT_APPLY"
          [ "$apply" = "true" ] && args+=(--apply)
          # Pending claims (and FAAB bids) are private on Sleeper; Actions logs on a
          # public repo are not. Set SHOW_WAIVER_DETAILS=true only on a private repo.
          [ "$SHOW_WAIVERS" = "true" ] || args+=(--redact-waivers)
          python -m autopilot "${args[@]}"
