name: Sleeper autopilot

# Sets Sleeper lineups and waiver claims from FantasyPros ECR. See fantasy/README.md.
# Scheduled runs are dry runs until the repo variable AUTOPILOT_APPLY is "true".
# Times are UTC (US Eastern Standard Time + 5h); GitHub can start cron jobs late,
# hence the buffers before kickoff.
on:
  schedule:
    - cron: "7 22 * * 2"    # Tue: waiver claims (before Sleeper's default Wed run)
    - cron: "10 23 * * 4"   # Thu: before TNF
    - cron: "10 12 * * 0"   # Sun: before international games
    - cron: "45 16 * * 0"   # Sun: after 1pm-game inactives
    - cron: "5 20 * * 0"    # Sun: after late-game inactives
    - cron: "55 23 * * 0"   # Sun: before SNF
    - cron: "50 23 * * 1"   # Mon: before MNF
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [lineup, waivers, all]
        default: all
      apply:
        description: Submit changes to Sleeper (otherwise dry run)
        type: boolean
        default: false

concurrency:
  group: sleeper-autopilot

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fantasy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: fantasy/.cache
          key: autopilot-${{ github.run_id }}
          restore-keys: autopilot-
      - name: Run
        env:
          SLEEPER_TOKEN: ${{ secrets.SLEEPER_TOKEN }}
          FANTASYPROS_COOKIE: ${{ secrets.FANTASYPROS_COOKIE }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_TASK: ${{ inputs.task }}
          INPUT_APPLY: ${{ inputs.apply }}
          APPLY_VAR: ${{ vars.AUTOPILOT_APPLY }}
          SHOW_WAIVERS: ${{ vars.SHOW_WAIVER_DETAILS }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            task="$INPUT_TASK"; apply="$INPUT_APPLY"
          else
            task=lineup; apply="$APPLY_VAR"
            [ "$SCHEDULE" = "7 22 * * 2" ] && task=waivers
          fi
          args=("$task")
          [ "$apply" = "true" ] && args+=(--apply)
          # Pending claims (and FAAB bids) are private on Sleeper; Actions logs on a
          # public repo are not. Set SHOW_WAIVER_DETAILS=true only on a private repo.
          [ "$SHOW_WAIVERS" = "true" ] || args+=(--redact-waivers)
          python -m autopilot "${args[@]}"
