name: LEDGER setup build machine (MSVC, Blender)

# ONE-OFF MACHINE SETUP, AUTHORIZED BY JAFAR 2026-09-01 ("go ahead").
#
# The UE probe found no Visual Studio of any kind on the build PC, which
# blocks every C++ step of the D1 probe. This installs the BUILD TOOLS, not
# the full IDE: the headless MSVC toolchain is what UE needs to compile, and
# it is the smaller footprint of the two.
#
# WHY A SEPARATE WORKFLOW rather than a step in the probe. This changes the
# machine, it takes tens of minutes, and it should happen exactly once. A
# setup action living inside a measurement workflow would run on every
# measurement, and the first time somebody wondered why a probe took an hour
# the answer would be buried in a step nobody reads.
#
# IT IS IDEMPOTENT AND SAYS SO. If MSVC is already present it reports that
# and exits without touching anything, so re-running is free and safe.
#
# TRIGGER: its own sentinel, for the same reason the probe has one. This
# workflow is not on the default branch and cannot be dispatched from the
# API until it is; touching production/d1-probe/SETUP-MSVC runs it.
#
# IT SETS UP MORE THAN MSVC NOW, AUTHORIZED BY JAFAR 2026-09-01 ("can't you
# installed blender like oyu installed MSVC"). Blender is the ONE missing
# requirement of tools/meshgen's local backend, which refused on his machine
# with "backend local: NO (1 of 2 requirements met)". It is free and GPL from
# blender.org: no purchase, no account, and none is used.
#
# AND BLENDER IS UNPACKED, NOT INSTALLED, SINCE 1 SEP. The first run of that
# step did every discovery step correctly, downloaded 360 MB and died with
# msiexec exit 1603, which under /qn is rights: a per-machine MSI wants an
# elevated runner service and this one is not elevated. The fix is not more
# installer flags, it is to stop needing an installer - Blender publishes the
# same version as a portable zip beside the MSI, and unpacking a zip needs no
# elevation, no installer service, no reboot and no registry. The MSI path is
# DELETED rather than kept as a fallback: it is a known negative on the only
# machine this workflow runs on (the same PC refused the PowerShell 7
# installer at 92% with "Access is denied", which is why
# tools/runner/3 FINISH THE BUILD MACHINE.bat unpacks zips too), and a
# fallback whose job is to fail slowly after a 360 MB download is a second
# implementation of the same idea with none of the benefit.
#
# THE EXTRACTION IS ONLY HALF THE JOB. It lands in C:\LedgerTools\blender,
# which nothing looked in, so tools/meshgen/probe-tools.ps1 - the consumer,
# the thing "1 MAKE THE PROPS.bat" actually asks - was taught that location as
# the first entry of its search list. Without that edit this step would report
# a successful unpack and the prop batch would still refuse, which is the
# built-but-not-running failure with an installer in front of it.
#
# WHY IT IS A SECOND STEP HERE RATHER THAN A SECOND WORKFLOW. The PATH
# bootstrap was inline in three places once and the third copy was a
# silently shortened variant; tools/lint-bootstrap-single.py exists because
# of it. A third near-copy of this file - checkout, bootstrap, install,
# verify, commit - would recreate exactly that. So the file keeps its name
# and its sentinel and grows a second tool.
#
# THE SENTINEL SITS BESIDE THE OTHER ONE, in production/d1-probe/, and NOT
# in production/mesh-reports/ where its report goes. mesh-reports is an
# OUTPUT directory - meshgen writes its machine report there - and a trigger
# living inside an output directory is the shape where a run's own output
# re-fires the workflow that produced it, or where a cleanup deletes the
# trigger. The report still goes to mesh-reports, because that is where the
# person reading "backend local: NO, missing Blender" is already looking.
#
# BOTH INSTALL STEPS RUN ON EVERY TRIGGER, and that is safe because both are
# idempotent: each checks its own required set first and exits without
# touching the machine when the set is already complete. Touching either
# sentinel therefore RE-MEASURES both tools on this commit, which is a
# reading rather than a change.
on:
  workflow_dispatch:
  push:
    paths:
      - 'production/d1-probe/SETUP-MSVC'
      - 'production/d1-probe/SETUP-BLENDER'

permissions:
  contents: write

jobs:
  setup-msvc:
    runs-on: [self-hosted, ledger-pc]
    # A Visual Studio install is tens of minutes on a good connection and
    # this is a ceiling on a hang, not a target.
    timeout-minutes: 120

    steps:

      - name: Checkout
        timeout-minutes: 6
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: tool PATH bootstrap (self-hosted parity)
        timeout-minutes: 1
        shell: cmd
        run: |
          call tools\runner\bootstrap-paths.cmd
          exit /b %ERRORLEVEL%

      - name: Install the MSVC build tools
        id: install
        timeout-minutes: 100
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $out = "production/d1-probe/msvc-setup.txt"
          New-Item -ItemType Directory -Force -Path "production/d1-probe" | Out-Null
          $sha = $env:GITHUB_SHA
          if ($sha) { $sha = $sha.Substring(0, [Math]::Min(7, $sha.Length)) } else { $sha = "SHA-UNKNOWN" }
          $L = @("# MSVC build tools setup - $sha", "")

          # THE REQUIRED SET, CHECKED COMPONENT BY COMPONENT.
          #
          # THIS USED TO ASK ABOUT ONE COMPONENT AND THAT MADE IT A ONE-SHOT
          # TOOL PRETENDING TO BE IDEMPOTENT. It reported ALREADY PRESENT the
          # moment VC.Tools existed, so it could never add anything else, and
          # when the UE editor turned out to need the .NET Framework SDK the
          # workflow whose whole job is machine setup would have skipped the
          # setup and said everything was fine. A guard that can only ever
          # answer about its first requirement is the accepting-case failure
          # in guard form.
          #
          # VC.Tools compiles the game. NetFX is what the EDITOR needs, and
          # the editor is not optional: cooking is a commandlet run inside it,
          # so a project that cannot build the editor cannot be packaged at
          # all. Run 9 found this by failing on SwarmInterface with "Could not
          # find NetFxSDK install dir".
          $required = [ordered]@{
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64" = "the C++ toolchain, for the game target"
            "Microsoft.Net.Component.4.8.SDK"                   = "the .NET Framework SDK, for the editor target"
            "Microsoft.Net.Component.4.6.2.TargetingPack"       = "the targeting pack UE names alongside it"
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = ""
          $missing = @()
          if (Test-Path $vswhere) {
            $installPath = (& $vswhere -latest -products * -property installationPath 2>$null | Select-Object -First 1)
            foreach ($c in $required.Keys) {
              $hit = & $vswhere -latest -products * -requires $c -property installationVersion 2>$null
              if ($hit) { $L += "present: $c ($($required[$c]))" }
              else      { $L += "MISSING: $c ($($required[$c]))"; $missing += $c }
            }
          } else {
            $L += "vswhere absent: treating every required component as missing."
            $missing = @($required.Keys)
          }
          $L += "requiredComponents=$($required.Count) missing=$($missing.Count)"
          if ($missing.Count -eq 0) {
            $L += "ALREADY COMPLETE: all $($required.Count) required component(s) present. Nothing changed."
            $L += "setupReached=end"
            $L | Set-Content $out -Encoding utf8
            Write-Host ($L -join "`n")
            exit 0
          }

          # THE UNATTENDED BOOTSTRAPPER, not winget. winget under a runner
          # session has known trouble with package sources and elevation;
          # the bootstrapper is Microsoft's documented unattended path and
          # its exit codes are defined, which matters more here than
          # convenience: this step must be able to say WHY it failed.
          $url = "https://aka.ms/vs/17/release/vs_BuildTools.exe"
          $exe = Join-Path $env:RUNNER_TEMP "vs_BuildTools.exe"
          $L += "downloading $url"
          try {
            Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
            $L += "downloaded bytes=$((Get-Item $exe).Length)"
          } catch {
            $L += "DOWNLOAD FAILED: $($_.Exception.Message)"
            $L += "setupReached=end"
            $L | Set-Content $out -Encoding utf8
            Write-Host ($L -join "`n"); exit 1
          }

          # MODIFY AN EXISTING INSTALL, INSTALL A NEW ONE. Passing --add to a
          # bare bootstrapper against an existing installation is the shape
          # that quietly does nothing; `modify --installPath` is the
          # documented way to add components to what is already there.
          if ($installPath) {
            $args = @("modify", "--installPath", "`"$installPath`"",
                      "--quiet", "--wait", "--norestart", "--nocache")
            $L += "modifying the existing install at $($installPath -replace ' ','~')"
          } else {
            $args = @("--quiet", "--wait", "--norestart", "--nocache",
                      "--add", "Microsoft.VisualStudio.Workload.VCTools",
                      "--includeRecommended")
            $L += "no existing install found: installing the VCTools workload"
          }
          # Only what is actually missing, named one by one, so the log says
          # what this run changed rather than what it might have.
          foreach ($c in $missing) { $args += "--add"; $args += $c }
          $L += "running vs_BuildTools.exe $($args -join ' ')"
          $t0 = Get-Date
          $p = Start-Process -FilePath $exe -ArgumentList $args -Wait -PassThru
          $mins = [math]::Round(((Get-Date) - $t0).TotalMinutes, 1)
          # 0 is success; 3010 is success needing a reboot, which is still a
          # successful install and must not read as a failure.
          $L += "exitCode=$($p.ExitCode) minutes=$mins"
          if ($p.ExitCode -eq 3010) { $L += "note: 3010 means installed, reboot pending. This is success." }
          elseif ($p.ExitCode -ne 0) { $L += "INSTALL FAILED with exit $($p.ExitCode)." }

          # PROVE IT, rather than trusting the exit code, and prove EVERY
          # component rather than the first one. The count is printed with
          # its denominator so "all three" and "one of three" cannot read
          # the same way.
          if (Test-Path $vswhere) {
            $ok = 0
            foreach ($c in $required.Keys) {
              $hit = & $vswhere -latest -products * -requires $c -property installationVersion 2>$null
              if ($hit) { $ok++; $L += "verified: $c version=$hit" }
              else      { $L += "STILL MISSING AFTER INSTALL: $c" }
            }
            $L += "verifiedComponents=$ok/$($required.Count)"
            if ($ok -eq $required.Count) { $L += "VERIFIED: every required component is present." }
            else { $L += "NOT VERIFIED: $($required.Count - $ok) component(s) still missing." }
          } else {
            $L += "NOT VERIFIED: vswhere still absent after the installer ran."
            $L += "verifiedComponents=0/$($required.Count)"
          }
          $L += "setupReached=end"
          $L | Set-Content $out -Encoding utf8
          Write-Host ($L -join "`n")

      - name: Set up Blender by unpacking its portable zip (meshgen's only missing requirement)
        id: blender
        timeout-minutes: 45
        continue-on-error: true
        shell: pwsh
        run: |
          # A THIN CALL. The 411 lines that were here now live in
          # tools/runner/setup-blender.ps1, because at 25,259 characters this
          # block was 2,075 over the largest `run:` block workflow_dispatch
          # has ever accepted and GitHub raises that 422 at DISPATCH time -
          # so the commit that breaks it is green and somebody finds out when
          # a build they are waiting on never starts. Same repair as
          # tools/runner/bootstrap-paths.cmd: one idea, one implementation, in
          # a file. Nothing was cut; the text moved with the code.
          #
          # EVERYTHING THE SCRIPT NEEDS IS PASSED, not inherited from this
          # step's scope: the sha it is reporting on, where the report goes,
          # the runner's temp directory, and the consumer it verifies through.
          # A dependency that is visible at the call site is one the next
          # reader cannot miss.
          #
          # -File through a fresh pwsh, matching how every other repo .ps1 is
          # invoked here, so an execution policy on this machine cannot be the
          # thing that stops it. $LASTEXITCODE is propagated deliberately: the
          # script exits 1 when the requirements are unmet, and this step is
          # continue-on-error, so that code is what the commit step reads as
          # steps.blender.outcome.
          pwsh -NoProfile -ExecutionPolicy Bypass -File "tools/runner/setup-blender.ps1" `
            -Sha "$env:GITHUB_SHA" `
            -Out "production/mesh-reports/blender-setup.txt" `
            -Temp "$env:RUNNER_TEMP" `
            -ProbeScript "tools\meshgen\probe-tools.ps1"
          exit $LASTEXITCODE
      - name: Commit the setup result
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BLENDER_OUTCOME: ${{ steps.blender.outcome }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"
        run: |
          set -u
          OUT=production/d1-probe/msvc-setup.txt
          if [ ! -f "$OUT" ] || ! grep -q "setupReached=end" "$OUT"; then
            printf '# MSVC build tools setup - %s\nNO SETUP - the install step did not reach its end (outcome: %s).\nNothing was measured on this commit.\n' \
              "$(git rev-parse --short HEAD)" "${INSTALL_OUTCOME:-unknown}" > "$OUT"
          fi
          # Same rule for the Blender report, and it is the rule that stops a
          # PREVIOUS run's file passing as this one's: a step that died before
          # its end writes NO SETUP in words rather than leaving the older
          # file in place to be read as today's answer.
          BOUT=production/mesh-reports/blender-setup.txt
          if [ ! -f "$BOUT" ] || ! grep -q "setupReached=end" "$BOUT"; then
            printf '# Blender setup - %s\nNO SETUP - the Blender step did not reach its end (outcome: %s).\nNothing was measured on this commit.\nsetupReached=absent\n' \
              "$(git rev-parse --short HEAD)" "${BLENDER_OUTCOME:-unknown}" > "$BOUT"
          fi
          git config user.name "LEDGER setup"
          git config user.email "setup@ledger.local"
          # BY NAME, never `git add <directory>`: a run that measured nothing
          # would otherwise commit its stale checkout's files as its own
          # evidence.
          git add -- "$OUT" "$BOUT"
          git diff --cached --quiet && { echo "setup result unchanged; nothing to commit"; exit 0; }
          git commit -m "Machine setup results (MSVC, Blender) from $(git rev-parse --short HEAD)"
          BR="${GITHUB_REF_NAME}"
          for i in 1 2 3; do
            git pull --rebase --no-edit origin "$BR" || git rebase --abort || true
            if git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BR}"; then
              echo "setup result pushed to $BR"; exit 0
            fi
            sleep $((i * 5))
          done
          echo "could not push the setup result; it is committed locally on the agent"
