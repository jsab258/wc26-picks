name: LEDGER voice candidates

# WHY THIS EXISTS, and it should have existed three listening sessions ago.
#
# The fetcher streams a speech corpus from HuggingFace. This project's own
# sandbox cannot reach huggingface.co — its egress policy denies it, the same
# way it denies mixamo.com — so I put the work on Jafar's PC: a Python
# install, a virtual environment, a corpus stream, and a page that only opens
# on the machine that produced it.
#
# A GitHub runner has open internet. It could have done every one of those
# steps from the start, and the output can be committed so the listening
# happens on a phone instead of at a desk. I never asked whether anything
# other than his laptop could run it.

# TRIGGERED BY A PUSH, NOT ONLY BY HAND. `workflow_dispatch` can only be
# fired for workflows that exist on the DEFAULT branch, and this one lives on
# a feature branch — the dispatch API answers 404, which reads like the file
# is missing rather than like it is in the wrong place. A path-scoped push
# trigger runs it from wherever it actually is.
on:
  push:
    branches: [claude/game-dev-ai-automation-2h67ix]
    paths:
      - "tools/voice-fetch/**"
      - ".github/workflows/voice-candidates.yml"
  workflow_dispatch:
    inputs:
      inventory:
        description: "Set to yes to enumerate the corpus speakers instead of fetching"
        default: "no"
      skip_rows:
        description: "Start this many rows in — the stretch a previous run already claimed"
        default: "0"
      minutes:
        description: "Fetch budget in minutes"
        default: "38"
      candidates:
        description: "How many voices to offer per character"
        required: false
        default: "6"
      source:
        description: "vctk | commonvoice | libritts (blank = try in order)"
        required: false
        default: ""
      who:
        description: "Comma-separated character ids, or blank for all"
        required: false
        default: ""

jobs:
  # ASK THE CORPUS A QUESTION WITHOUT FETCHING IT.
  #
  # HuggingFace is unreachable from the dev container, so every fact about
  # VCTK has been inferred from the side effects of a forty-minute fetch —
  # which is why a day of estimates were wrong and every answer arrived as a
  # surprise. This reads four metadata columns and no audio, and writes the
  # complete speaker table to the repo. Afterwards "can crowd_f1 be filled,
  # by whom, from which row" is answered locally in a second.
  #
  # It writes one JSON file and cannot touch a clip.
  inventory:
    if: github.event_name == 'workflow_dispatch' && inputs.inventory == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/game-dev-ai-automation-2h67ix
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enumerate the speakers
        working-directory: tools/voice-fetch
        run: python ledger_voice_fetch.py --inventory --yes 2>&1 | tee inventory.log
      - name: Commit the table
        run: |
          git config user.name "LEDGER CI"
          git config user.email "ci@ledger.invalid"
          git add tools/voice-fetch/vctk-speakers.json
          if git diff --cached --quiet; then echo "unchanged"; else
            git commit -m "The VCTK speaker table, read from metadata"
            for a in 1 2 3 4 5 6; do
              git fetch origin claude/game-dev-ai-automation-2h67ix || true
              git rebase origin/claude/game-dev-ai-automation-2h67ix || git rebase --abort || true
              git push origin HEAD:claude/game-dev-ai-automation-2h67ix && break
              sleep $((a * 5))
            done
          fi
      - name: Report
        if: always()
        run: |
          { echo '## VCTK speaker inventory'; echo '```';
            tail -c 4000 tools/voice-fetch/inventory.log; echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vctk-speakers
          path: |
            tools/voice-fetch/vctk-speakers.json
            tools/voice-fetch/inventory.log

  # THE PAGE IS A DELIVERABLE, SO IT GETS OPENED. Jafar reported "nothing
  # happens when I click copy picks", and no amount of re-reading the Python
  # that writes the HTML would have found it: the page had no viewport tag, no
  # picking UI, a fixed bar sitting on top of the last controls, a row that
  # cast a vote when you pressed PLAY, and — the one that killed everything —
  # a `\n` inside a non-raw string that Python turned into a real newline,
  # leaving the browser an unterminated literal and every control inert.
  #
  # Six faults, all of them invisible from the generator, all of them found in
  # the first sixty seconds of actually loading the page at phone size. It
  # needs no network and no corpus, so it runs on every push.
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/game-dev-ai-automation-2h67ix
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install a browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Open the listening page on a phone
        run: |
          cd tools/voice-fetch
          python page_check.py

  # TWO MINUTES, AND IT RUNS FIRST. Run 7 streamed for forty-five minutes,
  # exited zero and banked nothing — and the one line naming the reason sat in
  # a log the API returns only the tail of. Debugging that with forty-five
  # minute round trips is guessing with a delay.
  #
  # This opens the corpus, reads forty rows, and says what the filter sees.
  # It does not gate the fetch — a diagnostic that can stop the real work is a
  # diagnostic somebody switches off.
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/game-dev-ai-automation-2h67ix
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: What does the filter see
        working-directory: tools/voice-fetch
        run: |
          set -o pipefail
          # THE TAIL IS THE PART I CAN READ. `datasets` prints a thousand
          # progress lines and the log API returns a fixed window of the end,
          # so the diagnostic prints its answer last and this keeps only the
          # last chunk of everything else.
          python ledger_voice_fetch.py --yes --diagnose 2>&1 | tee diagnose.log || true
          echo "----- tail of diagnose -----"
          tail -40 diagnose.log
      # INTO THE STEP SUMMARY, because the log API hands back a fixed tail and
      # post-job cleanup fills it. This is the lesson the Windows job learned
      # over three builds and this workflow never had.
      - name: Report
        if: always()
        working-directory: tools/voice-fetch
        run: |
          {
            echo "## Voice corpus diagnose"
            echo '```'
            tail -c 12000 diagnose.log 2>/dev/null || echo "no diagnose log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ASKED FOR, NOT TRIGGERED. Editing a Python file under tools/voice-fetch
  # started a forty-minute corpus fetch, three times in one afternoon, and
  # each one blocked the targeted run somebody was actually waiting on. Worse
  # than slow: a full fetch rewrites every character's clips, including the
  # sixteen already picked from, so an incidental run is now destructive.
  #
  # A push still gets the cheap half — page checks and the corpus diagnose,
  # which is what a code change needs to prove. Streaming forty thousand rows
  # is a thing somebody decides to do.
  candidates:
    # ONE FETCH AT A TIME — SCOPED TO THE FETCH. Four runs were streaming the
    # same corpus at once and competing for one push, so they were serialised.
    # But the group sat at WORKFLOW level, which meant the cheap jobs queued
    # behind a forty-minute stream and, worse, the metadata read and the fetch
    # blocked each other — twice today the run somebody was waiting on sat
    # pending behind one of mine. Only the fetch needs to be alone.
    concurrency:
      group: voice-fetch
      cancel-in-progress: false
    # AND NOT WHEN THE INVENTORY WAS WHAT WAS ASKED FOR. Gating on the event
    # alone meant dispatching the metadata read also started a full 38-minute
    # corpus fetch — the exact run the inventory exists to make unnecessary.
    if: github.event_name == 'workflow_dispatch' && inputs.inventory != 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/game-dev-ai-automation-2h67ix

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # BELT AND BRACES, and they guard different failures.
      #
      # `--minutes 38` is the script deciding to stop and write what it has.
      # `timeout-minutes: 45` is this step being killed if the script wedges
      # somewhere the budget cannot see — inside a single streaming read,
      # say. `continue-on-error` is what turns that kill into "commit the
      # partial output" rather than "the job ends here with nothing", which
      # is what happened three times: runs 3, 4 and 5 all died on the cap and
      # every one produced EXACTLY ZERO clips, because the fetcher writes
      # everything in one go at the end.
      # HAND THE FETCHER WHAT THE BRANCH ALREADY KNOWS.
      #
      # The fetcher writes to `ledger-voices-out`, which is not in the repo and
      # is therefore EMPTY at the start of every run. Both of the memory
      # features — inheriting who is already spoken for, and keeping other
      # characters' rows on the page — read the previous page out of that same
      # directory, so in CI they would have found nothing and done nothing,
      # silently, while passing every check locally.
      #
      # Copying the committed page in first is the whole wiring.
      - name: Seed the run with the existing page
        run: |
          mkdir -p tools/voice-fetch/ledger-voices-out
          if [ -f voice-candidates/listen.html ]; then
            cp voice-candidates/listen.html tools/voice-fetch/ledger-voices-out/
            echo "seeded with $(grep -c '<section id=' voice-candidates/listen.html) characters"
          else
            echo "::warning::no existing page — this run has no memory of earlier ones"
          fi

      - name: Fetch candidates
        id: fetch
        working-directory: tools/voice-fetch
        # Room for a budget larger than the default; the script's own
        # `--minutes` is what actually stops it.
        timeout-minutes: 110
        continue-on-error: true
        run: |
          set -o pipefail
          # DEFAULTS IN THE SHELL, not only in the workflow_dispatch block.
          # On a `push` event `inputs.*` are EMPTY STRINGS — the defaults
          # declared above apply to manual runs only — so the first CI run
          # died instantly on `--candidates ` with no value.
          # FOUR, NOT SIX, AND THE CORPUS DECIDES THAT — not taste. A
          # candidate is now one distinct speaker, so six each across nineteen
          # characters needs 114 different people. VCTK has 110 in total, and
          # they are partitioned by accent and gender before anybody gets to
          # choose: seven characters share the English women, five the English
          # men, one has Northern Irish. Four is what those buckets can
          # actually supply. Asking for six produced six clips of one voice.
          CANDIDATES="${{ inputs.candidates }}"; CANDIDATES="${CANDIDATES:-4}"
          # VCTK, BY NAME. It was chosen and it was never used — the fetcher
          # merely tried it first and fell through to Common Voice without
          # saying so. Naming it here means a run either uses the corpus that
          # was picked or fails saying why.
          SOURCE="${{ inputs.source }}"; SOURCE="${SOURCE:-vctk}"
          WHO="${{ inputs.who }}"
          MINUTES="${{ inputs.minutes }}"; MINUTES="${MINUTES:-38}"
          SKIP="${{ inputs.skip_rows }}"; SKIP="${SKIP:-0}"
          ARGS="--yes --candidates $CANDIDATES --minutes $MINUTES --skip-rows $SKIP"
          if [ -n "$SOURCE" ]; then ARGS="$ARGS --source $SOURCE"; fi
          if [ -n "$WHO" ]; then ARGS="$ARGS --who $WHO"; fi
          echo "running: python ledger_voice_fetch.py $ARGS"
          python ledger_voice_fetch.py $ARGS 2>&1 | tee fetch.log

      # SMALL ENOUGH TO CARRY. WAV at 24kHz is about half a megabyte for
      # eleven seconds, and a hundred-odd of those is fifty megabytes of
      # binary in a git history for something that gets listened to once.
      # 64kbps mono mp3 is a fifteenth of that and no worse for judging a
      # voice — the cloner never sees these files, only Jafar's ears do.
      - name: Compress for listening
        working-directory: tools/voice-fetch
        if: always()
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          mkdir -p ../../voice-candidates
          # ONLY CLEAR WHAT THIS RUN IS ABOUT TO REPLACE.
          #
          # This was `rm -rf ../../voice-candidates/*`, and a `--who` run for
          # three missing crowd voices duly deleted the clips for the other
          # sixteen characters — including every one Jafar had just spent an
          # hour picking from. The fetcher had been made additive an hour
          # earlier and it made no difference: the directory was wiped a step
          # before the fetcher's output was ever copied in.
          #
          # The characters this run produced are exactly the directories in
          # `ledger-voices-out`. Everything else is somebody else's work and
          # stays where it is.
          if [ -d ledger-voices-out ]; then
            for d in ledger-voices-out/*/; do
              rm -rf "../../voice-candidates/$(basename "$d")"
            done
          fi
          # An empty or missing output directory is a real outcome now that
          # the fetch can be cut short, and it must not take the job down —
          # the verdict below is the thing worth reading in that case.
          if [ ! -d ledger-voices-out ]; then echo "no output directory"; exit 0; fi
          cd ledger-voices-out
          shopt -s nullglob
          for w in */*.wav; do
            out="../../../voice-candidates/${w%.wav}.mp3"
            mkdir -p "$(dirname "$out")"
            ffmpeg -loglevel error -y -i "$w" -codec:a libmp3lame -b:a 64k -ac 1 "$out"
          done
          cp listen.html ../../../voice-candidates/ 2>/dev/null || true
          cd ..
          cp fetch.log ../../voice-candidates/ 2>/dev/null || true

      - name: Rewrite the page to point at the mp3s
        if: always()
        run: |
          if [ -f voice-candidates/listen.html ]; then
            sed -i 's/\.wav"/.mp3"/g' voice-candidates/listen.html
          fi
          echo "candidates: $(find voice-candidates -name '*.mp3' | wc -l) clips, $(du -sh voice-candidates | cut -f1)"

      - name: Commit
        if: always()
        run: |
          git config user.name "LEDGER CI"
          git config user.email "ci@ledger.invalid"
          # NEVER COMMIT FEWER CLIPS THAN THE BRANCH ALREADY HAS.
          #
          # `if: always()` means this step also runs when the fetch is
          # CANCELLED, and a cancelled fetch leaves a near-empty output
          # directory. `git add voice-candidates` then stages the difference
          # as DELETIONS, and run 16 duly committed the removal of all 24
          # clips that had already been listened to and picked from. The step
          # reported success. Nothing in the log said the word "deleted".
          #
          # Clips are listening material: the expensive, human part of this
          # pipeline. A run that produces less than what is already there has
          # failed at its one job and must not be allowed to write the result
          # down. Growth commits; shrinkage aborts and says so.
          # AND IT ASKS WHETHER THE FETCH FINISHED, not just whether the
          # number went down. The first version of this guard compared counts
          # alone, and the very next change — four distinct voices per
          # character instead of six of the same one — would have been thrown
          # away by it for producing 76 clips where the branch had 114. Fewer
          # clips is only a fault when the run FAILED to produce them; a run
          # that completed and deliberately produces fewer is doing its job.
          # AND PER CHARACTER, NOT JUST IN TOTAL. A count alone cannot see a
          # run that adds twelve clips for three characters while removing
          # fifty-three from sixteen others — and the totals guard, loosened
          # an hour earlier to allow a deliberate reduction, waved exactly
          # that through. A character that had clips and now has none is a
          # loss whatever the totals say.
          LOST=""
          for c in $(git ls-tree -r HEAD --name-only voice-candidates 2>/dev/null \
                     | grep '\.mp3$' | cut -d/ -f2 | sort -u); do
            if [ -z "$(find "voice-candidates/$c" -name '*.mp3' 2>/dev/null)" ]; then
              LOST="$LOST $c"
            fi
          done
          if [ -n "$LOST" ]; then
            echo "::error::REFUSING TO COMMIT — these characters had clips and now have none:$LOST"
            exit 0
          fi
          HAVE=$(git ls-tree -r HEAD --name-only voice-candidates 2>/dev/null | grep -c '\.mp3$' || true)
          GOT=$(find voice-candidates -name '*.mp3' 2>/dev/null | wc -l)
          echo "clips on branch: $HAVE   clips from this run: $GOT   fetch: ${{ steps.fetch.outcome }}"
          if [ "$GOT" -lt "$HAVE" ] && [ "${{ steps.fetch.outcome }}" != "success" ]; then
            echo "::error::REFUSING TO COMMIT — the fetch did not succeed (${{ steps.fetch.outcome }})"
            echo "::error::and it produced $GOT clips where the branch has $HAVE."
            echo "::error::Committing would delete listening material. Leaving the branch alone."
            exit 0
          fi
          git add voice-candidates
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Voice candidates from CI ($(date -u +%Y-%m-%dT%H:%MZ))"
            # THE BRANCH MOVES UNDER A FORTY-FIVE MINUTE JOB. Run 7 spent
            # its whole budget, produced its output, and then lost the push
            # to a non-fast-forward because six commits had landed while it
            # streamed. Rebase and retry rather than treating the race as
            # an error — the clips are the point, not the ancestry.
            # THREE TRIES OVER THIRTY SECONDS IS NOT A RETRY LOOP, it is a
            # gesture. Run 17 finally produced 114 clips for all nineteen
            # characters, spent its three attempts inside half a minute while
            # commits were landing every couple of minutes, gave up, and the
            # clips survived only as a build artifact nobody was looking for.
            # The job went green. Six exponential attempts cover about five
            # minutes, which is longer than any realistic burst of pushes.
            delay=5
            for attempt in 1 2 3 4 5 6; do
              git fetch origin claude/game-dev-ai-automation-2h67ix || true
              git rebase origin/claude/game-dev-ai-automation-2h67ix || git rebase --abort || true
              if git push origin HEAD:claude/game-dev-ai-automation-2h67ix; then
                echo "pushed on attempt $attempt"; break
              fi
              if [ "$attempt" = 6 ]; then
                echo "::error::SIX ATTEMPTS AND THE PUSH NEVER LANDED. The clips"
                echo "::error::exist only as this run's artifact. Do not treat this job as done."
                exit 1
              fi
              echo "push attempt $attempt lost the race; waiting ${delay}s"
              sleep "$delay"; delay=$((delay * 2))
            done
          fi

      # AND THE LOG, because the source that actually answered is the single
      # most useful line and the tail of a job log is where it goes to die.
      - name: Verdict
        if: always()
        run: |
          echo "=== VOICE FETCH VERDICT ==="
          grep -E "source:|unavailable:|NOTE|rejected|fell back|TRUNCATED|stopping:" \
            tools/voice-fetch/fetch.log || echo "no source line found"
          echo "clips: $(find voice-candidates -name '*.mp3' 2>/dev/null | wc -l)"
          # A COUNT OF CLIPS IS NOT A COUNT OF CHOICES. The run that shipped
          # six clips per character shipped one voice six times and reported
          # "114 candidate(s) for 19 of 19 characters" — true, and useless.
          # If any shortlist repeats a speaker the job fails here.
          if grep -q "SAME VOICE TWICE" tools/voice-fetch/fetch.log 2>/dev/null; then
            grep "SAME VOICE TWICE" tools/voice-fetch/fetch.log
            echo "::error::A shortlist contains the same speaker more than once."
            echo "::error::Those are not alternatives to choose between."
            FAILED=1
          fi
          {
            echo "## Voice fetch verdict"
            echo "clips: $(find voice-candidates -name '*.mp3' 2>/dev/null | wc -l)"
            echo '```'
            grep -E "source:|unavailable:|NOTE|rejected|fell back|TRUNCATED|stopping:|rows scanned" \
              tools/voice-fetch/fetch.log | tail -40 || echo "no fetch log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # A RUN THAT PRODUCES NO CLIPS IS A FAILED RUN, and it has to say so.
          # `continue-on-error` on the fetch step exists so partial output still
          # gets committed — and it also turned a hard crash thirty seconds in
          # into a green tick, which is how run 8 reported success while the
          # fetcher died on a TypeError. The step may fail softly; the JOB must
          # not lie about the outcome.
          if [ "$(find voice-candidates -name '*.mp3' 2>/dev/null | wc -l)" -eq 0 ]; then
            echo "NO CLIPS PRODUCED — see the diagnose job and the summary above"
            exit 1
          fi
          # AND A TARGETED RUN IS JUDGED ON ITS OWN TARGETS. The check above
          # counts every clip on disk, so a `--who` run for three characters
          # that banks nothing still sees the other sixteen's fifty-three and
          # exits green. One did exactly that. Invariant found by reading the
          # workflow rather than by it breaking, which is the only one today
          # that can be said of.
          if [ -n "${{ inputs.who }}" ]; then
            EMPTY=""
            for c in $(echo "${{ inputs.who }}" | tr ',' ' '); do
              if [ -z "$(find "voice-candidates/$c" -name '*.mp3' 2>/dev/null)" ]; then
                EMPTY="$EMPTY $c"
              fi
            done
            if [ -n "$EMPTY" ]; then
              echo "::error::THIS RUN WAS ASKED FOR${EMPTY# } AND PRODUCED NOTHING FOR THEM."
              echo "::error::Other characters' clips are why the count above is not zero."
              exit 1
            fi
          fi
          if [ -n "$FAILED" ]; then
            echo "SHORTLISTS REPEAT A SPEAKER — see the lines above"
            exit 1
          fi
          echo "==========================="

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-candidates
          path: voice-candidates
