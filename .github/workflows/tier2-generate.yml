name: tier2-generate

# The Tier-2 batch generator (game-design/tier2-pipeline-spec.md). Runs the
# plain .NET tool against the Anthropic API using the repo secret (player
# authorization 2026-07-26), validates every card by script, and prints the
# full manifest to the job log between TIER2-MANIFEST markers so the cards can
# be harvested from the log (the artifact host is not reachable from the dev
# environment). Manual dispatch only — generation costs real API tokens.

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Fresh cards to generate — LEAVE EMPTY unless new people are wanted"
        required: false
        default: ""
      model:
        description: "Generation model"
        required: false
        default: "claude-sonnet-5"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # THE WRITING PROBE RIDES IN THIS WORKFLOW, and the reason is a GitHub
      # constraint rather than a design choice: `workflow_dispatch` only exposes
      # workflows that exist on the DEFAULT branch, and everything here is
      # pushed to a feature branch. A new workflow file therefore cannot be
      # dispatched at all — 404 — while dispatching a REGISTERED one against
      # this branch runs THIS branch's version of it. So the second authorised
      # API task lives in the workflow that was already the API-spend workflow.
      #
      # It runs FIRST because it is the cheaper of the two and the one with a
      # verdict riding on it, and because if the repo is in a state where the
      # cast cannot be found, that should stop the run before the expensive
      # step rather than after it.
      - name: Prove the probe finds the cast (no key, no spend)
        run: |
          dotnet run --project ledger/ConvoProbe -c Release -- --dry | tee dry.log
          grep -q "4 card(s)" dry.log || { echo "probe found the wrong cast — not spending"; exit 1; }
          if grep -q "lines=NO" dry.log; then echo "a card has no spoken lines — not spending"; exit 1; fi
          echo "cast confirmed"

      - name: What the characters actually say
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          dotnet run --project ledger/ConvoProbe -c Release -- \
            --model "claude-sonnet-5" \
            --out game-design/writing-samples.md

      - name: Commit the transcript
        run: |
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          git add game-design/writing-samples.md
          if git diff --cached --quiet; then
            echo "NO TRANSCRIPT PRODUCED — the probe wrote nothing"; exit 1
          fi
          git commit -q -m "The conversations, as they actually come out

          Generated by the writing probe against the real ConversationEngine.
          Committed because the artifact host is unreachable from the review
          environment and the log API returns a four-kilobyte tail."
          origin="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3 4; do
            if git push "$origin" HEAD:${GITHUB_REF_NAME} > push.log 2>&1; then
              echo "transcript pushed"; break
            fi
            sed "s|${GH_TOKEN}|***|g" push.log || true
            git fetch "$origin" ${GITHUB_REF_NAME} > /dev/null 2>&1 || true
            git rebase FETCH_HEAD || git rebase --abort || true
            sleep $((2 ** i))
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # THE FRESH-GENERATION STEP IS OFF BY DEFAULT, and that is a guard on
      # somebody else's money rather than tidiness.
      #
      # Jafar authorised two specific tasks: judge the conversations as output,
      # and give the SIXTY EXISTING cards the example lines they lack.
      # Generating sixty NEW characters is neither — it would spend on people
      # nobody asked for and, worse, it would mint new ids while the current
      # ones are wired into secrets, connections, schedules and promotions.
      # Five of them have already been promoted into the hand-written ring.
      #
      # So it runs only when explicitly asked. A default that spends is a
      # default that eventually spends by accident.
      - name: Generate and validate cards
        if: ${{ github.event.inputs.count != '' && github.event.inputs.count != '0' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          dotnet run --project ledger/Tier2Gen -c Release -- \
            --count "${{ github.event.inputs.count }}" \
            --model "${{ github.event.inputs.model }}" \
            --out tier2-out

      - name: Upload cards artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier2-cards
          path: tier2-out/
          if-no-files-found: warn
