name: LEDGER Windows build

# Manual trigger. Requires two secrets only:
#   UNITY_EMAIL    (Unity account email)
#   UNITY_PASSWORD (Unity account password)
# License is activated at build time (Unity Personal, no .ulf file needed).
on:
  workflow_dispatch:

# So the run can commit the review stills. Nothing else here writes.
permissions:
  contents: write

jobs:
  build-windows:
    # JAFAR'S PC, SINCE 22 AUG — he registered `ledger-pc` and its READY
    # marker landed. His GPU renders the sim ~20x faster than the cloud
    # machine's software rasteriser and the Unity install caches between
    # builds, so the round trip drops from ~28 minutes toward 6-10.
    # Builds queue while his PC is off; revert this one line to
    # `windows-latest` to move back to the cloud (and after any revert,
    # remember his machine holds the Library cache, not the cloud).
    runs-on: [self-hosted, ledger-pc]
    # GitHub's default job timeout is six hours. A stuck step therefore burns an
    # afternoon before anyone finds out, which is exactly what happened on run
    # 30218422533: the Unity install sat for thirty minutes with nothing to stop
    # it. Every long step below carries its own timeout as well, so a failure
    # says WHICH part hung rather than only that the job did.
    # Per-step caps sum to 6 (shape) + 30 (install) + 15 (build) + 25 (sim)
    # + 6 (checkout) + 1 (lint) + 2 (license) + 10 + 10 (uploads) + 1 (verdict)
    # = 106 in the worst case, so the job cap clears that with headroom — the
    # old cap of 80 could kill a run in which every step passed its own cap,
    # and the arithmetic in this comment omitted four steps (audit 2026-07-27).
    #
    # AND WHAT A HEALTHY RUN ACTUALLY COSTS, measured off run 32294117005
    # rather than budgeted: checkout 64s, lint 8s, ShapeCheck 26s, unity-setup
    # 547s, licence 6s, build 170s, sim 861s, verdict 6s, uploads 35s — about
    # 29 minutes end to end. Every cap here is a ceiling on a hang, not a
    # target, and the job cap has some eighty minutes of slack under it.
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        # SIX, AND IT WAS TWO UNTIL A CHECKOUT TIMED OUT ON 19 AUGUST.
        #
        # Run 32298151417 died with `The action 'Run actions/checkout@v4' has
        # timed out after 2 minutes` — before the licence step, so the verdict
        # read `NO PLAYER LOG` with both licence attempts `skipped` and no
        # compile errors, which is the shape this project has learnt to read
        # as a Game-layer break. It was neither. A whole round trip answered
        # nothing and the diagnosis went to the C# first.
        #
        # A good checkout takes 64 SECONDS (measured, run 32294117005) against
        # a 120-second cap, which is a margin of 1.9x on a repository whose
        # working tree is 1.3GB and grows every build — every run commits
        # stills and a per-commit verdict. That margin was always going to run
        # out; six minutes is 5.6x the observed time and costs nothing against
        # a job cap with eighty minutes spare.
        #
        # It is a ceiling on a hang, not a budget. If a checkout ever really
        # takes six minutes the repository needs pruning, not a bigger number.
        timeout-minutes: 6
        with:
          # The credential this would otherwise persist costs about 1.5KB of
          # git-config unwinding in POST-job cleanup — which matters because the
          # log API returns a fixed ~4KB tail of the job, and that cleanup is
          # what has been burying the sim's verdict.
          #
          # THIS USED TO SAY "nothing here pushes". Then the review-stills step
          # was added, which pushes, and it failed six times in a row and
          # reported success because it is `continue-on-error`. The comment was
          # true when written and the change that falsified it never came back
          # here — which is the argument for not reading a comment as evidence
          # about the code beside it.
          #
          # The trade-off still holds, so the credential stays out of the job
          # and the one step that pushes carries its own.
          persist-credentials: false

      # THE SERVICE PATH IS THE MACHINE PATH, AND THE MACHINE PATH HAS NO
      # BASH. The first probe run resolved bash only because the freshly
      # configured service still carried the configuring user's PATH; the
      # first service RESTART (bat 3, 22 Aug) washed it back to the clean
      # machine environment and every `shell: bash` step died in zero
      # seconds with "bash: command not found". cmd.exe is the one shell
      # Windows always resolves, so it bootstraps the rest: probe the
      # absolute install locations and hand the winners to every later
      # step via GITHUB_PATH — which is also how later `shell:` binaries
      # are resolved. Fail fast, named, when a tool is truly absent: the
      # alternative is dying at the first pwsh step with a twenty-minute
      # Unity install already spent. No-op on the cloud image.
      - name: tool PATH bootstrap (self-hosted parity)
        timeout-minutes: 1
        shell: cmd
        run: |
          where bash >nul 2>nul
          if not errorlevel 1 goto :bashok
          if exist "C:\Program Files\Git\bin\bash.exe" (
            >>"%GITHUB_PATH%" echo C:\Program Files\Git\bin
            echo bash found at C:\Program Files\Git\bin and put on the job PATH
            goto :bashok
          )
          echo NO bash ON THIS MACHINE - Git for Windows normally provides it.
          echo Reinstall Git for Windows on this runner, then dispatch again.
          exit /b 1
          :bashok
          where pwsh >nul 2>nul
          if not errorlevel 1 goto :pwshok
          if exist "C:\Program Files\PowerShell\7\pwsh.exe" (
            >>"%GITHUB_PATH%" echo C:\Program Files\PowerShell\7
            echo pwsh found at C:\Program Files\PowerShell\7 and put on the job PATH
            goto :pwshok
          )
          if exist "C:\LedgerTools\pwsh7\pwsh.exe" (
            >>"%GITHUB_PATH%" echo C:\LedgerTools\pwsh7
            echo pwsh found at C:\LedgerTools\pwsh7 and put on the job PATH
            goto :pwshok
          )
          echo NO pwsh ON THIS MACHINE - the build and verdict steps run on it.
          echo Run "tools/runner/3 FINISH THE BUILD MACHINE.bat" once on this
          echo runner, then dispatch again.
          exit /b 1
          :pwshok
          echo tool PATH bootstrap done.
          REM Explicit, because cmd exits with the LAST-SET errorlevel and
          REM echo/goto never clear one: a failed `where` above left 1 behind,
          REM and run 32595203790 did every append right, printed done, and
          REM still reported failure - skipping the whole build after it.
          exit /b 0

      # SELF-HOSTED PARITY: the cloud image ships `python3` on bash's
      # PATH and Jafar's PC does not (Git-bash knows only `python` and
      # `py`). The very first self-hosted run died in the lint step on
      # exactly this, ninety seconds in. A shim on GITHUB_PATH maps the
      # name once for every later bash step; on the cloud image this
      # whole step is a no-op.
      - name: python3 shim (self-hosted parity)
        timeout-minutes: 1
        shell: bash
        run: |
          # THE OUTER GUARD TESTS BY EFFECT TOO. `command -v python3`
          # SUCCEEDS on any interactive Windows account, because Microsoft
          # ships a python3.exe App Execution Alias that exists solely to
          # open the Store when run — the desktop-session agent's first run
          # (32620912473) found it, skipped the shim, and Lint died in zero
          # seconds. The service account never had the alias, which is why
          # a night of service-session runs never met it.
          if ! python3 --version >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/shim"
            # CANDIDATES ARE TESTED BY RUNNING THEM, never by existence. Run
            # 32595552209: C:\Windows\py.exe existed (machine-wide LAUNCHER)
            # but its registered interpreters were per-user, so `py -3` had
            # nothing to launch under the service account — a launcher on a
            # machine path proves nothing about the interpreter behind it.
            try() { "$@" --version >/dev/null 2>&1; }
            pick=""
            if try python; then pick="python"
            elif try py -3; then pick="py -3"
            elif try /c/LedgerTools/python312/python.exe; then pick="/c/LedgerTools/python312/python.exe"
            else
              # SELF-HEALING, so no round trips through a person's mouse:
              # python.org's zip build needs no installer (the MSI service
              # is blocked on this PC) and lands where the next run finds
              # it cached. Everything the runner executes is single-file
              # stdlib (checked 22 Aug), which the zip carries; its ._pth
              # is removed so script-directory imports work if one ever
              # grows a sibling.
              echo "no machine-visible python - fetching python.org's zip build (11 MB, one-time)"
              curl -sSL --retry 2 --retry-delay 3 -o "$RUNNER_TEMP/py-embed.zip" \
                "https://www.python.org/ftp/python/3.12.8/python-3.12.8-embed-amd64.zip"
              mkdir -p /c/LedgerTools/python312
              /c/Windows/System32/tar.exe -xf "$(cygpath -w "$RUNNER_TEMP/py-embed.zip")" -C "C:\\LedgerTools\\python312"
              rm -f /c/LedgerTools/python312/python312._pth
              if try /c/LedgerTools/python312/python.exe; then pick="/c/LedgerTools/python312/python.exe"; fi
            fi
            if [ -z "$pick" ]; then
              echo "NO WORKING PYTHON and the zip fallback failed - the reason is above."
              exit 1
            fi
            printf '#!/usr/bin/env bash\nexec %s "$@"\n' "$pick" > "$RUNNER_TEMP/shim/python3"
            chmod +x "$RUNNER_TEMP/shim/python3"
            # PROVE THE SHIM'S OWN PRODUCT RUNS before anything depends on it.
            if ! "$RUNNER_TEMP/shim/python3" --version >/dev/null 2>&1; then
              echo "the python3 shim did not run (picked: $pick)"
              exit 1
            fi
            echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
            echo "python3 -> $pick"
          fi

      # Runs in a second, before eight minutes of Unity install. Catches the one
      # compile error nothing else in the pipeline can see: LINQ used in
      # extension form in a file that does not import System.Linq. Unity is the
      # only thing that semantically compiles this tree, so without this the
      # feedback loop on that mistake is twenty minutes long.
      - name: Lint (missing usings)
        timeout-minutes: 1
        shell: bash
        run: python3 ledger/lint-usings.py ledger/Assets/Scripts ledger/Assets/Editor

      # Unity is the only thing that compiles Assets/Scripts, so a mistake in
      # its own shape — a duplicate local, a duplicate member — costs a full
      # twenty-minute round trip to discover. This builds a real Roslyn
      # compilation with NO references and keeps only the diagnostics that do
      # not need any, which is exactly that family. Runs in about fifteen
      # seconds, before the seven-minute Unity install.
      - name: Shape check (Unity layer)
        timeout-minutes: 6
        shell: bash
        run: dotnet run -c Release --project ledger/ShapeCheck -- ledger/Assets/Scripts ledger/Assets/Editor

      # THE VOCABULARY AND THE VOICES, INTO THE BUILD.
      #
      # The last build reported `speechVocab=none speechVoices=0` and both
      # were true: `Audio` reads `StreamingAssets/Voice/` and nothing was
      # filling it. So the director had been sizing every line in characters
      # instead of tokens, and every character's voice lookup returned null.
      # Neither shows as a failure — both just look like a game that prefers
      # the bank.
      #
      # NOT optional, unlike the runtime below: these are 3 MB that already
      # live in this repository, so a failure here is a bug rather than a
      # network, and it should stop the build rather than quietly ship a
      # player that cannot see its own voices.
      - name: Stage the vocabulary and voices
        timeout-minutes: 3
        shell: bash
        run: python3 tools/stage-voice-assets.py

      # THE SPEECH RUNTIME, AND IT IS ALLOWED TO FAIL.
      #
      # `Game/OnnxSpeech.cs` sits inside `#if LEDGER_ONNX` and the fetcher
      # writes that define only after every DLL is verified on disk. If the
      # download fails, no define, the file is not compiled, `Audio.Backend`
      # stays null and every route falls back to the bank — which is what the
      # game does today. A missing download costs live speech and nothing
      # else, rather than costing the build every other answer it was sent
      # for.
      #
      # PYTHON RATHER THAN POWERSHELL, because the PowerShell version could
      # only ever run inside this job and therefore shipped unexercised. It
      # was wrong three ways at once — a URL that 404s, a managed assembly
      # looked for in a package that has none, and one package fetched where
      # three are needed — and it reported success in ONE SECOND. The Python
      # runs anywhere, and it was run before it was committed.
      - name: Fetch the speech runtime (optional)
        timeout-minutes: 6
        continue-on-error: true
        shell: bash
        run: |
          python3 tools/fetch-onnxruntime.py \
            --dest ledger/Assets/Plugins/onnxruntime \
            --define ledger/Assets/csc.rsp || \
            echo "speech runtime unavailable — the backend stays off"

      - name: Install Unity
        # 30, and this is headroom rather than a measurement.
        #
        # Every install on this project whose COMPLETED timestamps have been
        # read came in at 6-8 minutes (7m35s and 7m26s on 27 July). Twice that
        # day an in-progress API snapshot appeared to show one running past
        # twenty minutes and it was simply stale — the step had already
        # finished. Do not size this cap from a job that is still running; only
        # started_at/completed_at on a finished step means anything.
        #
        # The raise still stands: the 15-minute cap produced two red builds in
        # one morning, so the slow tail is real even though it has never been
        # caught in the act, and headroom costs nothing when the install is fast.
        #
        # A cap this high no longer usefully detects "slow" — it exists to catch
        # a genuinely WEDGED install, which is what a timeout is actually for.
        # It costs nothing on a fast install and saves a twenty-minute round
        # trip on a slow one, and a build that goes red for a reason that is not
        # the code is worse than either.
        timeout-minutes: 30
        uses: buildalon/unity-setup@v2
        with:
          version-file: ledger/ProjectSettings/ProjectVersion.txt
          build-targets: StandaloneWindows64
          # The Hub updater elevates with -Verb RunAs, and a service session
          # cannot show the prompt — run 32595957001 died exactly there
          # (ENOENT on Unity Hub.exe after a silent non-install). Hub and the
          # editor are preinstalled once by tools/runner/4 INSTALL UNITY ON
          # THE BUILD MACHINE.bat; this step only resolves them.
          auto-update-hub: false

      # ACTIVATION IS THE FLAKY STEP, AND IT COSTS A WHOLE ROUND TRIP.
      #
      # On 4 August two of four builds dispatched within twenty minutes of each
      # other died here, five seconds in. A Personal licence allows a limited
      # number of concurrent activations, and this repo's whole working method
      # is parallel dispatch — CLAUDE.md says so in as many words, and it is
      # right up to a point that nobody had measured.
      #
      # What made it expensive is that a failure here is SILENT in the only
      # channel this environment can read. The job still commits a verdict, the
      # verdict says "NO PLAYER LOG — the sim did not run", and that reads
      # exactly like a compile error in the Game layer, which is the one thing
      # that cannot be checked locally. I read my own C# for several minutes
      # before checking the step list.
      #
      # So: try twice, with a pause long enough for another job's licence to be
      # returned. The first attempt cannot fail the job; the second can, so two
      # genuine failures still stop the build rather than running it unlicensed.
      - name: Activate Unity license
        id: unity_license
        timeout-minutes: 2
        continue-on-error: true
        uses: buildalon/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Wait for a licence seat
        if: steps.unity_license.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "::warning::Unity licence activation failed on the first attempt."
          Write-Host "Concurrent builds contend for a Personal licence seat. Waiting 45s."
          Start-Sleep -Seconds 45

      - name: Activate Unity license (second attempt)
        if: steps.unity_license.outcome == 'failure'
        id: unity_license_retry
        timeout-minutes: 3
        uses: buildalon/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build player
        timeout-minutes: 15
        shell: pwsh
        run: |
          # TO A FILE, not to the console.
          #
          # `-logFile -` streams the whole Unity log through the step, and a
          # compile error lands thousands of lines before the end of it. The
          # step log is a fixed ~4KB tail, so the one thing worth reading is
          # always the first thing evicted: a build broke on CS0104 and the
          # log showed nothing but licence deactivation.
          # TEE IT. Do not redirect it.
          #
          # `-logFile build-log/unity.log` looked obviously right and broke
          # the build outright: Unity exited non-zero in four seconds without
          # ever writing the file, and every run after that failed for this
          # reason while I bisected C# that was never wrong. The instrument
          # broke the thing it was measuring and then hid that it had.
          #
          # `-logFile -` is the form that works, so keep it and tee the
          # stream to a file for the greps below. `Out-Null` stops it
          # flooding the step log, which was the whole point of moving it
          # off the console in the first place.
          New-Item -ItemType Directory -Force build-log | Out-Null
          & "$env:UNITY_EDITOR_PATH" -quit -batchmode -nographics `
            -projectPath ledger `
            -buildTarget Win64 `
            -executeMethod Ledger.EditorTools.CiBuild.BuildWindows `
            -logFile - | Tee-Object -FilePath build-log/unity.log | Out-Null
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # The compiler errors, and nothing else. Same principle as the sim
            # verdict below: when a step fails, print the actionable half
            # LAST so it survives whatever fills the window afterwards.
            Write-Host "=== compile errors ==="
            $errs = @()
            if (Test-Path build-log/unity.log) {
              $errs = Select-String -Path build-log/unity.log `
                -Pattern 'error CS|Compilation failed|error:' |
                ForEach-Object { $_.Line } | Select-Object -First 40
            }
            if ($errs) { $errs | ForEach-Object { Write-Host $_ } }
            else { Get-Content build-log/unity.log -Tail 60 }
            if ($env:GITHUB_STEP_SUMMARY) {
              "## LEDGER build failed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              if ($errs) { $errs | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
              else { Get-Content build-log/unity.log -Tail 60 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
            exit $code
          }
          # SHADER ERRORS TOO. They do not fail the build, and the whole
          # post stack is shaders now — one that fails to compile makes
          # `isSupported` false and the effect silently stops existing.
          $shaderErrs = @()
          if (Test-Path build-log/unity.log) {
            $shaderErrs = Select-String -Path build-log/unity.log `
              -Pattern 'Shader error|Shader warning in' |
              ForEach-Object { $_.Line } | Select-Object -First 20
          }
          if ($shaderErrs) {
            Write-Host "=== shader diagnostics ==="
            $shaderErrs | ForEach-Object { Write-Host $_ }
          }

      - name: Run game simulation (11 in-game days — the week, the verdict, and the open city)
        shell: pwsh
        # timeout-minutes is the guard that actually works. The in-script wait
        # below is the one that reports a useful message, but it cannot be
        # trusted alone: Start-Process -PassThru hands back a Process whose
        # handle PowerShell has not cached, and WaitForExit(ms) on such an
        # object can block past its timeout instead of returning false. Run
        # 30217466971 sat in this step for 33 minutes on a 15-minute wait and
        # had to be cancelled by hand, which is 33 minutes of learning nothing.
        timeout-minutes: 25
        run: |
          New-Item -ItemType Directory -Force sim-run | Out-Null
          $exe = Resolve-Path "ledger/build/LEDGER/LEDGER.exe"
          $p = Start-Process -FilePath $exe -WorkingDirectory sim-run -PassThru -ArgumentList `
            "-simdays","11","-screen-width","1280","-screen-height","720","-screen-fullscreen","0",`
            "-force-d3d11","-logFile","player.log"
          # Wait-Process honours its timeout on the object Start-Process returns;
          # WaitForExit(ms) does not reliably.
          $timedOut = $false
          try { Wait-Process -Id $p.Id -Timeout 1440 -ErrorAction Stop }
          catch { $timedOut = $true }
          if ($timedOut) {
            Write-Host "=== simulation timed out after 24 minutes; last 80 log lines ==="
            if (Test-Path sim-run/player.log) { Get-Content sim-run/player.log -Tail 80 }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Write-Error "Simulation timed out after 24 minutes"
            exit 1
          }
          Get-Content sim-run/player.log -Tail 60
          # The two lines worth having, printed LAST so they survive every log
          # viewer that truncates from the top. The tail above is 60 lines and
          # two of them are 24-row ASCII screenshots, which is enough to push
          # the verdict out of a truncated view — and the verdict is the entire
          # reason anybody opens this step.
          Write-Host "=== verdict ==="
          Get-Content sim-run/player.log | Select-String -Pattern "SimDirector: done\.|FAILING GATES" |
            ForEach-Object { $_.Line }
          if ($p.ExitCode -ne 0) { Write-Error "Simulation reported failure (exit $($p.ExitCode))"; exit 1 }

      # THE STILLS, INTO THE REPOSITORY, BECAUSE THAT IS THE ONLY PLACE THEY CAN
      # BE LOOKED AT.
      #
      # Every screenshot this build takes goes to the artifact host below, which
      # this project's review environment is denied outright — which is why the
      # sim prints a coarse ASCII luminance grid instead. That grid caught a
      # magenta error shader once. It cannot tell moss from cobble, and the
      # first real texture pack landed three albedos out of three that needed
      # exactly that judgement: rust through the asphalt, green moss through the
      # paving, ochre rubble where red brick was asked for.
      #
      # Whether the noir tint rescues those is a question about the rendered
      # street, so the rendered street has to be visible. Same filenames every
      # run, so this overwrites rather than accumulates, and it is scoped to the
      # one directory the sim writes — nothing else is added, and nothing is
      # removed.
      - name: Commit the review stills
        if: always()
        continue-on-error: true
        shell: bash
        env:
          # The job checks out with `persist-credentials: false`, so this is the
          # only step that can push and it brings its own credential.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LICENSE_FIRST: ${{ steps.unity_license.outcome }}
          LICENSE_RETRY: ${{ steps.unity_license_retry.outcome || 'not needed' }}
        run: |
          # The 400-line body lives in tools/sim-shots-commit.sh — moved
          # there because this step sat 416 characters under the hard
          # expression ceiling that fails the workflow AT DISPATCH. The
          # two licence outcomes ride in as env below; everything else
          # the script needs is ambient runner environment.
          bash tools/sim-shots-commit.sh
      - name: Upload simulation report
        timeout-minutes: 10
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LEDGER-SimRun
          path: |
            sim-run/sim-out/**
            sim-run/player.log
          retention-days: 14

      - name: Upload build artifact
        timeout-minutes: 10
        # always(): a failing self-test simulation must not discard the built player —
        # the binary is still the thing we want to download and inspect when a run is red.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LEDGER-Windows
          path: ledger/build/LEDGER
          retention-days: 14

      # THE LAST STEP IN THE JOB, deliberately.
      #
      # The verdict was already printed at the end of the simulation step, and
      # that was not enough: two artifact uploads, a licence deactivation and
      # git cleanup all run afterwards, and the log APIs return a fixed-size
      # tail of the JOB. So the one line worth having was still being pushed
      # out of reach on exactly the runs where it matters.
      #
      # Last step, always(), nothing after it. This is the line a person reads.
      - name: Verdict
        timeout-minutes: 1
        if: always()
        shell: pwsh
        run: |
          $lines = @()
          if (Test-Path sim-run/player.log) {
            $lines = Get-Content sim-run/player.log |
              Select-String -Pattern "SimDirector: done\.|FAILING GATES" |
              ForEach-Object { $_.Line }
          }
          if (-not $lines) { $lines = @("no verdict — the run did not reach the simulation step") }

          # COMPACT ON PURPOSE. The whole "done." line is ~1.2KB and the tail
          # this has to survive is a few hundred bytes wide after cleanup. So
          # print the failing gates — which is the actionable half — and only
          # the handful of fields that say whether the run covered anything.
          $gates = $lines | Where-Object { $_ -match "FAILING GATES" }
          $done  = $lines | Where-Object { $_ -match "SimDirector: done" }
          $keys  = ""
          if ($done) {
            $keys = (($done -split " ") | Where-Object {
              $_ -match "^(coverageOk|daysSkipped|dayJobOk|verdict|pass|gatesChecked|gatesFailed|lightingOk|scoreOk|jobsDone|jobsMissed|frozenCloses|beatTried|beatClosest|beatChaseSecs|beatMarker|beatsAttended|framedBeats|framingPush|nightFull|nightNoShafts|nightNoBloom|nightUngraded|hushWalkBys|hushes|labels|fontless|blankLabels|worldText|depthTested|realBody|realBodyWhy|aoSpread|grainSpread|aoRange|grainRange|aoHit|aoDrop|grainLocal|reflHit|reflRise|reflSeen|reflWetAtAb|specHit|specRise|presetHit|presetOk|stemVolMax|stemsUnbound|stemRatio|scoreAudible|busMusic|bloomHit|bloomRise|bloomLit|checks|confronts|confrontTarget|suspicionActs|looks|remarks|loiterLooks|loiterNotices|nightRunLooks|nightRunNotices|sounds|investigations|slamInvestigations|standoffs|hushPeak|litRange|darkRange|perceptionOk|lastDay|endDayReached|loiterStaged|slamStaged|nightRunStaged|meanFrame|p95|frameAvgMs|perfOk|weekLostAs|falls|ringsSized|ringsDrawn|ringSmall|ringShadowed|ringNoMaterial|ringMax|ringLastSkip|ringRadius|slamDrewRing|slams|ringSeen|ringRise|ringLedger|ringSprites|ringParticles|ringNone|ringTransformZ|ringControl|ringPaintUsed|aoRounds|aoTypical|aoRounds2|aoRan|ringOk|captions|captionHushes|deeds|deedWitnesses|deedSlotSets|deedBestRung|deedDispatched|deedArrived|deedIntercepted|deedInFlight|deedClaims|deedMisnamed|perceptionWhy|lumaPairs)="
            }) -join " "
          }
          # A ZERO NEEDS A DENOMINATOR, AND THIS ONE HAD NONE. Run 408 on
          # 18 Aug failed in actions/checkout — every step after it skipped,
          # no repository, no Unity, no sim — and this block printed "no
          # failing gates", which is what a completely clean build prints.
          # The placeholder above was already written for exactly that case
          # and only ever reached $lines, so it went to the job summary (a
          # channel this environment cannot read) and never to the log line
          # a person actually sees.
          #
          # Three outcomes now, and they cannot be confused: gates failed,
          # gates passed AND here is how many were checked, or the sim never
          # ran. gatesChecked comes off the done line, so the middle case
          # cannot be printed by a run that has no done line to read it from.
          # Forced to a scalar string first, deliberately. `$done` comes off a
          # pipeline, so it is a string when one line matched and an ARRAY when
          # two did — and `-match` on an array returns the matching elements
          # and leaves $Matches unset, so the array case would have read a
          # stale $Matches from whatever matched last. Select-First-1 plus the
          # quotes make both shapes the same shape.
          $doneLine = "$($done | Select-Object -First 1)"
          $checked = "?"
          if ($doneLine -match "gatesChecked=(\d+)") { $checked = $Matches[1] }
          Write-Host "=== LEDGER VERDICT ==="
          if ($gates) { $gates | ForEach-Object { Write-Host $_ } }
          elseif ($done) { Write-Host "no failing gates ($checked checked)" }
          else { Write-Host "NO PLAYER LOG - the sim did not run on this commit" }
          Write-Host $keys
          Write-Host "======================"

          # AND into the job summary, which is the only channel that actually
          # survives. The log tail is a fixed ~4KB window and GitHub's own
          # post-job cleanup — licence deactivation, git config unwinding —
          # fills it entirely AFTER every user step, so no amount of moving the
          # print statement helps; that was tried three times. Artifacts are on
          # a host this environment's egress policy denies outright.
          #
          # The job summary comes back through the check-run API as output text,
          # which is what that API is for.
          if ($env:GITHUB_STEP_SUMMARY) {
            "## LEDGER sim verdict" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

          # AND THE COMPILE ERRORS LAST OF ALL, three lines at most.
          #
          # Printed first, they were still buried: post-job cleanup is six
          # kilobytes of licence deactivation and git config unwinding, and
          # the log API hands back a window smaller than that. Position is
          # the only lever, and last is the only position that works.
          #
          # Three lines because the first error is the one that matters and
          # every line after it competes with the first for the window. Two
          # builds died on one line of C# that nothing ever showed me.
          if (Test-Path build-log/unity.log) {
            $ce = Select-String -Path build-log/unity.log -Pattern 'error CS' |
              ForEach-Object { $_.Line } | Select-Object -First 3
            if ($ce) {
              Write-Host "=== COMPILE ==="
              $ce | ForEach-Object { Write-Host $_ }
            }
          }
