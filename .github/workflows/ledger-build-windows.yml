name: LEDGER Windows build

# Manual trigger. Requires two secrets only:
#   UNITY_EMAIL    (Unity account email)
#   UNITY_PASSWORD (Unity account password)
# License is activated at build time (Unity Personal, no .ulf file needed).
on:
  workflow_dispatch:

# So the run can commit the review stills. Nothing else here writes.
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    # GitHub's default job timeout is six hours. A stuck step therefore burns an
    # afternoon before anyone finds out, which is exactly what happened on run
    # 30218422533: the Unity install sat for thirty minutes with nothing to stop
    # it. Every long step below carries its own timeout as well, so a failure
    # says WHICH part hung rather than only that the job did.
    # Per-step caps sum to 6 (shape) + 30 (install) + 15 (build) + 25 (sim)
    # + 2 (checkout) + 1 (lint) + 2 (license) + 10 + 10 (uploads) + 1 (verdict)
    # = 102 in the worst case, so the job cap clears that with headroom — the
    # old cap of 80 could kill a run in which every step passed its own cap,
    # and the arithmetic in this comment omitted four steps (audit 2026-07-27).
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          # The credential this would otherwise persist costs about 1.5KB of
          # git-config unwinding in POST-job cleanup — which matters because the
          # log API returns a fixed ~4KB tail of the job, and that cleanup is
          # what has been burying the sim's verdict.
          #
          # THIS USED TO SAY "nothing here pushes". Then the review-stills step
          # was added, which pushes, and it failed six times in a row and
          # reported success because it is `continue-on-error`. The comment was
          # true when written and the change that falsified it never came back
          # here — which is the argument for not reading a comment as evidence
          # about the code beside it.
          #
          # The trade-off still holds, so the credential stays out of the job
          # and the one step that pushes carries its own.
          persist-credentials: false

      # Runs in a second, before eight minutes of Unity install. Catches the one
      # compile error nothing else in the pipeline can see: LINQ used in
      # extension form in a file that does not import System.Linq. Unity is the
      # only thing that semantically compiles this tree, so without this the
      # feedback loop on that mistake is twenty minutes long.
      - name: Lint (missing usings)
        timeout-minutes: 1
        shell: bash
        run: python3 ledger/lint-usings.py ledger/Assets/Scripts ledger/Assets/Editor

      # Unity is the only thing that compiles Assets/Scripts, so a mistake in
      # its own shape — a duplicate local, a duplicate member — costs a full
      # twenty-minute round trip to discover. This builds a real Roslyn
      # compilation with NO references and keeps only the diagnostics that do
      # not need any, which is exactly that family. Runs in about fifteen
      # seconds, before the seven-minute Unity install.
      - name: Shape check (Unity layer)
        timeout-minutes: 6
        shell: bash
        run: dotnet run -c Release --project ledger/ShapeCheck -- ledger/Assets/Scripts ledger/Assets/Editor

      - name: Install Unity
        # 30, and this is headroom rather than a measurement.
        #
        # Every install on this project whose COMPLETED timestamps have been
        # read came in at 6-8 minutes (7m35s and 7m26s on 27 July). Twice that
        # day an in-progress API snapshot appeared to show one running past
        # twenty minutes and it was simply stale — the step had already
        # finished. Do not size this cap from a job that is still running; only
        # started_at/completed_at on a finished step means anything.
        #
        # The raise still stands: the 15-minute cap produced two red builds in
        # one morning, so the slow tail is real even though it has never been
        # caught in the act, and headroom costs nothing when the install is fast.
        #
        # A cap this high no longer usefully detects "slow" — it exists to catch
        # a genuinely WEDGED install, which is what a timeout is actually for.
        # It costs nothing on a fast install and saves a twenty-minute round
        # trip on a slow one, and a build that goes red for a reason that is not
        # the code is worse than either.
        timeout-minutes: 30
        uses: buildalon/unity-setup@v2
        with:
          version-file: ledger/ProjectSettings/ProjectVersion.txt
          build-targets: StandaloneWindows64

      - name: Activate Unity license
        timeout-minutes: 2
        uses: buildalon/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build player
        timeout-minutes: 15
        shell: pwsh
        run: |
          # TO A FILE, not to the console.
          #
          # `-logFile -` streams the whole Unity log through the step, and a
          # compile error lands thousands of lines before the end of it. The
          # step log is a fixed ~4KB tail, so the one thing worth reading is
          # always the first thing evicted: a build broke on CS0104 and the
          # log showed nothing but licence deactivation.
          # TEE IT. Do not redirect it.
          #
          # `-logFile build-log/unity.log` looked obviously right and broke
          # the build outright: Unity exited non-zero in four seconds without
          # ever writing the file, and every run after that failed for this
          # reason while I bisected C# that was never wrong. The instrument
          # broke the thing it was measuring and then hid that it had.
          #
          # `-logFile -` is the form that works, so keep it and tee the
          # stream to a file for the greps below. `Out-Null` stops it
          # flooding the step log, which was the whole point of moving it
          # off the console in the first place.
          New-Item -ItemType Directory -Force build-log | Out-Null
          & "$env:UNITY_EDITOR_PATH" -quit -batchmode -nographics `
            -projectPath ledger `
            -buildTarget Win64 `
            -executeMethod Ledger.EditorTools.CiBuild.BuildWindows `
            -logFile - | Tee-Object -FilePath build-log/unity.log | Out-Null
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # The compiler errors, and nothing else. Same principle as the sim
            # verdict below: when a step fails, print the actionable half
            # LAST so it survives whatever fills the window afterwards.
            Write-Host "=== compile errors ==="
            $errs = @()
            if (Test-Path build-log/unity.log) {
              $errs = Select-String -Path build-log/unity.log `
                -Pattern 'error CS|Compilation failed|error:' |
                ForEach-Object { $_.Line } | Select-Object -First 40
            }
            if ($errs) { $errs | ForEach-Object { Write-Host $_ } }
            else { Get-Content build-log/unity.log -Tail 60 }
            if ($env:GITHUB_STEP_SUMMARY) {
              "## LEDGER build failed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              if ($errs) { $errs | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
              else { Get-Content build-log/unity.log -Tail 60 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
            exit $code
          }
          # SHADER ERRORS TOO. They do not fail the build, and the whole
          # post stack is shaders now — one that fails to compile makes
          # `isSupported` false and the effect silently stops existing.
          $shaderErrs = @()
          if (Test-Path build-log/unity.log) {
            $shaderErrs = Select-String -Path build-log/unity.log `
              -Pattern 'Shader error|Shader warning in' |
              ForEach-Object { $_.Line } | Select-Object -First 20
          }
          if ($shaderErrs) {
            Write-Host "=== shader diagnostics ==="
            $shaderErrs | ForEach-Object { Write-Host $_ }
          }

      - name: Run game simulation (11 in-game days — the week, the verdict, and the open city)
        shell: pwsh
        # timeout-minutes is the guard that actually works. The in-script wait
        # below is the one that reports a useful message, but it cannot be
        # trusted alone: Start-Process -PassThru hands back a Process whose
        # handle PowerShell has not cached, and WaitForExit(ms) on such an
        # object can block past its timeout instead of returning false. Run
        # 30217466971 sat in this step for 33 minutes on a 15-minute wait and
        # had to be cancelled by hand, which is 33 minutes of learning nothing.
        timeout-minutes: 25
        run: |
          New-Item -ItemType Directory -Force sim-run | Out-Null
          $exe = Resolve-Path "ledger/build/LEDGER/LEDGER.exe"
          $p = Start-Process -FilePath $exe -WorkingDirectory sim-run -PassThru -ArgumentList `
            "-simdays","11","-screen-width","1280","-screen-height","720","-screen-fullscreen","0",`
            "-force-d3d11","-logFile","player.log"
          # Wait-Process honours its timeout on the object Start-Process returns;
          # WaitForExit(ms) does not reliably.
          $timedOut = $false
          try { Wait-Process -Id $p.Id -Timeout 1440 -ErrorAction Stop }
          catch { $timedOut = $true }
          if ($timedOut) {
            Write-Host "=== simulation timed out after 24 minutes; last 80 log lines ==="
            if (Test-Path sim-run/player.log) { Get-Content sim-run/player.log -Tail 80 }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Write-Error "Simulation timed out after 24 minutes"
            exit 1
          }
          Get-Content sim-run/player.log -Tail 60
          # The two lines worth having, printed LAST so they survive every log
          # viewer that truncates from the top. The tail above is 60 lines and
          # two of them are 24-row ASCII screenshots, which is enough to push
          # the verdict out of a truncated view — and the verdict is the entire
          # reason anybody opens this step.
          Write-Host "=== verdict ==="
          Get-Content sim-run/player.log | Select-String -Pattern "SimDirector: done\.|FAILING GATES" |
            ForEach-Object { $_.Line }
          if ($p.ExitCode -ne 0) { Write-Error "Simulation reported failure (exit $($p.ExitCode))"; exit 1 }

      # THE STILLS, INTO THE REPOSITORY, BECAUSE THAT IS THE ONLY PLACE THEY CAN
      # BE LOOKED AT.
      #
      # Every screenshot this build takes goes to the artifact host below, which
      # this project's review environment is denied outright — which is why the
      # sim prints a coarse ASCII luminance grid instead. That grid caught a
      # magenta error shader once. It cannot tell moss from cobble, and the
      # first real texture pack landed three albedos out of three that needed
      # exactly that judgement: rust through the asphalt, green moss through the
      # paving, ochre rubble where red brick was asked for.
      #
      # Whether the noir tint rescues those is a question about the rendered
      # street, so the rendered street has to be visible. Same filenames every
      # run, so this overwrites rather than accumulates, and it is scoped to the
      # one directory the sim writes — nothing else is added, and nothing is
      # removed.
      - name: Commit the review stills
        if: always()
        continue-on-error: true
        shell: bash
        env:
          # The job checks out with `persist-credentials: false`, so this is the
          # only step that can push and it brings its own credential.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # AND IT SAYS WHAT HAPPENED SOMEWHERE READABLE. This step failed six
          # times and reported success, and the reason was undiagnosable from
          # outside: `continue-on-error` hides the exit code, and this step's log
          # sits above the fixed ~4KB tail the log API returns, which post-job
          # cleanup fills entirely. The step summary is the one channel out of a
          # job here that survives — it is how the sim verdict already gets home.
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          echo "## Review stills" >> "$GITHUB_STEP_SUMMARY"

          shopt -s nullglob
          mkdir -p game-design/sim-shots
          shots=(sim-run/sim-out/review_*.jpg)
          if [ ${#shots[@]} -eq 0 ]; then
            # NOT `exit 0`, AND THE DIFFERENCE IS THE WHOLE POINT OF THE STEP.
            # Bailing here left the PREVIOUS run's verdict.txt sitting in the
            # repository, so the one thing a catastrophically broken run
            # produces is a stale verdict that reads exactly like a fresh one.
            # The header carries the SHA, which is the only reason that has not
            # yet cost anything. A run with no stills still has a log worth
            # grepping and a ledger worth committing, so carry on.
            say "no review stills — the sim did not reach a screenshot"
          else
            say "${#shots[@]} still(s) rendered"
            cp "${shots[@]}" game-design/sim-shots/
          fi
          ls -la game-design/sim-shots/

          # AND THE VERDICT, AS A FILE IN THE REPOSITORY.
          #
          # THE ONE CHANNEL OUT OF THIS JOB THAT HAS ACTUALLY WORKED. The log
          # API returns a fixed ~4KB BYTE tail — not a line count — so
          # `tail_lines` cannot reach anything mid-log, and GitHub's own
          # post-job cleanup fills that window every time. The step summary was
          # supposed to be the answer and comes back EMPTY through the check-run
          # API. Artifacts live on a host this project's review environment is
          # denied outright.
          #
          # So every diagnostic the sim prints has been unreadable unless it
          # happened to land in the last four kilobytes, which is why three
          # separate faults tonight had to be inferred from a step's DURATION
          # or from the fact that a branch had not moved. The stills proved the
          # fix: a file in the repository can simply be read.
          #
          # Grepped rather than copied whole — player.log is megabytes, and the
          # point is the handful of lines that answer a question.
          # THE HEADER IS WRITTEN UNCONDITIONALLY, and it used to be written
          # only when there was a player.log to grep. That meant the single
          # worst kind of run — one that never reached the sim at all — left
          # the PREVIOUS run's verdict.txt sitting in the repository, freshly
          # committed by this very step, indistinguishable from a real result
          # except for a SHA on line one that a reader has to think to check.
          # Truncating here means a broken run produces a verdict that says so.
          {
            echo "# Sim verdict — ${GITHUB_SHA:0:7}"
            echo
            echo "Written by the Windows build. Overwritten every run — but"
            echo "also kept per-commit under sim-shots/runs/, so two builds"
            echo "dispatched together are two answers rather than one."
            echo "Read this instead of trying to tail the job log."
            echo
          } > game-design/sim-shots/verdict.txt

          if [ -f sim-run/player.log ]; then
            {
              # ASCII ONLY IN THE PATTERN. The places line is prefixed with a
              # section sign, and a non-ASCII byte in a grep pattern under Git
              # bash on Windows is a coin flip about encoding — the sort of
              # thing that silently matches nothing and looks like "the sim
              # never printed it".
              # Matched on distinctive ASCII substrings rather than on a
              # prefix: the places line reads "SimDirector: <section sign>4.7
              # places", so anchoring on "SimDirector: places" would match
              # nothing, and "alley eyes=" is both unique and plain.
              # `brandished a cosh` carries the HAND TIER, and it is here
              # because the tier is only in the threat gate's label — which
              # prints when the gate FAILS. That is backwards for a diagnostic:
              # `hand=hand bone` on a green run is the line that proves the
              # bought skeleton is the one holding the object, and the run that
              # needs it most is the one that passed for the wrong reason.
              grep -E "FAILING GATES|SimDirector: done\.|SimDirector: sky |SimDirector: glyphs |alley eyes=|Traffic: wheels |brandished a cosh|SimDirector: windowGlow|SceneAudit: " \
                sim-run/player.log || echo "(no SimDirector lines matched)"
            } >> game-design/sim-shots/verdict.txt
            # AND THE EDITOR-SIDE LINES, WHICH ARE IN A DIFFERENT LOG. The
            # character audit runs inside `CiBuild` — Editor, not player — so it
            # lands in unity.log and grepping player.log for it would report
            # nothing and look exactly like "the audit never ran".
            if [ -f build-log/unity.log ]; then
              {
                echo
                grep -E "CharacterAudit: |CharacterPrefab: " build-log/unity.log | head -3 \
                  || echo "CharacterAudit: (no line — the audit did not run)"
              } >> game-design/sim-shots/verdict.txt
            fi
            say "verdict.txt written ($(wc -l < game-design/sim-shots/verdict.txt) lines)"
          else
            say "no player.log — the sim did not run"
            echo "NO PLAYER LOG — the sim did not run on this commit." \
              >> game-design/sim-shots/verdict.txt
          fi

          # LAYER 3, PIXELS: what moved in the render since the last build.
          #
          # The comparison happens HERE and not in the sim, because this is the
          # only place both ledgers exist at once — the checkout carries the
          # previous run's committed copy and sim-out carries the new one. It
          # has to run BEFORE the copy below, or it would compare the new
          # ledger against itself and report, with total confidence, that
          # nothing had changed.
          #
          # Reports, does not gate. The run-to-run noise floor of a mean
          # luminance on a software rasteriser is not known yet, and rule 2 is
          # explicit that inventing it is how `nightNotDarker` came to fail at
          # 0.136 against 0.135.
          # STAMP FIRST, THEN COMPARE, and the order is the whole of it.
          #
          # The sim cannot know its own SHA; this step can. Without the stamp a
          # drift block cannot tell "the same commit built twice" (which IS the
          # noise floor) from "two different commits" (which is the change plus
          # the noise, readable as neither) — a distinction already got wrong
          # once, when a delta that was mostly a white capsule leaving every
          # frame got described as run-to-run variance.
          #
          # The first version of this stamped the file on the way into the
          # repository, i.e. AFTER the comparison had already read the unstamped
          # original — so the new side never carried a stamp and the block said
          # "commits unstamped" every run, for ever, which is exactly the
          # silent-no-op shape this project keeps producing. Stamped into a temp
          # first, compared, then moved.
          if [ -f sim-run/sim-out/frames.tsv ]; then
            { echo "# commit ${GITHUB_SHA}"; cat sim-run/sim-out/frames.tsv; } \
              > "$RUNNER_TEMP/frames-stamped.tsv"
          fi
          {
            echo
            python3 tools/frame-drift.py \
              game-design/sim-shots/frames.tsv \
              "$RUNNER_TEMP/frames-stamped.tsv" \
              || echo "FrameDrift: the drift tool itself failed"
          } >> game-design/sim-shots/verdict.txt
          if [ -f "$RUNNER_TEMP/frames-stamped.tsv" ]; then
            cp "$RUNNER_TEMP/frames-stamped.tsv" game-design/sim-shots/frames.tsv
            # COUNTED, NOT SUBTRACTED. This said `wc -l ... - 4` for the four
            # non-data lines, and adding the commit stamp above made it five —
            # a magic number falsified by the commit that changed the file it
            # counts, which is the whole shape of the stale-comment problem.
            say "frame ledger: $(grep -cv '^#\|^shot' game-design/sim-shots/frames.tsv) shot(s)"
          else
            say "NO FRAME LEDGER — the sim wrote no frames.tsv"
          fi

          # A PER-RUN COPY, SO TWO BUILDS IN FLIGHT ARE TWO ANSWERS.
          #
          # This job has no concurrency group and is dispatch-only, so N builds
          # can already run at once — nothing queues them. What made that
          # useless is right below: every run writes the SAME verdict.txt and
          # the SAME four JPEGs, so a second run landing after the first
          # overwrites the answer I dispatched it for, and I get one result for
          # two round trips without being told.
          #
          # That is the whole reason five hypotheses about the upside-down
          # player cost five serial half-hours instead of two waves. The
          # verdict is a few kilobytes of text; keeping one per commit costs
          # nothing and can never collide, because the filename carries the SHA.
          # `verdict.txt` stays exactly as it was — the latest run, where every
          # reader already looks.
          mkdir -p game-design/sim-shots/runs
          cp game-design/sim-shots/verdict.txt \
             "game-design/sim-shots/runs/${GITHUB_SHA:0:7}.txt"
          # Keep the last twenty. Unbounded, this grows a file per build for
          # ever; twenty is about a day of parallel waves, which is as far back
          # as anything has ever been read.
          ls -1t game-design/sim-shots/runs/*.txt 2>/dev/null | tail -n +21 \
            | xargs -r rm -f

          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          # SAVED BEFORE THE COMMIT, because the retry loop below has to be able
          # to put these back on top of whatever another run pushed meanwhile.
          rm -rf "$RUNNER_TEMP/ours"
          cp -r game-design/sim-shots "$RUNNER_TEMP/ours"
          git add game-design/sim-shots
          if git diff --cached --quiet; then
            say "stills identical to the committed ones — nothing to commit"
            exit 0
          fi
          git commit -m "Sim stills from ${GITHUB_SHA:0:7}

          What the street actually looks like, at the size it is played at.
          Committed because the artifact host is unreachable from the review
          environment, so an ASCII luminance grid was standing in for the
          picture."
          # REBASE BEFORE EACH ATTEMPT, because the branch moves under a
          # twenty-eight-minute build. This job checks out a commit, spends half
          # an hour rendering, and by the time it pushes there may well be newer
          # work on the branch — in which case a plain push is rejected, and
          # retrying the identical push six times just fails six times and drops
          # the stills on the floor. The retry loop was written for flaky
          # networks and reads every rejection as one.
          # THE CREDENTIAL, FOR THIS STEP ONLY — see the checkout step above.
          origin="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # REDIRECTED, NOT PIPED. `git push | sed` reports SED's exit status,
          # which is zero whatever git did — a retry loop that can never observe
          # a failure, bolted onto a step whose entire problem was failing
          # invisibly. The log is filtered afterwards so the token cannot reach
          # a public log.
          for i in 1 2 3 4 5 6; do
            if git push "$origin" HEAD:${GITHUB_REF_NAME} > "$RUNNER_TEMP/push.log" 2>&1; then
              say "pushed ${#shots[@]} still(s) to ${GITHUB_REF_NAME}"
              exit 0
            fi
            sed "s|${GH_TOKEN}|***|g" "$RUNNER_TEMP/push.log" || true
            echo "push failed, attempt $i — refetching and reapplying our outputs"
            # REAPPLIED, NOT REBASED, AND THE DIFFERENCE ONLY SHOWS UP WHEN TWO
            # BUILDS RUN AT ONCE.
            #
            # `git rebase FETCH_HEAD` replays our stills commit onto whatever
            # arrived. Against ordinary source commits that is fine, and it is
            # what this loop did for weeks. Against ANOTHER BUILD'S stills it
            # is a binary conflict on four JPEGs — rebase stops, the `|| abort`
            # below it puts the branch back, and the next five attempts push
            # the identical rejected commit and fail identically. A whole run's
            # results land nowhere, and the step's own retry logging makes it
            # read like a flaky network.
            #
            # These files are RENDERED OUTPUT, not content anybody merged, so
            # there is nothing to reconcile: the newest render of a frame is
            # the right one. Reset to what is on the branch, lay our outputs
            # back over the top, commit that. It cannot conflict. The other
            # run's per-run verdict survives untouched, because `cp` overlays
            # and its filename carries a different SHA — which is the point of
            # writing it in the first place.
            # AND "NEWEST RENDER" IS NOT "LAST TO FINISH", which is the half of
            # that reasoning the first version got wrong.
            #
            # Two builds ran together on 3 Aug. The one on the NEWER commit
            # finished first and pushed its verdict; the one on the OLDER commit
            # finished second, hit this path, and laid its own older output over
            # the top. `verdict.txt` ended up naming the earlier commit — so the
            # file every reader treats as "the latest" was the stale answer, and
            # only the SHA on line one said so. Runners vary by twenty minutes
            # here, so dispatch order tells you nothing about landing order.
            #
            # So: if what is already on the branch was rendered from a commit we
            # are a descendant of, we are newer and ours wins. Otherwise theirs
            # is newer or unrelated, and we take ONLY our per-run file — which
            # cannot collide, and is the whole reason it exists.
            if git fetch "$origin" ${GITHUB_REF_NAME} > /dev/null 2>&1; then
              git reset --hard FETCH_HEAD > /dev/null
              theirs=$(head -1 game-design/sim-shots/verdict.txt 2>/dev/null \
                       | sed -n 's/.*— \([0-9a-f]\{7\}\).*/\1/p')
              mine_wins=1
              if [ -n "$theirs" ] && ! git merge-base --is-ancestor "$theirs" "$GITHUB_SHA" 2>/dev/null; then
                mine_wins=0
              fi
              if [ "$mine_wins" = "1" ]; then
                cp -r "$RUNNER_TEMP/ours/." game-design/sim-shots/
                say "ours is newer than ${theirs:-nothing} — updating the latest verdict and stills"
              else
                mkdir -p game-design/sim-shots/runs
                cp "$RUNNER_TEMP/ours/runs/${GITHUB_SHA:0:7}.txt" \
                   game-design/sim-shots/runs/ 2>/dev/null || true
                say "a NEWER run ($theirs) already landed — keeping its stills, adding only our per-run verdict"
              fi
              git add game-design/sim-shots
              git diff --cached --quiet \
                || git commit -q -m "Sim stills from ${GITHUB_SHA:0:7}"
            else
              echo "fetch failed too — retrying the push unchanged"
            fi
            sleep $((2 ** i))
          done
          say "PUSH FAILED after 6 attempts — the stills did not land"
          exit 1

      - name: Upload simulation report
        timeout-minutes: 10
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LEDGER-SimRun
          path: |
            sim-run/sim-out/**
            sim-run/player.log
          retention-days: 14

      - name: Upload build artifact
        timeout-minutes: 10
        # always(): a failing self-test simulation must not discard the built player —
        # the binary is still the thing we want to download and inspect when a run is red.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LEDGER-Windows
          path: ledger/build/LEDGER
          retention-days: 14

      # THE LAST STEP IN THE JOB, deliberately.
      #
      # The verdict was already printed at the end of the simulation step, and
      # that was not enough: two artifact uploads, a licence deactivation and
      # git cleanup all run afterwards, and the log APIs return a fixed-size
      # tail of the JOB. So the one line worth having was still being pushed
      # out of reach on exactly the runs where it matters.
      #
      # Last step, always(), nothing after it. This is the line a person reads.
      - name: Verdict
        timeout-minutes: 1
        if: always()
        shell: pwsh
        run: |
          $lines = @()
          if (Test-Path sim-run/player.log) {
            $lines = Get-Content sim-run/player.log |
              Select-String -Pattern "SimDirector: done\.|FAILING GATES" |
              ForEach-Object { $_.Line }
          }
          if (-not $lines) { $lines = @("no verdict — the run did not reach the simulation step") }

          # COMPACT ON PURPOSE. The whole "done." line is ~1.2KB and the tail
          # this has to survive is a few hundred bytes wide after cleanup. So
          # print the failing gates — which is the actionable half — and only
          # the handful of fields that say whether the run covered anything.
          $gates = $lines | Where-Object { $_ -match "FAILING GATES" }
          $done  = $lines | Where-Object { $_ -match "SimDirector: done" }
          $keys  = ""
          if ($done) {
            $keys = (($done -split " ") | Where-Object {
              $_ -match "^(coverageOk|daysSkipped|dayJobOk|verdict|pass|lightingOk|scoreOk|jobsDone|jobsMissed|frozenCloses|beatTried|beatClosest|beatChaseSecs|beatMarker|beatsAttended|framedBeats|framingPush|nightFull|nightNoShafts|nightNoBloom|nightUngraded|hushWalkBys|hushes|labels|fontless|blankLabels|worldText|depthTested|realBody|realBodyWhy|aoSpread|grainSpread|aoRange|grainRange|aoHit|aoDrop|grainLocal|reflHit|reflRise|reflSeen|reflWetAtAb|specHit|specRise|presetHit|presetOk|stemVolMax|stemsUnbound|stemRatio|scoreAudible|busMusic|bloomHit|bloomRise|bloomLit|checks|confronts|confrontTarget|suspicionActs|looks|remarks|loiterLooks|loiterNotices|nightRunLooks|nightRunNotices|sounds|investigations|slamInvestigations|standoffs|hushPeak|litRange|darkRange|perceptionOk|lastDay|endDayReached|loiterStaged|slamStaged|nightRunStaged|meanFrame|p95|frameAvgMs|perfOk|weekLostAs|falls|ringsSized|ringsDrawn|ringSmall|ringShadowed|ringNoMaterial|ringMax|ringLastSkip|ringRadius|slamDrewRing|slams|ringSeen|ringRise|ringLedger|ringSprites|ringParticles|ringNone|ringTransformZ|ringControl|ringPaintUsed|aoRounds|aoTypical|aoRounds2|aoRan|ringOk|captions|captionHushes|deeds|deedWitnesses|deedSlotSets|deedBestRung|deedDispatched|deedArrived|deedIntercepted|deedInFlight|deedClaims|deedMisnamed|perceptionWhy|lumaPairs)="
            }) -join " "
          }
          Write-Host "=== LEDGER VERDICT ==="
          if ($gates) { $gates | ForEach-Object { Write-Host $_ } } else { Write-Host "no failing gates" }
          Write-Host $keys
          Write-Host "======================"

          # AND into the job summary, which is the only channel that actually
          # survives. The log tail is a fixed ~4KB window and GitHub's own
          # post-job cleanup — licence deactivation, git config unwinding —
          # fills it entirely AFTER every user step, so no amount of moving the
          # print statement helps; that was tried three times. Artifacts are on
          # a host this environment's egress policy denies outright.
          #
          # The job summary comes back through the check-run API as output text,
          # which is what that API is for.
          if ($env:GITHUB_STEP_SUMMARY) {
            "## LEDGER sim verdict" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

          # AND THE COMPILE ERRORS LAST OF ALL, three lines at most.
          #
          # Printed first, they were still buried: post-job cleanup is six
          # kilobytes of licence deactivation and git config unwinding, and
          # the log API hands back a window smaller than that. Position is
          # the only lever, and last is the only position that works.
          #
          # Three lines because the first error is the one that matters and
          # every line after it competes with the first for the window. Two
          # builds died on one line of C# that nothing ever showed me.
          if (Test-Path build-log/unity.log) {
            $ce = Select-String -Path build-log/unity.log -Pattern 'error CS' |
              ForEach-Object { $_.Line } | Select-Object -First 3
            if ($ce) {
              Write-Host "=== COMPILE ==="
              $ce | ForEach-Object { Write-Host $_ }
            }
          }
