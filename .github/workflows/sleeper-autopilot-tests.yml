name: Sleeper autopilot tests

# Installed web apps download dist/SleeperAutopilot.gs as their updates, so a
# stale or broken build must never land unnoticed.
on:
  push:
    paths:
      - "fantasy/**"
      - ".github/workflows/sleeper-autopilot-tests.yml"
  pull_request:
    paths:
      - "fantasy/**"
      - ".github/workflows/sleeper-autopilot-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fantasy/apps-script
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web app tests
        run: node --test test/*.test.js
      - name: Bundled build is current
        run: node dev/bundle.js --check
