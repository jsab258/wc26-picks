name: LEDGER install supervisor scheduled task

# RULING 2026-09-07, VERBATIM: "The bot must not depend on a window staying
# open. It died at 11:30 today because that window was closed and the only
# signal I had was silence. Install the three daemons as a Windows
# scheduled task that starts at logon and restarts on failure." This is
# that install, run ON THE MACHINE ITSELF through the self-hosted runner,
# so it can happen while Jafar is away from the PC.
#
# WHAT IT RUNS. tools/runner/install-scheduled-task.ps1, which registers
# tools/runner/launch-supervisor.py (never tools/supervise.py directly - see
# that file's own docstring for why the extra door matters) to start at
# Jafar's logon and restart on failure, then reads the result BACK from
# Windows rather than trusting its own exit code, per rule 4.
#
# WHY workflow_dispatch ALONE IS NOT ENOUGH YET. GitHub only dispatches a
# workflow_dispatch workflow that already exists on the DEFAULT BRANCH
# (main); this file lives on the working branch, exactly the situation
# ledger-probe-unreal.yml already hit and already solved. Same fix, same
# reasoning: a push that touches this workflow or the installer it runs
# fires it directly, needing no access to main, and it stays additionally
# dispatchable for whenever it does reach main.
#
# WHEN THIS FILE REACHES main, DELETE THE PUSH TRIGGER. It is a workaround
# for a permission boundary (pushing only to the working branch), not a
# design, and workflow_dispatch already works correctly the moment this
# file is on the default branch.
#
# NOT EXPENSIVE, SO NOT GATED BEHIND A SENTINEL FILE THE WAY THE UNREAL
# PROBE IS. Registering a scheduled task and reading it back costs seconds,
# not the tens of minutes a cold engine build costs, so this fires on every
# push that touches its own files rather than waiting for a deliberate
# sentinel flip - the project law that expensive jobs are opt-in does not
# name this one.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ledger-install-supervisor-task.yml'
      - 'tools/runner/install-scheduled-task.ps1'
      - 'tools/runner/launch-supervisor.py'
      - 'tools/runner/single_instance.py'
      - 'tools/runner/process-query.ps1'

permissions:
  contents: write

# A SECOND DISPATCH WHILE ONE IS STILL RUNNING QUEUES RATHER THAN RACES:
# two installer runs touching the same scheduled task at once is exactly
# the kind of concurrent write this project's CI rules say to scope a
# group around. Not cancel-in-progress: a run already mid-install must
# finish, not be cut off with the task half-registered.
concurrency:
  group: ledger-install-supervisor-task
  cancel-in-progress: false

jobs:
  install-supervisor-task:
    runs-on: [self-hosted, ledger-pc]
    # A CEILING ON A HANG, NOT A TARGET. Every step below measures single
    # digits of minutes at most; this is generous headroom, not an estimate
    # of how long the install should take.
    timeout-minutes: 20

    steps:
      # THE COMPLETE BOOTSTRAP, VERBATIM, from ledger-probe-unreal.yml,
      # which paid for it (task 006 names the duplication and queues the
      # dedup; until that lands, every self-hosted workflow using pwsh
      # copies this whole block rather than a shortened one, because a
      # shortened copy is exactly what broke it the first time).
      - name: Checkout
        timeout-minutes: 6
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: tool PATH bootstrap (self-hosted parity)
        timeout-minutes: 1
        shell: cmd
        run: |
          call tools\runner\bootstrap-paths.cmd
          exit /b %ERRORLEVEL%

      # THE INSTALL AND ITS OWN VERIFICATION, BOTH INSIDE THE SCRIPT BEING
      # INSTALLED. install-scheduled-task.ps1 is written to be runnable by
      # hand on the PC as well as from here, so its printed lines are the
      # evidence, captured into a file rather than left in a log tail per
      # the CI rule that the evidence channel is a file committed by CI.
      #
      # RUN AS A CHILD PROCESS (`& pwsh -File ...`), NOT DOT-SOURCED OR
      # CALLED IN-PROCESS. The installer ends on `exit 0` / `exit 1`, and
      # PowerShell's `exit` inside a script invoked in the CURRENT session
      # (dot-sourcing, or the call operator on a .ps1 run in-process) tears
      # down the whole host process, not just that script - which would
      # skip every line below it in this same step, including the ones that
      # write the evidence file. A separate pwsh.exe child keeps its `exit`
      # scoped to itself and reports its code back through $LASTEXITCODE.
      - name: Install and verify the scheduled task
        id: install
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $out = "production/pc-ops/scheduled-task-verify.txt"
          New-Item -ItemType Directory -Force -Path "production/pc-ops" | Out-Null
          $sha = $env:GITHUB_SHA
          if ($sha) { $sha = $sha.Substring(0, [Math]::Min(7, $sha.Length)) } else { $sha = "SHA-UNKNOWN" }
          $header = @(
            "# LEDGER scheduled task install/verify - $sha @$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())",
            "# Line 1 names the commit this was measured on.",
            "# Installs tools/runner/launch-supervisor.py (wraps tools/supervise.py,",
            "# unmodified) as a Windows scheduled task. Ruling 2026-09-07.",
            ""
          )
          $header | Set-Content $out -Encoding utf8
          $installOutput = & pwsh -NoProfile -File "tools\runner\install-scheduled-task.ps1" 2>&1
          $installExit = $LASTEXITCODE
          $installOutput | ForEach-Object { $_.ToString() } | Add-Content $out
          "installerExitCode=$installExit" | Add-Content $out
          Write-Host (Get-Content $out -Raw)
          if ($installExit -ne 0) { exit 1 }

      # THE SILENCE PROBLEM ITSELF (ruling point 4), ANSWERED BY READING
      # AN EXISTING CHANNEL RATHER THAN BUILDING A SECOND TRANSPORT.
      # pc-inbox already carries a de-facto heartbeat: tools/inbox-read.py's
      # own outbound accounting climbs once per telegram-bot sweep, which is
      # how the 11:30 outage was actually noticed (a refused-count that
      # always climbed had stopped moving). Keeping all three daemons alive
      # is what keeps that counter moving again; this step only reports how
      # fresh that branch is, so the same evidence file also answers "is
      # the existing signal reaching GitHub right now" without adding
      # anything Jafar or the studio has to learn to read.
      # SAFE.DIRECTORY, THE SAME WAY THE COMMIT STEP BELOW ALREADY SETS IT.
      # A first run failed here with "detected dubious ownership in
      # repository at 'C:/actions-runner-ledger/_work/wc26-picks/wc26-picks'"
      # - git's own guard against operating in a directory owned by a
      # different account than the one running it, which is exactly the
      # self-hosted runner's shape. Not a second approach: this is the
      # identical GIT_CONFIG_* trio the commit step and
      # ledger-probe-unreal.yml already carry, applied here too so the
      # heartbeat read actually runs instead of failing on its first git
      # call.
      # THE SUPERVISOR'S OWN STATUS, CARRIED OFF THE MACHINE BY THE ONE
      # THING THAT CAN READ IT. tools/supervise.py writes
      # game-design/pc-jobs/supervisor-status.txt every 60 seconds, naming
      # each daemon's state, its last words, and whether the give-up rule
      # has stopped one. That file has never been published anywhere: it is
      # on his disk and reaches nobody.
      #
      # WHY THAT MATTERS AND WHY THE EXISTING HEARTBEAT DOES NOT COVER IT.
      # The pc-inbox counters only move when the BOT pushes, so they answer
      # "is the bot working" with the bot's own hand. On 2026-09-07 the
      # supervisor and the watcher were alive and the bot had not pushed for
      # ten hours, and nothing anywhere could say why. This step reads the
      # file the supervisor already writes and commits it, which is the
      # existing channel this project trusts: a file committed by CI.
      # NO SECOND TRANSPORT, no new daemon, no new format.
      #
      # ABSENCE IS PUBLISHED TOO. A missing file means the supervisor has
      # not written one since it started, which is itself the answer, so it
      # is recorded in words rather than left as an empty section.
      #
      # A1, FOUND ON REVIEW: THE ENVIRONMENT'S OWN SHA, NOT `git
      # rev-parse`. This step ran `git rev-parse --short HEAD` in pwsh
      # with none of the GIT_CONFIG_* trio the bash steps set, inside a
      # `_work` checkout git had already refused once for dubious
      # ownership, so the landed copy of this file shipped an EMPTY sha on
      # line 1. The restart workflow's own status step never had this
      # fault because it already read its commit the same way; this step
      # now matches it.
      # WHY THE BOT'S RECORDS NEVER LEAVE HIS DISK. Read-only, and it
      # exists because guessing ran out. Since 11:30 UTC on 2026-09-07 the
      # bot has written records locally (outboxRefusals moved 304 to 305)
      # while pc-inbox took nothing, and a deliberate restart at 23:48 that
      # verifiably brought back a process running today's code did not
      # change it. So the fault is not staleness and not a wedged poll loop;
      # both were tried and both were wrong. `inbox.push_pending` reports
      # its reason to a console window nobody reads, which is the same shape
      # as the bug that started this day.
      #
      # NOTHING HERE WRITES OR PUSHES. It asks his checkout four questions
      # and commits the answers. A fix guessed from here would be a third
      # guess; this is to see.
      #
      # NO CREDENTIAL VALUE IS EVER PRINTED. The remote URL is reported as
      # its host and path only, the helper by NAME, and `ls-remote` output
      # is reduced to the sha it returned.
      - name: Ask his checkout why nothing is pushed
        if: always()
        continue-on-error: true
        timeout-minutes: 4
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $out = "production/pc-ops/push-diagnosis.txt"
          New-Item -ItemType Directory -Force -Path "production/pc-ops" | Out-Null
          $repo = "C:\Users\Jafar\wc26-picks"
          $L = @(
            "# LEDGER push diagnosis - $($env:GITHUB_SHA.Substring(0,7)) @$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())",
            "# Line 1 names the commit this was read on. READ ONLY: nothing here",
            "# writes to his checkout, pushes, or prints any credential value.",
            "diagRepo=$($repo -replace ' ','~') diagRepoExists=$(Test-Path $repo)")
          if (-not (Test-Path "$repo\.git")) {
            $L += "NOTHING MEASURED - no git checkout at that path, so none of the four questions could be asked."
          } else {
            # NOTHING INTERACTIVE, EVER. credential.helper is "manager",
            # which is Git Credential Manager and CAN open a window. On a
            # runner nobody is sitting at, that window is an infinite hang,
            # and the 4 minute step timeout then kills the step before it
            # writes a single line. That is what happened on the 2592c14 run:
            # the other two evidence files updated and this one did not.
            $env:GIT_TERMINAL_PROMPT = "0"
            $env:GCM_INTERACTIVE = "never"
            $env:GIT_ASKPASS = "echo"
            $env:GCM_PROVIDER = "generic"
            $g = @("-c", "safe.directory=*", "-C", $repo)
            # THE EVIDENCE IS WRITTEN BEFORE THE RISKY CALLS AND APPENDED TO
            # AFTER, which is the amendment a director made to the restart
            # job an hour ago and which this step did not have. A step whose
            # whole output is buffered until it finishes has no output at all
            # when it is killed, and a killed step is exactly when the reason
            # matters most.
            $L -join "`n" | Set-Content $out -Encoding utf8
            function Say($line) { $line | Add-Content $out -Encoding utf8; Write-Host $line }
            $L = @()
            # Q1: does the remote answer AS HIM, and what does it hold?
            $t0 = Get-Date
            $ls = (& git @g ls-remote origin refs/heads/pc-inbox 2>&1 | Out-String).Trim()
            $secs = [math]::Round(((Get-Date) - $t0).TotalSeconds, 1)
            $sha = if ($ls -match "^([0-9a-f]{40})") { $Matches[1] } else { "none" }
            Say "lsRemoteExit=$LASTEXITCODE lsRemoteSec=$secs lsRemoteSha=$sha"
            if ($sha -eq "none") {
              Say "lsRemoteSaid=$((($ls -split "`r?`n") | Select-Object -First 2 | ForEach-Object { $_ -replace ' ','~' }) -join '/')"
            }
            # Q2: where does the LOCAL parent pointer think it is? A tip that
            # names a commit the remote never took is the shape of a push
            # that reported success and sent nothing.
            $tip = (& git @g rev-parse --verify --quiet "refs/ledger-inbox/tip^{commit}" 2>&1 | Out-String).Trim()
            Say "localTipRef=$(if ($tip) { $tip.Substring(0, [Math]::Min(40, $tip.Length)) } else { 'unset' })"
            # Q3: how much is waiting on his disk, against what the branch holds.
            foreach ($d in @("production\inbox", "production\outbound", "production\rulings")) {
              $p = Join-Path $repo $d
              $n = if (Test-Path $p) { @(Get-ChildItem $p -File -ErrorAction SilentlyContinue).Count } else { -1 }
              Say "onDisk_$($d -replace '\\','_')=$n"
            }
            # Q4: the remote and the helper, by NAME only.
            $url = (& git @g config --get remote.origin.url 2>&1 | Out-String).Trim()
            $safe = if ($url -match "://[^/]*@?([^/]+)/(.+)$") { "$($Matches[1])/$($Matches[2])" } else { "unreadable" }
            Say "remoteHostPath=$($safe -replace ' ','~')"
            $helper = (& git @g config --get credential.helper 2>&1 | Out-String).Trim()
            Say "credentialHelper=$(if ($helper) { ($helper -split '\s+')[0] } else { 'none-configured' })"
            # Q5: CAN IT WRITE, WHICH ls-remote NEVER ASKED. A read that
            # answers in 0.4s proves the host is reachable and says nothing
            # about whether a PUSH is authorised; the credential manager can
            # hold a read token while a write is refused. --dry-run does the
            # full handshake and updates no ref.
            $tipSha = (& git @g rev-parse --verify --quiet "refs/ledger-inbox/tip^{commit}" 2>&1 | Out-String).Trim()
            if ($tipSha -match "^[0-9a-f]{40}$") {
              $dry = (& git @g push --dry-run --force origin "$($tipSha):refs/heads/pc-inbox" 2>&1 | Out-String).Trim()
              Say "pushDryRunExit=$LASTEXITCODE"
              Say "pushDryRunSaid=$((($dry -split "`r?`n") | Select-Object -First 3 | ForEach-Object { $_ -replace ' ','~' }) -join '/')"
            } else {
              Say "pushDryRunExit=nothing-measured pushDryRunSaid=no-local-tip-to-offer"
            }
            # Q6: THE RECEIPTS ALREADY ON HIS DISK CARRY MESSAGE IDS, and a
            # receipt is written only AFTER Telegram accepted the message. So
            # the delivery evidence exists on that machine whether or not the
            # push ever works, and reading it does not need the push fixed.
            #
            # SIXTEEN, NOT FOUR, AND THE WIDENING IS A CORRECTION. At four
            # this read showed ids 30, 29, 28 and 27, all sent after the bot
            # was restarted at 01:18 UTC, and that was written up as "his
            # phone kept receiving". Four newest receipts cannot say whether
            # anything was sent in the fourteen hours BEFORE them, which is
            # exactly the interval the claim was about. Sixteen reaches back
            # past the last pushed receipt (reply-24 at 2026-09-07T11:19:36Z)
            # so the gap either shows ids in it or is proven empty. The cap
            # announces itself below rather than trimming in silence.
            $od = Join-Path $repo "production\outbound"
            if (Test-Path $od) {
              $askedReceipts = 16
              $allR = @(Get-ChildItem $od -File -Filter '*.receipt.txt' -ErrorAction SilentlyContinue)
              $newest = @($allR | Sort-Object LastWriteTime -Descending | Select-Object -First $askedReceipts)
              Say "receiptsOnDisk=$($allR.Count) newestShown=$($newest.Count)/$askedReceipts$(if ($allR.Count -gt $newest.Count) { " (+$($allR.Count - $newest.Count) older not shown)" } else { " (every receipt on this disk is shown)" })"
              foreach ($r in $newest) {
                $body = (Get-Content $r.FullName -Raw -ErrorAction SilentlyContinue)
                $f = if ($body -match "(?m)^file:\s*(.+)$") { $Matches[1].Trim() } else { "?" }
                $mid = if ($body -match "(?m)^messageId:\s*(\d+)") { $Matches[1] } else { "none" }
                $sent = if ($body -match "(?m)^sent:\s*(.+)$") { $Matches[1].Trim() } else { "?" }
                Say "receipt file=$($f -replace ' ','~') messageId=$mid sent=$($sent -replace ' ','~')"
              }
            }
            Say "diagNote=reads-plus-one-push-dry-run/no-ref-was-updated-and-nothing-was-sent"
          }
          if ($L.Count -gt 0) { $L -join "`n" | Set-Content $out -Encoding utf8 }
          Write-Host (Get-Content $out -Raw)

      # STOP THEORISING AND RUN THE SWEEP. Four hypotheses have now been
      # raised about why nothing leaves his PC and four have been refuted by
      # measurement: the bot is dead (uptime), the poll loop is wedged (a
      # clean restart changed nothing), credentials refuse writes
      # (pushDryRunExit=0), and the offline work sits downstream of the poll
      # (fixed, restarted onto the fix, still nothing). Guessing a fifth time
      # is not a method.
      #
      # `--send-outbox` IS AN EXISTING ENTRY POINT that performs exactly one
      # outbox pass and returns, printing what it did. It is not a new
      # mechanism and it is what the bot's own loop calls. Running it here
      # answers the question by doing the thing: either the sweep works, in
      # which case Jafar gets the message that has been waiting since this
      # afternoon and the fault is in the LOOP that calls it, or it fails and
      # prints the reason that has been going to a console nobody reads all
      # day.
      #
      # IT IS ALLOWED TO SEND, deliberately, and that is the one thing here
      # that is not read-only. Receipts make a second send impossible: a
      # message with a receipt is skipped as already sent, which the outbox
      # selftest proves. It never opens config.local; the tool reads it
      # itself and prints nothing from it.
      # RE-ENABLED 2026-09-08 BY JAFAR, overruling the director note kept
      # below: "Re-enable the CI sweep step: it is the sender already proven
      # to deliver, and the queued correction has passed review." The
      # director retired it because it races the bot's own loop; whether that
      # loop sweeps at all was never measured, and is now measured separately
      # by botSweepPasses in the supervisor status rather than assumed. The
      # hazard it was retired for, sending a message before its review lands,
      # is real and is answered by not committing a message until the ruling
      # on it has landed, which is a discipline rather than a switch.
      #
      # THE HISTORY, KEPT: this step SENT message id 31 at 02:34:14Z. A push
      # touching this workflow fired the run, and its sweep sent a brief
      # whose headline a director had refused fifteen minutes earlier.
      - name: Run one outbox sweep on his machine and print what it says
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          # ABSOLUTE, AND THIS LINE IS THE MISSING sweepStatus LINE. A
          # relative $out is resolved at WRITE time, and the status writes
          # below sit inside Push-Location $repo, so every one of them
          # landed in his checkout instead of the runner workspace and
          # never reached the commit. Ruled 2026-09-08, section 4.
          $out = Join-Path (Get-Location).Path "production/pc-ops/outbox-sweep.txt"
          New-Item -ItemType Directory -Force -Path "production/pc-ops" | Out-Null
          $repo = "C:\Users\Jafar\wc26-picks"
          $sha = if ($env:GITHUB_SHA) { $env:GITHUB_SHA.Substring(0,7) } else { "SHA-UNKNOWN" }
          "# LEDGER one outbox sweep - $sha @$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" |
            Set-Content $out -Encoding utf8
          "# Line 1 names the commit this was run on. This step SENDS: it runs" | Add-Content $out
          "# tools/runner/telegram-bot.py --send-outbox once, which is the same" | Add-Content $out
          "# pass the bot's own loop makes. Streamed, so a timeout still leaves" | Add-Content $out
          "# everything it learned." | Add-Content $out
          if (-not (Test-Path "$repo\tools\runner\telegram-bot.py")) {
            "sweepStatus=NOTHING-MEASURED reason=no-bot-at-that-path" | Add-Content $out
          } else {
            $py = $null
            foreach ($c in @("$repo\tools\voice-live\env-export\Scripts\python.exe",
                             "$env:USERPROFILE\miniconda3\python.exe", "python")) {
              if (Test-Path $c) { $py = $c; break }
              try { & $c --version *> $null; if ($LASTEXITCODE -eq 0) { $py = $c; break } } catch { }
            }
            if (-not $py) {
              "sweepStatus=NOTHING-MEASURED reason=no-python-found" | Add-Content $out
            } else {
              "sweepPython=$($py -replace ' ','~')" | Add-Content $out
              # -u AND A HARD WAIT, because the first attempt produced NOT
              # ONE LINE in six minutes and then died with the step. Two
              # things could do that, and both are fixed here rather than
              # guessed between: python block-buffers stdout when it is a
              # pipe rather than a console, so even a process that ran fine
              # would show nothing until it exited; and a process that truly
              # hangs never exits, so a pipeline that appends on completion
              # appends never. -u makes each line appear as it happens, and
              # the redirect plus a bounded wait means a hang still leaves
              # the lines it reached, which is the half that names WHERE.
              $raw = Join-Path $env:RUNNER_TEMP "sweep-raw.txt"
              Remove-Item $raw -Force -ErrorAction SilentlyContinue
              Remove-Item "$raw.err" -Force -ErrorAction SilentlyContinue
              Push-Location $repo
              $proc = Start-Process -FilePath $py -PassThru -NoNewWindow -ArgumentList @("-u", "tools\runner\telegram-bot.py", "--send-outbox") -RedirectStandardOutput $raw -RedirectStandardError "$raw.err"
              $waited = 0
              while (-not $proc.HasExited -and $waited -lt 180) {
                Start-Sleep -Seconds 3
                $waited += 3
              }
              if (-not $proc.HasExited) {
                "sweepStatus=HUNG sweepWaitedSec=$waited sweepNote=killed-after-the-wait/lines-below-are-where-it-got-to" | Add-Content $out
                try { $proc.Kill() } catch { }
                Start-Sleep -Seconds 2
              } else {
                "sweepStatus=EXITED sweepWaitedSec=$waited sweepExitCode=$($proc.ExitCode)" | Add-Content $out
              }
              Pop-Location
              foreach ($f in @($raw, "$raw.err")) {
                if (Test-Path $f) {
                  $lines = @(Get-Content $f -ErrorAction SilentlyContinue)
                  "sweepStream=$(Split-Path $f -Leaf) sweepLines=$($lines.Count)" | Add-Content $out
                  $lines | Select-Object -Last 40 | Add-Content $out
                  if ($lines.Count -gt 40) { "(+$($lines.Count - 40) earlier line(s) not shown)" | Add-Content $out }
                }
              }
            }
          }
          Write-Host (Get-Content $out -Raw)

      - name: Push the return half from his machine and print what it says
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          # ABSOLUTE, AND THIS LINE IS THE MISSING sweepStatus LINE. A
          # relative $out is resolved at WRITE time, and the status writes
          # below sit inside Push-Location $repo, so every one of them
          # landed in his checkout instead of the runner workspace and
          # never reached the commit. Ruled 2026-09-08, section 4.
          $out = Join-Path (Get-Location).Path "production/pc-ops/inbox-flush.txt"
          New-Item -ItemType Directory -Force -Path "production/pc-ops" | Out-Null
          $repo = "C:\Users\Jafar\wc26-picks"
          $sha = if ($env:GITHUB_SHA) { $env:GITHUB_SHA.Substring(0,7) } else { "SHA-UNKNOWN" }
          "# LEDGER one inbox flush - $sha @$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" |
            Set-Content $out -Encoding utf8
          "# Line 1 names the commit this was run on. This step PUSHES the" | Add-Content $out
          "# return half: his messages and the bot's own receipts, onto" | Add-Content $out
          "# pc-inbox. It sends nothing and loads no credentials. The return" | Add-Content $out
          "# half stopped at 2026-09-07 11:30 UTC. The sending half stopped too" | Add-Content $out
          "# and recovered at the 01:18 UTC restart on the 8th; this half did not," | Add-Content $out
          "# which is why the studio went on calling the channel dead after it sent." | Add-Content $out
          "# THE READING THIS STEP NOW EXISTS FOR: does the return push SUCCEED." | Add-Content $out
          "# Every git call the bot makes is non-interactive and bounded since" | Add-Content $out
          "# 2026-09-08, so a credential prompt fails in words in seconds rather" | Add-Content $out
          "# than hanging. NON-INTERACTIVE FAILURE IS NOT A REPAIRED RETURN PATH:" | Add-Content $out
          "# read ok= and detail= below, and pcInboxHeadShort in the verify step," | Add-Content $out
          "# before calling it fixed. Last measurement: HUNG at 150s, 12 waiting." | Add-Content $out
          if (-not (Test-Path "$repo\tools\runner\telegram-bot.py")) {
            "flushStatus=NOTHING-MEASURED reason=no-bot-at-that-path" | Add-Content $out
          } else {
            $py = $null
            foreach ($c in @("$repo\tools\voice-live\env-export\Scripts\python.exe",
                             "$env:USERPROFILE\miniconda3\python.exe", "python")) {
              if (Test-Path $c) { $py = $c; break }
              try { & $c --version *> $null; if ($LASTEXITCODE -eq 0) { $py = $c; break } } catch { }
            }
            if (-not $py) {
              "flushStatus=NOTHING-MEASURED reason=no-python-found" | Add-Content $out
            } else {
              "flushPython=$($py -replace ' ','~')" | Add-Content $out
              # A10, RULED 2026-09-08: WHICH CODE IS ON DISK. The bot and
              # this step both run tools/runner/telegram-bot.py out of his
              # checkout, and a HUNG from the OLD interactive git looks
              # identical to a HUNG from the new bounded one. Without this
              # key the first run after the fix cannot be told from the
              # last run before it.
              $head = (& git -c safe.directory=* -C $repo rev-parse --short HEAD 2>&1 | Out-String).Trim()
              "flushRepoHead=$($head -replace '\s','~')" | Add-Content $out
              $raw = Join-Path $env:RUNNER_TEMP "flush-raw.txt"
              Remove-Item $raw -Force -ErrorAction SilentlyContinue
              Remove-Item "$raw.err" -Force -ErrorAction SilentlyContinue
              Push-Location $repo
              $proc = $null
              try {
                $proc = Start-Process -FilePath $py -PassThru -NoNewWindow -ArgumentList @("-u", "tools\runner\telegram-bot.py", "--flush-inbox") -RedirectStandardOutput $raw -RedirectStandardError "$raw.err"
              } catch {
                "flushStatus=NOT-STARTED reason=$($_.Exception.GetType().Name)" | Add-Content $out
              }
              # THE STATUS LINE IS WRITTEN ON EVERY PATH, AND TO THE RUNNER'S
              # FILE: $out is absolute because both status writes here sit
              # inside Push-Location, and the sweep step's relative $out is
              # how its status line landed in his checkout instead (ruling
              # 2026-09-08, section 4). A status key that can go missing
              # cannot tell a hang from a clean exit.
              if ($null -eq $proc) {
                "flushStatus=NO-PROCESS flushWaitedSec=0" | Add-Content $out
              } else {
                $waited = 0
                while (-not $proc.HasExited -and $waited -lt 90) {
                  Start-Sleep -Seconds 3
                  $waited += 3
                }
                if (-not $proc.HasExited) {
                  "flushStatus=HUNG flushWaitedSec=$waited flushNote=killed-after-the-wait/lines-below-are-where-it-got-to" | Add-Content $out
                  try { $proc.Kill() } catch { }
                  Start-Sleep -Seconds 2
                } else {
                  "flushStatus=EXITED flushWaitedSec=$waited flushExitCode=$($proc.ExitCode)" | Add-Content $out
                }
              }
              Pop-Location
              foreach ($f in @($raw, "$raw.err")) {
                if (Test-Path $f) {
                  $lines = @(Get-Content $f -ErrorAction SilentlyContinue)
                  "flushStream=$(Split-Path $f -Leaf) flushLines=$($lines.Count)" | Add-Content $out
                  $lines | Select-Object -Last 40 | Add-Content $out
                  if ($lines.Count -gt 40) { "(+$($lines.Count - 40) earlier line(s) not shown)" | Add-Content $out }
                } else {
                  "flushStream=$(Split-Path $f -Leaf) flushLines=nothing-measured reason=no-such-file" | Add-Content $out
                }
              }
            }
          }
          Write-Host (Get-Content $out -Raw)

      - name: Publish the supervisor's own status
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $out = "production/pc-ops/supervisor-status.txt"
          New-Item -ItemType Directory -Force -Path "production/pc-ops" | Out-Null
          $src = "C:\Users\Jafar\wc26-picks\game-design\pc-jobs\supervisor-status.txt"
          $sha = $env:GITHUB_SHA
          if ($sha) { $sha = $sha.Substring(0, [Math]::Min(7, $sha.Length)) } else { $sha = "SHA-UNKNOWN" }
          $stamp = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $head = @(
            "# LEDGER supervisor status as CI read it - $sha @$stamp",
            "# Line 1 names the commit this was read on.",
            "# Copied verbatim from the supervisor's own file on his PC.",
            "# It is written there every 60s and was published nowhere until",
            "# this step existed, which is why a bot that stopped at 11:30 on",
            "# 2026-09-07 could not say so.",
            "statusSource=$($src -replace ' ','~')")
          if (Test-Path $src) {
            $item = Get-Item $src
            $ageSec = [int]((Get-Date).ToUniversalTime() - $item.LastWriteTimeUtc).TotalSeconds
            $body = Get-Content $src -Raw -ErrorAction SilentlyContinue
            $lines = @($body -split "`r?`n").Count
            $head += "statusFound=yes statusBytes=$($item.Length) statusLines=$lines statusAgeSec=$ageSec"
            # THE AGE IS THE READING, not the presence. A file written once
            # and then abandoned looks identical to a live one until it is
            # asked how old it is.
            $head += "statusFresh=$(if ($ageSec -le 180) { 'yes' } else { 'NO-stale-by-' + $ageSec + 's' })"
            $head += ""
            $head += $body
          } else {
            $head += "statusFound=no statusBytes=0 statusLines=0 statusAgeSec=nothing-measured"
            $head += "NOTHING MEASURED - the supervisor has written no status file at that path, so nothing here says which daemons are up."
          }
          $head -join "`n" | Set-Content $out -Encoding utf8
          Write-Host ($head | Select-Object -First 9 | Out-String)

      - name: Read the existing pc-inbox channel, without adding a new one
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"
        run: |
          set -u
          OUT=production/pc-ops/scheduled-task-verify.txt
          echo "" >> "$OUT"
          echo "# The existing channel, read rather than duplicated (ruling point 4)." >> "$OUT"
          if git fetch -q origin pc-inbox 2>/tmp/pcinbox.err && git rev-parse -q --verify FETCH_HEAD >/dev/null 2>&1; then
            SHORT="$(git rev-parse --short FETCH_HEAD)"
            WHEN="$(git show -s --format=%ct FETCH_HEAD)"
            NOW="$(date -u +%s)"
            AGE=$(( NOW - WHEN ))
            echo "pcInboxReachable=true pcInboxHeadShort=$SHORT pcInboxLastCommitAgeSec=$AGE" >> "$OUT"
            echo "pcInboxNote=this-branch-is-the-studios-own-de-facto-heartbeat;no-new-transport-was-built" >> "$OUT"
          else
            ERR="$(tr '\n' ' ' < /tmp/pcinbox.err 2>/dev/null | cut -c1-160)"
            echo "pcInboxReachable=false pcInboxError=${ERR:-unknown}" >> "$OUT"
          fi
          cat "$OUT"

      # THE EVIDENCE CHANNEL. A run that measured nothing says so rather
      # than committing a stale checkout's file as its own, staged BY NAME,
      # and this step carries the failure itself (Amendment A2): a push
      # that did not land is not a landed run, so continue-on-error stays
      # off here even though the two steps above have it on.
      - name: Commit the install verification
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"
        run: |
          set -u
          OUT=production/pc-ops/scheduled-task-verify.txt
          if [ ! -f "$OUT" ] || ! grep -q "installerExitCode=" "$OUT"; then
            printf '# LEDGER scheduled task install/verify - %s\nNO RUN - the install step did not reach its end (outcome: %s).\nNothing was measured on this commit; do not read an older file as this run.\n' \
              "$(git rev-parse --short HEAD)" "${INSTALL_OUTCOME:-unknown}" > "$OUT"
          fi
          git config user.name "LEDGER installer"
          git config user.email "installer@ledger.local"
          git add -- "$OUT"
          # AND THE SUPERVISOR STATUS, BY NAME. Staging only $OUT is
          # how B1 happened in the probe workflow on 2026-09-07: the
          # clip step wrote a file the commit step never named, so
          # every run wrote it and no run kept it. -A so its ABSENCE
          # is staged too, because a run where the supervisor wrote no
          # status must not leave the last run's copy standing as if
          # it were this one's.
          git add -A -- production/pc-ops/supervisor-status.txt 2>/dev/null || true
          # AND THE PUSH DIAGNOSIS, BY NAME. Third time today that a
          # step wrote a file this step did not name; checked with a
          # script that lists written paths against staged paths
          # rather than by eye, because by eye missed it twice.
          git add -A -- production/pc-ops/push-diagnosis.txt 2>/dev/null || true
          git add -A -- production/pc-ops/outbox-sweep.txt 2>/dev/null || true
          git add -A -- production/pc-ops/inbox-flush.txt 2>/dev/null || true
          git diff --cached --quiet && { echo "install verification unchanged; nothing to commit"; exit 0; }
          git commit -m "scheduled task install/verify from $(git rev-parse --short HEAD)"
          BR="${GITHUB_REF_NAME}"
          for i in 1 2 3; do
            # --autostash IS LOAD-BEARING AND IT IS THE RUN 27 INCIDENT.
            # Without it this reads "cannot pull with rebase: You have
            # unstaged changes", the || swallows the error, all three pushes
            # are then rejected as behind, and the evidence dies on the
            # agent. Run 27 lost its whole probe result that way on
            # 2026-09-07. A job always leaves unstaged changes, so the guard
            # as written could never fire on the case it existed for.
            # Reproduced both ways on a fixture before this line changed:
            # without it rc=128 and nothing lands, with it rc=0 and the
            # evidence reaches the remote beside the other commit.
            # The abort STAYS. --autostash fixes the refusal to start;
            # it does not fix a genuine content conflict, and that
            # leaves a rebase in progress which would strand the
            # checkout for every later job on this runner.
            git pull --rebase --autostash --no-edit origin "$BR" || \
              git rebase --abort || true
            if git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BR}"; then
              echo "install verification pushed to $BR"; exit 0
            fi
            sleep $((i * 5))
          done
          echo "could not push the install verification; it is committed locally on the agent"
          exit 1
