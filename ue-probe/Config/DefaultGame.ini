[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=(A=0,B=0,C=0,D=0)
ProjectName=LedgerProbe

; A COOK NEEDS SOMETHING TO COOK. The project has no Content directory: it
; is a code probe, not a game with maps. Run 10's cook ran for 32 seconds
; and then returned Error_UnknownCookFailure, and a contentless project is
; the first thing to rule out. Pointing at an engine map that certainly
; exists tests the cook path itself without inventing a binary asset, which
; the standing constraint forbids doing by hand anyway.
[/Script/UnrealEd.ProjectPackagingSettings]
+MapsToCook=(FilePath="/Engine/Maps/Entry")

; PHASE B NEEDS THREE MESHES AND THIS IS THE ONLY WAY THEY REACH THE
; PACKAGED BUILD. The street is built at runtime out of the engine's own
; cube, cylinder and plane, referenced by path from C++ rather than by a
; hard reference the cooker can follow, so the cooker has no way to know
; they are wanted and would ship a game whose every LoadObject returned
; null. That failure looks exactly like an empty street: 0 of 593 pieces,
; a black frame, and nothing saying why. The emitter checks all three
; meshes and names the missing one on the scene line, and this line is
; what stops it happening.
;
; The directory rather than the three assets: /Engine/BasicShapes holds a
; handful of primitives and their material, and naming the directory
; cannot go stale the way three asset paths can.
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")

; PHASE C NEEDS ONE MATERIAL AND A SCRIPT MAKES IT, WHICH IS THE WHOLE OF D1
; MEASUREMENT (a). Unreal compiles materials in the editor, so a packaged
; game can only INSTANCE one that already exists; the vignette therefore
; needs exactly one binary asset and no human may make it.
; tools/ue/make_base_material.py creates /Game/Ledger/M_LedgerSurface in the
; cook step and the result is committed as a build product.
;
; THE COOK CANNOT FIND IT ON ITS OWN. Nothing references the material: the
; runtime loads it by path, exactly as it loads the three basic shapes, so
; the cooker has no reference to follow and would ship a game whose
; LoadObject returns null. That failure looks like an untextured street with
; every count green, which is the shape of fault this project keeps paying
; for. The directory rather than the asset, so adding a second material
; later cannot go stale.
+DirectoriesToAlwaysCook=(Path="/Game/Ledger")

; WHERE THE SCRIPT RUNS AND WHY THERE, since the workflow step has a size
; ceiling and this file does not. The material is made AFTER the cold and
; warm game builds, so the cold build number stays a cold build number, and
; BEFORE BuildCookRun, so the asset exists to be cooked. The editor target is
; built immediately before it, because a C++ project cannot open the editor
; without its editor module and an unattended editor asked to rebuild one
; simply exits; BuildCookRun's own -build then finds it up to date, so the
; compile is moved rather than repeated. A failure at any point there leaves
; materialBase=MISSING on the vignette verdict and an untextured street,
; which is a finding and not a lost run.
