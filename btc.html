<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BTC Crowd Sentiment</title>
<style>
  :root { --bg:#0f1115; --card:#191d24; --line:#2a2f3a; --txt:#e8eaed; --dim:#9aa0aa;
          --bull:#2fae73; --bear:#c94a58; --neu:#6f89d2; --warn:#fbbf24; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0 auto; background:var(--bg); color:var(--txt);
         font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         padding:14px 12px 40px; max-width:560px; }
  h1 { font-size:18px; margin:0 0 2px; letter-spacing:.5px; }
  h2 { font-size:13px; color:var(--dim); text-transform:uppercase; letter-spacing:.4px;
       margin:18px 0 8px; font-weight:600; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:12px 14px; margin-bottom:10px; }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; }
  .tile .k { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
  .tile .v { font-size:22px; font-weight:800; margin-top:2px; font-variant-numeric:tabular-nums; }
  .tile .s { color:var(--dim); font-size:12px; margin-top:2px; }
  .up { color:var(--bull); } .down { color:var(--bear); }
  .signal { border-radius:14px; padding:12px 14px; margin-bottom:10px; border:1px solid var(--line);
            background:var(--card); }
  .signal .head { font-weight:800; font-size:15px; }
  .signal .body { color:var(--dim); font-size:13px; margin-top:4px; }
  .sig-bullish .head { color:var(--bull); } .sig-bearish .head { color:var(--bear); }
  .sig-warn .head { color:var(--warn); }
  .bar { display:flex; height:34px; border-radius:9px; overflow:hidden; gap:2px; background:var(--bg); }
  .seg { display:flex; align-items:center; justify-content:center; min-width:2px;
         font-size:12px; font-weight:700; color:#0f1115; }
  .seg.bull { background:var(--bull); } .seg.bear { background:var(--bear); } .seg.neu { background:var(--neu); }
  .legend { display:flex; gap:14px; margin-top:8px; font-size:12px; color:var(--dim); flex-wrap:wrap; }
  .legend .chip { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px;
                  vertical-align:-1px; }
  svg { display:block; width:100%; height:auto; }
  .axis { fill:var(--dim); font-size:10px; }
  .note { color:var(--dim); font-size:12px; margin-top:6px; }
  .status { color:var(--dim); font-size:12px; text-align:center; margin-top:16px; }
  .err { color:#f87171; }
  #tip { position:fixed; pointer-events:none; background:#232936; border:1px solid var(--line);
         color:var(--txt); font-size:12px; padding:5px 8px; border-radius:8px; display:none;
         z-index:10; white-space:nowrap; }
  details { margin-top:14px; }
  summary { color:var(--dim); font-size:13px; cursor:pointer; }
  table { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px;
          font-variant-numeric:tabular-nums; }
  th, td { text-align:right; padding:4px 6px; border-bottom:1px solid var(--line); }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--dim); font-weight:600; }
  .tblwrap { overflow-x:auto; }
  a { color:var(--neu); }
</style>
</head>
<body>
<h1>₿ BTC — Crowd Sentiment</h1>
<div class="sub">StockTwits crowd · Fear &amp; Greed · price-target consensus · contrarian meter</div>
<div id="out"><div class="status">Loading…</div></div>
<div id="tip"></div>

<script>
const C = { bull:'#2fae73', bear:'#c94a58', neu:'#6f89d2' };
const fmtUsd = v => v==null ? '—' : '$' + Math.round(v).toLocaleString('en-US');
const fmtK = v => v==null ? '—' : (v>=1000 ? '$'+(v/1000).toFixed(v%1000?1:0)+'k' : '$'+v);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const SIGNALS = {
  no_data:               {cls:'',            head:'No data yet',
    body:'Run the GitHub Action (Actions → BTC sentiment tracker → Run workflow) to take the first snapshot.'},
  calibrating:           {cls:'sig-warn',    head:'Calibrating baseline…',
    body:'The contrarian meter needs ~8 snapshots (≈2 days) before extremes can be measured against a baseline.'},
  crowd_bearish_extreme: {cls:'sig-bullish', head:'Crowd extremely bearish → contrarian bullish zone',
    body:'Bearishness is far above its own recent baseline. Per the fade-the-herd framework, one-sided crowds mark potential bottoms.'},
  crowd_bullish_extreme: {cls:'sig-bearish', head:'Crowd extremely bullish → contrarian bearish zone',
    body:'Bullishness is far above its own recent baseline — the mirror-image top signal.'},
  leaning_bearish:       {cls:'',            head:'Crowd leaning bearish',
    body:'More bears than bulls, but not yet an extreme vs. the baseline.'},
  leaning_bullish:       {cls:'',            head:'Crowd leaning bullish',
    body:'More bulls than bears, but not yet an extreme vs. the baseline.'},
  neutral:               {cls:'',            head:'Crowd mixed / neutral',
    body:'No meaningful skew vs. the baseline right now.'},
};

const tip = document.getElementById('tip');
function showTip(html, x, y){
  tip.innerHTML = html; tip.style.display = 'block';
  const pad = 12, w = tip.offsetWidth;
  tip.style.left = Math.min(x + pad, innerWidth - w - 6) + 'px';
  tip.style.top = (y + pad) + 'px';
}
function hideTip(){ tip.style.display = 'none'; }

function lineChart(rows, key, {color, fmt, yMin=null, yMax=null, band=null}){
  const W=536, H=150, L=44, R=8, T=10, B=22;
  const pts = rows.map(r => ({ts:r.ts, v:r[key]})).filter(p => p.v!=null);
  if (pts.length < 2) return `<div class="note">Not enough history yet — chart appears after a few snapshots.</div>`;
  const t0 = Date.parse(pts[0].ts), t1 = Date.parse(pts[pts.length-1].ts) || t0+1;
  let lo = yMin!=null ? yMin : Math.min(...pts.map(p=>p.v));
  let hi = yMax!=null ? yMax : Math.max(...pts.map(p=>p.v));
  if (hi-lo < 1e-9){ hi += 1; lo -= 1; }
  const pad=(hi-lo)*0.08; if(yMin==null) lo-=pad; if(yMax==null) hi+=pad;
  const X = ts => L + (Date.parse(ts)-t0)/(t1-t0||1)*(W-L-R);
  const Y = v => T + (1-(v-lo)/(hi-lo))*(H-T-B);
  const path = pts.map((p,i)=>`${i?'L':'M'}${X(p.ts).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  const area = path + `L${X(pts[pts.length-1].ts).toFixed(1)},${H-B}L${L},${H-B}Z`;
  const ticks = [lo+(hi-lo)*0.1, (lo+hi)/2, hi-(hi-lo)*0.1].map(v =>
    `<text class="axis" x="${L-5}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${fmt(v)}</text>
     <line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="#2a2f3a" stroke-width="1"/>`).join('');
  const d0 = new Date(t0), d1 = new Date(t1);
  const dl = d => `${d.getUTCMonth()+1}/${d.getUTCDate()}`;
  const bandRect = band ? `<rect x="${L}" y="${Y(band[1])}" width="${W-L-R}" height="${Math.max(0,Y(band[0])-Y(band[1]))}" fill="${color}" opacity="0.07"/>` : '';
  const id = 'ch' + Math.random().toString(36).slice(2,8);
  const svg = `<svg id="${id}" viewBox="0 0 ${W} ${H}">
    ${bandRect}${ticks}
    <path d="${area}" fill="${color}" opacity="0.12"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
    <line class="cross" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="#9aa0aa" stroke-width="1" opacity="0"/>
    <circle class="dot" r="4" fill="${color}" stroke="#0f1115" stroke-width="2" opacity="0"/>
    <text class="axis" x="${L}" y="${H-6}">${dl(d0)}</text>
    <text class="axis" x="${W-R}" y="${H-6}" text-anchor="end">${dl(d1)}</text>
    <rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" class="hover"/>
  </svg>`;
  queueMicrotask(()=>{
    const el = document.getElementById(id); if(!el) return;
    const data = pts;
    const hover = el.querySelector('.hover'), cross = el.querySelector('.cross'), dot = el.querySelector('.dot');
    const toSvgX = evt => {
      const r = el.getBoundingClientRect();
      return (evt.clientX - r.left) / r.width * W;
    };
    hover.addEventListener('mousemove', evt => {
      const sx = toSvgX(evt);
      let best=0, bd=1e18;
      data.forEach((p,i)=>{ const d=Math.abs(X(p.ts)-sx); if(d<bd){bd=d;best=i;} });
      const p = data[best];
      cross.setAttribute('x1',X(p.ts)); cross.setAttribute('x2',X(p.ts)); cross.setAttribute('opacity',1);
      dot.setAttribute('cx',X(p.ts)); dot.setAttribute('cy',Y(p.v)); dot.setAttribute('opacity',1);
      const d = new Date(p.ts);
      showTip(`${d.getUTCMonth()+1}/${d.getUTCDate()} ${String(d.getUTCHours()).padStart(2,'0')}:00 UTC — <b>${fmt(p.v)}</b>`, evt.clientX, evt.clientY);
    });
    hover.addEventListener('mouseleave', ()=>{ cross.setAttribute('opacity',0); dot.setAttribute('opacity',0); hideTip(); });
  });
  return svg;
}

function histogram(targets, spot){
  if (!targets || !targets.length) return `<div class="note">No explicit price targets found in the latest sample.</div>`;
  const BUCKET = 5000;
  const buckets = new Map();
  targets.forEach(t => { const b = Math.floor(t/BUCKET)*BUCKET; buckets.set(b,(buckets.get(b)||0)+1); });
  const keys = [...buckets.keys()].sort((a,b)=>a-b);
  const W=536, H=170, L=34, R=8, T=12, B=30;
  const maxN = Math.max(...buckets.values());
  const lo = keys[0], hi = keys[keys.length-1]+BUCKET;
  const span = Math.max(hi-lo, BUCKET);
  const X = v => L + (v-lo)/span*(W-L-R);
  const bw = Math.max(3, (W-L-R)*BUCKET/span - 2);
  const bars = keys.map(k => {
    const n = buckets.get(k), h = Math.max(2, n/maxN*(H-T-B));
    return `<g class="hbar" data-k="${k}" data-n="${n}">
      <rect x="${X(k)+1}" y="${H-B-h}" width="${bw}" height="${h}" fill="${C.neu}" rx="3"/>
      ${n===maxN?`<text class="axis" x="${X(k)+1+bw/2}" y="${H-B-h-4}" text-anchor="middle" fill="#e8eaed">${n}</text>`:''}
    </g>`;
  }).join('');
  const spotLine = (spot && spot>=lo-BUCKET && spot<=hi+BUCKET)
    ? `<line x1="${X(spot)}" x2="${X(spot)}" y1="${T}" y2="${H-B}" stroke="#e8eaed" stroke-width="1.5" stroke-dasharray="4 3"/>
       <text class="axis" x="${X(spot)}" y="${T-2}" text-anchor="middle" fill="#e8eaed">spot ${fmtK(spot)}</text>` : '';
  const xticks = keys.filter((k,i)=> i%Math.ceil(keys.length/6)===0 )
    .map(k=>`<text class="axis" x="${X(k)+1+bw/2}" y="${H-10}" text-anchor="middle">${fmtK(k)}</text>`).join('');
  const id = 'hg' + Math.random().toString(36).slice(2,8);
  queueMicrotask(()=>{
    const el = document.getElementById(id); if(!el) return;
    el.querySelectorAll('.hbar').forEach(g=>{
      g.addEventListener('mousemove', evt=>{
        const k=+g.dataset.k, n=+g.dataset.n;
        showTip(`${fmtK(k)}–${fmtK(k+BUCKET)}: <b>${n}</b> target${n>1?'s':''}`, evt.clientX, evt.clientY);
      });
      g.addEventListener('mouseleave', hideTip);
    });
  });
  return `<svg id="${id}" viewBox="0 0 ${W} ${H}">${bars}${spotLine}${xticks}</svg>`;
}

function sentimentBar(s){
  if (s.bull_pct==null) return `<div class="note">No sentiment sample yet.</div>`;
  const seg = (cls,pct,label) => pct>0 ? `<div class="seg ${cls}" style="flex:${pct}" title="${label} ${pct}%">${pct>=12?pct+'%':''}</div>` : '';
  return `<div class="bar">
      ${seg('bull', s.bull_pct, 'Bullish')}${seg('neu', s.neutral_pct, 'Neutral')}${seg('bear', s.bear_pct, 'Bearish')}
    </div>
    <div class="legend">
      <span><span class="chip" style="background:${C.bull}"></span>Bullish ${s.bull_pct}%</span>
      <span><span class="chip" style="background:${C.neu}"></span>Neutral ${s.neutral_pct}%</span>
      <span><span class="chip" style="background:${C.bear}"></span>Bearish ${s.bear_pct}%</span>
    </div>`;
}

function historyTable(rows){
  if (!rows.length) return '';
  const r = rows.slice(-40).reverse();
  return `<details><summary>Data table (${rows.length} snapshots)</summary><div class="tblwrap">
    <table><thead><tr><th>Time (UTC)</th><th>Spot</th><th>Bull%</th><th>Bear%</th><th>F&amp;G</th><th>Median target</th><th>Bear z</th></tr></thead>
    <tbody>${r.map(s=>{
      const d=new Date(s.ts);
      return `<tr><td>${d.getUTCMonth()+1}/${d.getUTCDate()} ${String(d.getUTCHours()).padStart(2,'0')}:00</td>
        <td>${fmtUsd(s.spot)}</td><td>${s.bull_pct??'—'}</td><td>${s.bear_pct??'—'}</td>
        <td>${s.fng??'—'}</td><td>${fmtK(s.target_median)}</td><td>${s.bear_z??'—'}</td></tr>`;
    }).join('')}</tbody></table></div></details>`;
}

async function load(){
  const out = document.getElementById('out');
  let latest, history;
  try {
    [latest, history] = await Promise.all([
      fetch('data/latest.json', {cache:'no-store'}).then(r=>r.json()),
      fetch('data/history.json', {cache:'no-store'}).then(r=>r.json()),
    ]);
  } catch(e) {
    out.innerHTML = `<div class="status err">Could not load data files (${esc(e.message)}). If you opened this file directly, serve it over HTTP.</div>`;
    return;
  }
  const sig = SIGNALS[latest.signal] || SIGNALS.neutral;
  const chg = latest.spot_change_24h;
  const updated = latest.ts ? new Date(latest.ts) : null;

  out.innerHTML = `
    <div class="signal ${sig.cls}">
      <div class="head">${sig.head}</div>
      <div class="body">${sig.body}</div>
    </div>

    <div class="tiles">
      <div class="tile"><div class="k">BTC spot</div><div class="v">${fmtUsd(latest.spot)}</div>
        <div class="s ${chg>0?'up':chg<0?'down':''}">${chg==null?'':(chg>0?'+':'')+chg.toFixed(1)+'% 24h'}</div></div>
      <div class="tile"><div class="k">Fear &amp; Greed</div><div class="v">${latest.fng??'—'}</div>
        <div class="s">${latest.fng_label??''}</div></div>
      <div class="tile"><div class="k">Sample</div><div class="v">${latest.n_posts??'—'}</div>
        <div class="s">posts · ${latest.method==='llm'?'Claude-classified':latest.method==='rules'?'rule-classified':'—'}</div></div>
      <div class="tile"><div class="k">Median target</div><div class="v">${fmtK(latest.target_median)}</div>
        <div class="s">${latest.n_targets??0} targets · ${latest.targets_below_spot_pct!=null?latest.targets_below_spot_pct+'% below spot':''}</div></div>
    </div>

    <h2>Crowd sentiment (latest sample)</h2>
    <div class="card">${sentimentBar(latest)}</div>

    <h2>Bearish % over time</h2>
    <div class="card">${lineChart(history,'bear_pct',{color:C.bear, fmt:v=>v.toFixed(0)+'%', yMin:0, yMax:100})}
      <div class="note">Contrarian read: extremes vs. this line's own baseline matter, not the level itself. Bear z-score now: <b>${latest.bear_z??'n/a'}</b></div></div>

    <h2>Price-target consensus vs. spot</h2>
    <div class="card">${histogram(latest.targets, latest.spot)}
      <div class="note">Explicit $-targets extracted from posts. A crowd anchored well below spot = "everyone waiting for lower".</div></div>

    <h2>BTC spot</h2>
    <div class="card">${lineChart(history,'spot',{color:C.neu, fmt:fmtK})}</div>

    <h2>Fear &amp; Greed index</h2>
    <div class="card">${lineChart(history,'fng',{color:C.bull, fmt:v=>v.toFixed(0), yMin:0, yMax:100})}
      <div class="note">&le;25 = extreme fear, &ge;75 = extreme greed.</div></div>

    ${historyTable(history)}
    <div class="status">${updated?`Updated ${updated.toUTCString()}`:''} · auto-refreshed every 6h by GitHub Actions</div>`;
}

load();
</script>
</body>
</html>
